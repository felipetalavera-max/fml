<script>
'use strict';
const CHAPTER = { number: 25, title: 'El principio de máxima entropía', minutes: 7, language: 'es', next: '../ch26/' };

/* ---------- helpers de dibujo del capítulo (los genéricos, copiados del cap. 24) ---------- */
// Estimación de densidad: tiza = la muestra y la distribución empírica · ámbar = la distribución elegida p (y su parámetro w) ·
// rosa (local) = la previa p₀ y la característica Φ · violeta = la restricción (λ, la franja) y la regularización.
const HUE = { emp: COL.chalk, p: COL.task, pri: COL.rat, cx: COL.real, ok: COL.good, bad: COL.bad };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500, font = UI } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, font, o: 0 }); show(e, t0); return e; };
// Texto con subíndices y superíndices: 'p_{w}', 'e^{w}'. Con t0 = null queda visible desde el inicio. e._set(str) lo reescribe. No anida llaves.
const aSYM = /([αβεγδηθφρσλμξΦΨΠΛΩΣΔ‖ℜℝ√∑∏⟹⟺≈∼∞⊤†∈∃→←↦′″⌊⌋½])/;                                   // símbolos que van siempre en la fuente matemática
const aFill = (e, str, size, font) => {
  e.replaceChildren();
  let prev = 0;
  str.split(/([_^]\{[^}]*\})/).forEach(s => {
    if (!s) return;
    const k = /^[_^]\{/.test(s) ? (s[0] === '_' ? 1 : -1) : 0, dy = k > 0 ? size * .22 : k < 0 ? -size * .38 : 0;
    (k ? s.slice(2, -1) : s).split(aSYM).filter(q => q).forEach((q, n) => { mk('tspan', { dy: n ? 0 : dy - prev, ...(k ? { 'font-size': size * .68 } : {}), ...(aSYM.test(q) && font !== MATH ? { 'font-family': MATH } : {}) }, e).textContent = q; });
    prev = dy;
  });
};
const aTx = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500, font = MATH } = {}) => {
  const e = T(p, '', { x, y, size, fill, anchor, weight, font, o: t0 == null ? 1 : 0 });
  aFill(e, str, size, font); e._set = s => aFill(e, s, size, font);
  if (t0 != null) show(e, t0);
  return e;
};
// Varias piezas de aTx en una línea: [texto, color, fuente, tamaño]; t0 puede ser una lista con un instante por pieza.
const aRow = (p, parts, x, y, t0, opts = {}) => { const xs = [], els = parts.map(([str, fill, font, size], k) => { xs.push(x); const e = aTx(p, str, x, y, Array.isArray(t0) ? t0[k] : t0, { ...opts, fill: fill || COL.chalk, ...(font ? { font } : {}), ...(size ? { size } : {}) }); x += e.getComputedTextLength(); return e; }); els.xs = xs; els.end = x; return els; };
const aNote = (p, str) => aTx(p, str, 1570, 884, .4, { size: 22, fill: COL.dim, anchor: 'end', font: UI });
const aTitle = (p, str) => text(p, str, 100, 130, .3, { size: 30, fill: COL.task, weight: 600 });
const aSq = (p, x, y, col, lab, { line = false, dash = null, dot = false } = {}) => { mk(line ? 'path' : dot ? 'circle' : 'rect', line ? { d: `M${x} ${y - 8}h30`, stroke: col, 'stroke-width': 4, fill: 'none', ...(dash ? { 'stroke-dasharray': dash } : {}) } : dot ? { cx: x + 15, cy: y - 8, r: 9, fill: col } : { x: x + 6, y: y - 17, width: 18, height: 18, fill: col }, p); return aTx(p, lab, x + 42, y, null, { size: 22, fill: COL.dim, font: UI }); };   // entrada de leyenda
const aSetA = (e, o) => { Object.entries(o).forEach(([k, v]) => e.setAttribute(k, typeof v === 'number' ? v.toFixed(1) : v)); return e; };

/* aMATH:begin — cuentas del capítulo, sin dibujo (se prueban aparte con Node) */
const aSum = v => v.reduce((s, u) => s + u, 0);
const aRng = seed => () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
// --- Ejemplo ilustrativo: X = las seis caras de un dado cargado. aD es la distribución D, que el aprendiz no conoce.
const aK = 6, aD = [.07, .10, .13, .17, .23, .30], aU = Array(aK).fill(1 / aK);
const aPhi = j => j + 1;                                                                  // la única característica (N = 1): el valor de la cara de índice j
const aDraw = (seed, n, d = aD) => { const r = aRng(seed); return Array.from({ length: n }, () => { let u = r(), j = 0; while (j < d.length - 1 && u >= d[j]) { u -= d[j]; j++; } return j; }); };
const aSeed = 43, aMs = 60, aS = aDraw(aSeed, aMs);
const aCnt = S0 => { const c = Array(aK).fill(0); S0.forEach(j => c[j]++); return c; };
const aEmp = S0 => aCnt(S0).map(c => c / S0.length);                                      // la distribución empírica
const aMean = p => aSum(p.map((v, j) => v * aPhi(j)));                                    // E_p[Φ]
const aEnt = p => -aSum(p.map(v => v > 0 ? v * Math.log(v) : 0));                         // entropía H(p), con logaritmo natural
const aKL = (p, q) => aSum(p.map((v, j) => v > 0 ? v * Math.log(v / q[j]) : 0));          // entropía relativa D(p ‖ q)
const aLL = (S0, p) => aSum(S0.map(j => Math.log(p[j]))) / S0.length;                     // (1/m) Σ log p(x_i): el objetivo de (12.1), dividido por m
const aCn = aCnt(aS), aDh = aEmp(aS), aMu = aMean(aDh), aMuD = aMean(aD);
// --- Distribuciones de Gibbs (12.9) con previa p0 y característica Φ:  p_w[x] = p0[x] e^{w Φ(x)} / Z(w).
const aZ = (w, p0 = aU) => aSum(p0.map((v, j) => v * Math.exp(w * aPhi(j))));
const aGibbs = (w, p0 = aU) => { const z = aZ(w, p0); return p0.map((v, j) => v * Math.exp(w * aPhi(j)) / z); };
// (12.10):  G(w) = (1/m) Σ log(p_w[x_i] / p0[x_i]) − λ‖w‖₁  =  w · E_D̂[Φ] − log Z(w) − λ|w|   (aquí N = 1).
const aGw = (w, lam, S0 = aS, p0 = aU) => { const pw = aGibbs(w, p0); return aSum(S0.map(j => Math.log(pw[j] / p0[j]))) / S0.length - lam * Math.abs(w); };
// El dual (12.12), inf_w λ‖w‖₁ − (1/m) Σ log p_w[x_i], por descenso de gradiente proximal: el gradiente de la parte suave es E_{p_w}[Φ] − E_D̂[Φ],
// su constante de Lipschitz es a lo sumo (6 − 1)²/4 (una varianza), y la norma L1 entra por el umbral suave. Se itera hasta que w deja de cambiar.
const aSoftT = (v, t) => v > t ? v - t : v < -t ? v + t : 0;
const aDual = (lam, mu = aMu, p0 = aU) => { const eta = 4 / 25; let w = 0, it = 0; for (; it < 200000; it++) { const nw = aSoftT(w - eta * (aMean(aGibbs(w, p0)) - mu), eta * lam); if (Math.abs(nw - w) < 1e-15) { w = nw; break; } w = nw; } return { lam, w, it, p: aGibbs(w, p0) }; };
const aLam = .25, aSol = aDual(aLam), aSol0 = aDual(0), aPs = aSol.p, aWs = aSol.w, aW0 = aSol0.w;
const aGs = aGw(aWs, aLam), aPrim = aKL(aPs, aU), aMuS = aMean(aPs), aFeas = p => Math.abs(aMean(p) - aMu) <= aLam + 1e-9;
// --- Otras muestras del mismo tamaño, para ver (12.5): sus promedios empíricos.
const aOth = Array.from({ length: 8 }, (_, k) => aMean(aEmp(aDraw(aSeed + 101 + k, aMs))));
// --- Tres distribuciones que cumplen la restricción con el mismo promedio que la solución: la de Maxent, una con dos picos (caras 3 y 5) y una en U.
const aMixV = (A, B, q) => A.map((v, i) => v + (B[i] - v) * q);
const aTwo = (() => { const p = Array(aK).fill(0); p[4] = (aMuS - 3) / 2; p[2] = 1 - p[4]; return p; })();
const aPk = aMixV(aPs, aTwo, .6);
const aUsh = (() => { const p = [0, .1, .1, .1, .1, 0]; p[5] = (aMuS - 1.4 - .6) / 5; p[0] = .6 - p[5]; return p; })();
// --- Ejemplo 12.1 del libro (MAP): enfermedad rara y un análisis de laboratorio positivo.
const aPd = .005, aPosD = .98, aNegN = .95, aMapD = aPosD * aPd, aMapN = (1 - aNegN) * (1 - aPd);
// --- Moneda de (12.3): muestra ilustrativa de 20 tiradas con sesgo .7.
const aCoinM = 20, aCoinH = (() => { const r = aRng(41); let n = 0; for (let i = 0; i < aCoinM; i++) if (r() < .7) n++; return n; })();
// --- Comprobaciones. 1: tres candidatas; la de mayor verosimilitud es la más cercana a la empírica.
const aQ1 = [['uni', aU], ['mix', aMixV(aDh, aU, .4)], ['rev', aDh.slice().reverse()]], aQ1r = 1;
// 2: tres distribuciones que cumplen la restricción; Maxent elige la de mayor entropía.
const aQ2 = [['ush', aUsh], ['pk', aPk], ['max', aPs]], aQ2r = 2;
const aF2 = v => (Math.abs(v) < .005 ? 0 : v).toFixed(2).replace('-', '−');
const aF3 = v => (Math.abs(v) < .0005 ? 0 : v).toFixed(3).replace('-', '−');
const aF1 = v => String(Math.round(v * 10) / 10).replace('-', '−');
/* aMATH:end */

let aClipN = 0;
// Histograma sobre las seis caras, con base en yb y esquina izquierda en x0. Barra ancha de tiza = distribución empírica (capa hg.ge);
// barra angosta ámbar = la distribución p (capa hg.gp); trazo rosa de rayas a la altura de la previa (capa hg.g0). Las tres capas empiezan ocultas.
// hg.setE(d), hg.setP(d), hg.setP0(d) fijan las alturas · hg.cx(j): centro de la cara de índice j · phi: los rótulos de las caras van en rosa, como valores de Φ.
const aHg = (p, x0, yb, { slot = 90, sc = 740, we = 60, wp = 30, t0 = .4, size = 24, phi = false, tag = true } = {}) => {
  const g = G(p, { o: t0 == null ? 1 : 0 }), cx = j => x0 + slot * (j + .5), hg = { g, cx, x0, yb, slot, sc, W: slot * aK };
  if (t0 != null) show(g, t0);
  mk('path', { d: `M${x0 - 8} ${yb}H${x0 + slot * aK + 8}`, stroke: COL.dim, 'stroke-width': 2 }, g);
  hg.ge = G(g, { o: 0 }); hg.gp = G(g, { o: 0 }); hg.g0 = G(g, { o: 0 });
  const be = aU.map((_, j) => mk('rect', { x: cx(j) - we / 2, width: we, fill: HUE.emp, 'fill-opacity': .2, stroke: HUE.emp, 'stroke-width': 2.5 }, hg.ge));
  const bp = aU.map((_, j) => mk('rect', { x: cx(j) - wp / 2, width: wp, fill: HUE.p }, hg.gp));
  const b0 = aU.map(() => mk('path', { stroke: HUE.pri, 'stroke-width': 4, 'stroke-dasharray': '9 6', fill: 'none' }, hg.g0));
  const bar = bs => d => d.forEach((v, j) => aSetA(bs[j], { y: yb - v * sc, height: v * sc }));
  hg.setE = bar(be); hg.setP = bar(bp);
  hg.setP0 = d => d.forEach((v, j) => b0[j].setAttribute('d', `M${(cx(j) - slot / 2 + 3).toFixed(1)} ${(yb - v * sc).toFixed(1)}h${slot - 6}`));
  aU.forEach((_, j) => aTx(g, String(aPhi(j)), cx(j), yb + size + 10, null, { size, fill: phi ? HUE.pri : COL.dim, anchor: 'middle', weight: phi ? 700 : 500 }));
  if (tag) aTx(g, phi ? 'Φ(x)' : 'x', x0 - 18, yb + size + 10, null, { size, fill: phi ? HUE.pri : COL.dim, anchor: 'end', weight: phi ? 700 : 500 });
  return hg;
};
// Balanza bajo un histograma: un riel con la escala de la característica. Franja violeta = promedios permitidos (capa bm.gb) · marca de tiza sobre el riel =
// promedio empírico (capa bm.ge) · triángulo bajo el riel = apoyo, el promedio de la distribución dibujada (capa bm.gf; bm.tri para cambiarle el color) · bm.gt: libre.
// bm.band(mu, lam), bm.emp(mu), bm.ful(mu) los colocan; bm.MX(v): abscisa del valor v.
const aBeam = (p, hg, { dy = 62, k = 1, t0 = null } = {}) => {
  const y = hg.yb + dy, MX = v => hg.cx(0) + (v - 1) * hg.slot, g = G(p, { o: t0 == null ? 1 : 0 }), bm = { g, MX, y };
  if (t0 != null) show(g, t0);
  mk('path', { d: `M${hg.x0} ${y}H${hg.x0 + hg.W}`, stroke: COL.dim, 'stroke-width': 4, 'stroke-linecap': 'round' }, g);
  bm.gb = G(g, { o: 0 }); const band = mk('rect', { y: y - 9 * k, height: 18 * k, fill: HUE.cx, 'fill-opacity': .6, stroke: HUE.cx, 'stroke-width': 2 }, bm.gb);
  bm.gt = G(g);
  bm.ge = G(g, { o: 0 }); const ce = put(mk('path', { d: `M0 ${-11 * k}L${-10 * k} ${-27 * k}H${10 * k}Z`, fill: HUE.emp, stroke: COL.board, 'stroke-width': 2 }, bm.ge), { x: 0, y });
  bm.gf = G(g, { o: 0 }); bm.tri = put(mk('path', { d: `M0 0L${17 * k} ${30 * k}H${-17 * k}Z`, fill: HUE.p, stroke: COL.board, 'stroke-width': 2 }, bm.gf), { x: 0, y: y + 6 * k });
  bm.band = (mu, lam) => aSetA(band, { x: MX(mu - lam), width: 2 * lam * hg.slot });
  bm.emp = mu => put(ce, { x: MX(mu) });
  bm.ful = mu => put(bm.tri, { x: MX(mu) });
  return bm;
};
// Dial lineal de un parámetro (lo … hi): riel, marcas, perilla ámbar y rótulo «nombre = valor». dial.set(v) lo mueve.
const aDialW = (p, x, y, W, t0, lo, hi, ticks, name = 'w') => {
  const g = G(p, { o: 0 }), DX = v => x + (v - lo) / (hi - lo) * W;
  mk('path', { d: `M${x} ${y}H${x + W}`, stroke: COL.faint, 'stroke-width': 6, 'stroke-linecap': 'round', fill: 'none' }, g);
  ticks.forEach(v => { mk('path', { d: `M${DX(v)} ${y - 10}v20`, stroke: COL.dim, 'stroke-width': 2 }, g); T(g, String(v).replace('-', '−'), { x: DX(v), y: y + 42, size: 22, fill: COL.dim, anchor: 'middle', font: MATH }); });
  const kn = put(mk('circle', { r: 15, fill: HUE.p, stroke: COL.board, 'stroke-width': 2 }, g), { y }), lab = aTx(g, '', 0, y - 28, null, { size: 30, fill: HUE.p, weight: 700, anchor: 'middle' });
  show(g, t0);
  return { g, set: v => { put(kn, { x: DX(v) }); put(lab, { x: Math.max(x + 60, Math.min(x + W - 60, DX(v))) }); lab._set(`${name} = ${aF2(v)}`); } };
};
// Gráfica de funciones de w: marco con esquina superior izquierda en (x0, y0), ejes por el origen y curvas recortadas al marco. gp.fn(f, attrs) traza w ↦ f(w).
const aGPl = (p, x0, y0, W, HH, w0, w1, v0, v1, t0, wt, vt) => {
  const g = G(p, { o: 0 }), id = 'aclip' + (aClipN++), WX = w => x0 + (w - w0) / (w1 - w0) * W, VY = v => y0 + HH - (v - v0) / (v1 - v0) * HH;
  show(g, t0);
  mk('rect', { x: x0, y: y0, width: W, height: HH, fill: 'none', stroke: COL.faint, 'stroke-width': 2 }, g);
  mk('path', { d: `M${x0} ${VY(0).toFixed(1)}h${W}M${WX(0).toFixed(1)} ${y0}v${HH}`, stroke: COL.dim, 'stroke-width': 2, fill: 'none' }, g);
  wt.forEach(v => T(g, aF1(v), { x: WX(v), y: y0 + HH + 32, size: 22, fill: COL.dim, anchor: 'middle', font: MATH }));
  vt.forEach(v => T(g, aF2(v), { x: x0 - 12, y: VY(v) + 8, size: 22, fill: COL.dim, anchor: 'end', font: MATH }));
  aTx(g, 'w', x0 + W + 14, VY(0) + 9, null, { size: 26, fill: COL.dim });
  mk('rect', { x: x0, y: y0, width: W, height: HH }, mk('clipPath', { id }, g));
  const gl = G(g); gl.setAttribute('clip-path', `url(#${id})`);
  const fn = (f, attrs) => { let d = ''; for (let k = 0; k <= 240; k++) { const w = w0 + (w1 - w0) * k / 240; d += (k ? 'L' : 'M') + WX(w).toFixed(1) + ' ' + VY(f(w)).toFixed(1); } return put(mk('path', { d, fill: 'none', 'stroke-linejoin': 'round', 'stroke-linecap': 'round', ...attrs }, gl), { o: 0 }); };
  return { g, gl, WX, VY, fn };
};
// Recuadro numerado de una comprobación (los tres mosaicos de pickEls).
const aCard = (p, x, y, w, hh, n) => { const g = G(p, { x, y }); mk('rect', { x: 0, y: 0, width: w, height: hh, fill: COL.board, stroke: COL.faint, 'stroke-width': 3 }, g); mk('circle', { cx: w - 40, cy: 40, r: 22, fill: COL.chalk }, g); T(g, String(n), { x: w - 40, y: 49, size: 26, fill: COL.board, weight: 700, anchor: 'middle' }); return g; };
// Barra horizontal con su expresión arriba y su valor al final (ejemplo 12.1). Crece desde cero en t0.
const aHBar = (p, x, y, wd, col, expr, val, t0) => {
  const g = G(p, { o: 0 }), b = mk('rect', { x, y: y + 12, width: 0, height: 30, fill: col }, g), tv = aTx(g, val, x + 12, y + 36, null, { size: 26, fill: col, weight: 700 }); show(g, t0, .4);
  aTx(g, expr, x, y, null, { size: 22, fill: COL.dim });
  const ww = Math.max(4, wd); prog(q => { b.setAttribute('width', (ww * q).toFixed(1)); put(tv, { x: x + ww * q + 12 }); }, t0 + .1, 1.1);
  return g;
};

/* ---------- beats: [id, título, run(m, D), { ask }?] ---------- */
const HX = 150, YB = 610, RX = 800;
const aQ1why = { uni: 'La uniforme ignora la muestra: su entropía relativa a la empírica es mayor.', rev: 'Ahí las barras van al revés que las de tiza: da poca probabilidad a la muestra.' };
const aQ2why = { ush: 'Cumple la restricción, pero carga las caras 1 y 6: su entropía es menor.', pk: 'Cumple la restricción, pero tiene dos picos: su entropía es menor.' };
const BEATS = [
  ['intro', 'Inicio', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Unidad 3 · Capítulo 25', { x: 800, y: 350, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'El principio de máxima entropía', { x: 800, y: 450, size: 60, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'Cómo elegir una distribución a partir de una muestra, suponiendo lo menos posible.', 800, 580, m('sub'), { size: 30, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],

  ['dens', 'Estimación de densidad', (m) => {
    const p = panel(0), ts = m('sample'), te = m('emp'), tf = m('fam'), tsm = m('small'), tr = m('rich');
    aNote(p, 'datos ilustrativos · tiza: muestra y distribución empírica · ámbar: la p elegida · rosa: previa o característica · violeta: restricción o regularización');
    aTitle(p, 'El problema: estimar una distribución a partir de una muestra');
    const hg = aHg(p, HX, YB), gd = G(hg.g), gv = G(hg.g, { o: 0 }), seen = Array(aK).fill(0), RW = hg.sc / aMs * 2;
    hg.setE(aDh); hg.setP(aU);
    aS.forEach((j, i) => { const k = seen[j]++, y = YB - RW / 2 - Math.floor(k / 2) * RW, d = put(mk('circle', { r: 10.5, fill: HUE.emp }, gd), { x: hg.cx(j) + (k % 2 ? 13 : -13), y: y - 70, o: 0 }); tw(d, { y, o: 1 }, ts + 1.2 + i * .12, .4, out); });
    aDh.forEach((v, j) => aTx(gv, aF2(v), hg.cx(j), YB - v * hg.sc - 14, null, { size: 22, anchor: 'middle' }));
    show(hg.ge, te, .6); tw(gd, { o: .35 }, te + .4, .6); show(gv, te + .8); hide(gd, tf - .5, .4); hide(gv, tf - .5, .4);
    const gq = G(p, { o: 0 }); aSq(gq, HX, 196, HUE.emp, 'distribución empírica'); show(gq, te, .5);
    const gr = G(p, { o: 0 }); aSq(gr, HX + 290, 196, HUE.p, 'una candidata p'); show(gr, tf, .5);
    show(hg.gp, tf, .5);
    [[aU, aGibbs(.4), tf + .8], [aGibbs(.4), aGibbs(-.2), tsm + .2], [aGibbs(-.2), aMixV(aDh, aU, .5), tr + .2]].forEach(([A, B, t0]) => prog(q => hg.setP(aMixV(A, B, q)), t0, 1.6));

    aRow(p, [['con regularización L1 de peso λ', HUE.cx, UI, 24]], RX, 560, tml + 6, { size: 24, weight: 700 });
    aRow(p, [['Maxent no fijó una familia:  la de Gibbs sale de la entropía relativa', COL.chalk, UI, 24]], RX, 640, tfa, { size: 24, weight: 600 });
    aRow(p, [['| G(w) − sup G | < ε    ⟹    D(p* ‖ '], ['p_{w}', HUE.p], [') ≤ ε'], ['        teorema 12.2', COL.dim, UI, 22]], RX, 740, te + 2.6, { size: 28, weight: 600 });
  }],

  ['q2', 'Comprobación', () => {
    const p = panel(0), BX = [130, 590, 1050], W = 420, HH = 400, Y0q = 250;
    T(p, 'Tres distribuciones que cumplen la restricción', { x: 100, y: 130, size: 30, fill: COL.task, weight: 600 });
    aSq(p, 100, 200, HUE.p, 'la distribución p, y su promedio (triángulo)'); aSq(p, 620, 200, HUE.cx, 'promedios permitidos'); aSq(p, 920, 200, HUE.pri, 'previa p_{0}, uniforme', { line: true, dash: '9 6' });
    S.q2 = aQ2.map(([, d], j) => { const g = aCard(p, BX[j], Y0q, W, HH, j + 1), hg = aHg(g, 36, 296, { slot: 58, sc: 520, wp: 26, t0: null, size: 22, phi: true, tag: false }), bm = aBeam(g, hg, { dy: 54, k: .8 }); hg.setP(d); hg.setP0(aU); [hg.gp, hg.g0, bm.gb, bm.ge, bm.gf].forEach(e => put(e, { o: 1 })); bm.band(aMu, aLam); bm.emp(aMu); bm.ful(aMean(d)); return g; });
    S.q2B = BX.map(bx => [bx, Y0q, W, HH]);
  }, { ask: done => quiz(BAND, [{
    id: 'c-maxent', prompt: ['¿Cuál de las tres elige el principio de Maxent?'],
    build: pickEls(S.q2.map((el, j) => ({ el, box: S.q2B[j], label: 'distribución ' + (j + 1) })), aQ2r,
      'Es la más plana de las tres: la de mayor entropía entre las que cumplen.',
      j => aQ2why[aQ2[j][0]]),
  }], done) }],

  ['wrap', 'Resumen', (m) => {
    const p = panel(0);
    [['Máxima verosimilitud (ML):  la p más cercana a la empírica, en entropía relativa.', 'w1'], ['Máximo a posteriori (MAP):  pondera cada candidata con una previa.', 'w2'],
      ['Maxent:  promedios de Φ a distancia ≤ λ de los empíricos;  la más cercana a p_{0}.', 'w3'], ['Dualidad:  la solución es de Gibbs;  el dual es ML con regularización L1 de peso λ.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 240 + i * 130, o: 0 });
      mk('circle', { cx: 160, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 160, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      aTx(g, str, 220, 0, null, { size: 28, weight: 600, font: UI });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Práctica del capítulo', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-vf', prompt: ['Sobre este capítulo: ¿verdadero o falso?'],
    build: grid([
      { parts: ['Maximizar la verosimilitud equivale a minimizar la entropía relativa entre la empírica y p.'], ans: ['v'], why: 'Es (12.2): las dos difieren en la entropía de la empírica, que no depende de p.' },
      { parts: ['Con una previa uniforme, la solución MAP puede ser distinta de la de máxima verosimilitud.'], ans: ['f'], why: 'Con previa uniforme, P[p] es constante en (12.4): las dos soluciones coinciden.' },
      { parts: ['El principio de Maxent exige fijar de antemano una familia P de distribuciones.'], ans: ['f'], why: 'No fija ninguna: la familia de Gibbs sale de medir con la entropía relativa.' },
      { parts: ['Con previa uniforme, minimizar la entropía relativa a la previa es maximizar la entropía.'], ans: ['v'], why: 'La entropía relativa a la uniforme es log |X| menos la entropía de p.' },
      { parts: ['En el dual, el parámetro lambda de la restricción pasa a ser el peso de una regularización L1.'], ans: ['v'], why: 'Es (12.12): lambda por la norma uno de w, menos la verosimilitud media.' },
    ], [['v', 'verdadero', COL.real], ['f', 'falso', COL.task]], { multi: false, text: true }),
  }], done, 'Práctica del capítulo   1 de 1') }],

  ['finish', 'Fin', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
