const aFly = (p, from, to, cols, t0, dur, r = 7) => { const g = G(p, { o: 0 }), es = from.map((q, i) => mk('circle', { cx: q[0].toFixed(1), cy: q[1].toFixed(1), r, fill: cols[i], 'fill-opacity': .9, stroke: COL.board, 'stroke-width': 1.2 }, g)); show(g, t0, .3); prog(q => es.forEach((e, i) => { e.setAttribute('cx', (from[i][0] + (to[i][0] - from[i][0]) * q).toFixed(1)); e.setAttribute('cy', (from[i][1] + (to[i][1] - from[i][1]) * q).toFixed(1)); }), t0 + .3, dur); return g; };
// Una coordenada por punto sobre una recta horizontal (de x0 a x1, a la altura y): devuelve las posiciones. La escala lleva el mayor valor absoluto al borde.

// Histograma de cocientes sobre un eje de 0 a top (lo que pasa de top cae en la última barra): barras de tiza dentro de la franja 1 ± eps y rosa fuera.
const aBW = .05;
const aHistQ = (g, q, x0, base, w, h, top, eps) => {
  const nb = Math.round(top / aBW), cnt = Array(nb).fill(0), lo = Math.round((1 - eps) / aBW), hi = Math.round((1 + eps) / aBW);
  q.forEach(v => { cnt[Math.min(nb - 1, Math.floor(v / aBW))]++; });
  const mx = Math.max(...cnt), bw = w / nb;
  mk('rect', { x: x0 + lo * bw, y: base - h, width: (hi - lo) * bw, height: h, fill: HUE.hyp, 'fill-opacity': .13 }, g);
  mk('path', { d: `M${x0} ${base}h${w}`, stroke: COL.faint, 'stroke-width': 2, fill: 'none' }, g);
  cnt.forEach((c, k) => { if (c) mk('rect', { x: (x0 + k * bw + .5).toFixed(1), y: (base - h * c / mx).toFixed(1), width: (bw - 1).toFixed(1), height: (h * c / mx).toFixed(1), fill: k < lo || k >= hi ? HUE.err : COL.chalk }, g); });
  mk('path', { d: `M${x0 + w / top} ${base - h}v${h}`, stroke: HUE.hyp, 'stroke-width': 2, 'stroke-dasharray': '6 5', fill: 'none' }, g);
};
