<script>
'use strict';
const CHAPTER = { number: 4, title: 'Complejidad de Rademacher', minutes: 6, language: 'es', next: '../ch05/' };

/* ---------- helpers de dibujo del capítulo ---------- */
const HUE = { pos: COL.nat, neg: COL.whole, hyp: COL.task, rad: COL.real };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500, font = UI } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, font, o: 0 }); show(e, t0); return e; };
// Texto con subíndices y superíndices: 'R(h_{S}) ≤ 4e^{−mε/4}'. Con t0 = null queda visible desde el inicio.
const aTx = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500, font = MATH } = {}) => {
  const e = T(p, '', { x, y, size, fill, anchor, weight, font, o: t0 == null ? 1 : 0 });
  let prev = 0;
  str.split(/([_^]\{[^}]*\})/).forEach(s => {
    if (!s) return;
    const k = /^[_^]\{/.test(s) ? (s[0] === '_' ? 1 : -1) : 0, dy = k > 0 ? size * .22 : k < 0 ? -size * .38 : 0;
    mk('tspan', { dy: dy - prev, ...(k ? { 'font-size': size * .68 } : {}) }, e).textContent = k ? s.slice(2, -1) : s;
    prev = dy;
  });
  if (t0 != null) show(e, t0);
  return e;
};
const aRng = seed => () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const aFmt = v => v.toFixed(2).replace('-', '−');
const aVal = v => Number.isInteger(v) ? String(v) : '≈ ' + aFmt(v);
const aSwatch = (p, x, y, fill, t0) => show(put(mk('rect', { x, y: y - 20, width: 26, height: 22, fill, 'fill-opacity': .8 }, p), { o: 0 }), t0);
const aFall = (d, t0) => { const y = st(d).y; put(d, { y: y - 46 }); tw(d, { o: 1, y }, t0, .45, out); };   // un punto de la muestra que cae
const aBar = (p, x, y, w, t0, fill = COL.chalk) => { const e = put(mk('rect', { x, y: y - 20, width: 0, height: 22, fill, 'fill-opacity': .8 }, p), {}); tw(e, { a_width: w }, t0, .7, out); return e; };
const aNote = (p, str = 'datos ilustrativos · una muestra fija de 8 puntos') => text(p, str, 1570, 884, .4, { size: 22, fill: COL.dim, anchor: 'end' });

// Segmento X = [0, 1]. Muestra fija S de m = 8 puntos (ilustrativa, con semilla). Las hipótesis toman valores en {−1, +1}.
const aX0 = 100, aXW = 760, aPX = t => aX0 + t * aXW;
const aM = 8, aIdx = Array.from({ length: aM }, (_, i) => i);
const aXs = (() => { const r = aRng(1096); return aIdx.map(() => r()).sort((a, b) => a - b); })();
const aEdge = [0, ...aXs.slice(1).map((x, i) => (x + aXs[i]) / 2), 1];           // 9 cortes: el corte j deja j puntos a su izquierda
const aSig = seed => { const r = aRng(seed); return aIdx.map(() => r() < .5 ? -1 : 1); };   // vector de signos σ
const aSum = a => a.reduce((s, v) => s + v, 0);
const aDotp = (sg, h) => aSum(sg.map((s, i) => s * h[i]));                       // σ · h_S
const aThrH = j => aIdx.map(i => i < j ? -1 : 1);                                // umbral: −1 a su izquierda, +1 a su derecha
const aAll = Array.from({ length: 2 ** aM }, (_, n) => aIdx.map(i => n >> i & 1 ? 1 : -1));   // los 256 vectores de signos
// Cada conjunto de hipótesis, visto sobre la muestra: la lista de vectores h_S que puede producir.
const aCLS = { one: [aIdx.map(() => 1)], thr: Array.from({ length: aM + 1 }, (_, j) => aThrH(j)), int: [aIdx.map(() => -1)], all: aAll };
for (let a = 0; a < aM; a++) for (let b = a + 1; b <= aM; b++) aCLS.int.push(aIdx.map(i => i >= a && i < b ? 1 : -1));
const aBest = (sg, hs) => hs.reduce((b, h) => aDotp(sg, h) > aDotp(sg, b) ? h : b);   // la hipótesis que mejor sigue a σ
const aSup = (sg, hs) => aDotp(sg, aBest(sg, hs)) / aM;                          // sup_h (1/m) Σ σ_i h(x_i)
const aBestJ = sg => aCLS.thr.indexOf(aBest(sg, aCLS.thr));
const aRad = hs => aSum(aAll.map(sg => aSup(sg, hs))) / aAll.length;             // complejidad de Rademacher empírica, exacta (definición 3.1)
const aRADS = { one: aRad(aCLS.one), thr: aRad(aCLS.thr), int: aRad(aCLS.int), all: aRad(aCLS.all) };
const aVs = [0, .25, .5, .75, 1], aHist = aVs.map(v => aAll.filter(sg => aSup(sg, aCLS.thr) === v).length);
// Umbrales con m puntos distintos: la complejidad no depende de dónde caen los puntos. Valor exacto por programación dinámica.
const aRadThr = m => {
  let cur = new Map([['0,0', 1]]);
  for (let i = 0; i < m; i++) { const nx = new Map(); cur.forEach((q, k) => { const [c, mn] = k.split(',').map(Number); [-1, 1].forEach(d => { const kk = `${c + d},${Math.min(mn, c + d)}`; nx.set(kk, (nx.get(kk) || 0) + q / 2); }); }); cur = nx; }
  let e = 0; cur.forEach((q, k) => { const [c, mn] = k.split(',').map(Number); e += q * (c - 2 * mn); });
  return e / m;
};
const aS1 = aSig(54), aS2 = aSig(44), aS3 = aSig(47);                            // signos de la lección y de la comprobación 1
const aDraws = [54, 44, 52, 2, 39, 16, 5, 13, 18, 31].map(aSig);                  // diez sorteos que se muestran uno por uno
const aSeq = [54, 52, 39, 2].map(aSig);                                          // signos del beat que compara conjuntos
const aQ1 = [1, 3, 6];                                                           // cortes de los umbrales A, B, C de la comprobación 1
const aConf = (m, d) => Math.sqrt(Math.log(1 / d) / (2 * m));                    // término de confianza de (3.3) y (3.17)
const aTermH = (n, m, d) => Math.sqrt((Math.log(n) + Math.log(2 / d)) / (2 * m)); // término del teorema 2.13 (cap. 3)
const aQM = 128, aQD = .05, aQ2 = [['una sola hipótesis', .30, 0], ['umbrales', .10, aRadThr(aQM)], ['todas las funciones', 0, 1]];   // comprobación 2: [conjunto, error empírico ilustrativo, complejidad]

const aSign = (p, x, y, size = 40) => {                                          // signo + o − que se puede cambiar en el tiempo
  const e = { 1: T(p, '+', { x, y: y + size * .33, size, fill: HUE.pos, anchor: 'middle', weight: 700, o: 0 }), '-1': T(p, '−', { x, y: y + size * .33, size, fill: HUE.neg, anchor: 'middle', weight: 700, o: 0 }) };
  let cur = 0;
  return (v, t, dur = .25) => { if (v === cur) return; if (cur) tw(e[cur], { o: 0 }, t, dur); if (v) tw(e[v], { o: 1 }, t, dur); cur = v; };
};
const aMark = (p, x, y) => {                                                     // marca de coincide (verde) o difiere (rojo)
  const e = { 1: put(mk('path', { d: 'M-11 0l7 8l14 -17', fill: 'none', stroke: COL.good, 'stroke-width': 5 }, p), { x, y, o: 0 }), '-1': put(mk('path', { d: 'M-9 -9L9 9M9 -9L-9 9', fill: 'none', stroke: COL.bad, 'stroke-width': 5 }, p), { x, y, o: 0 }) };
  let cur = 0;
  return (v, t, dur = .2) => { if (v === cur) return; if (cur) tw(e[cur], { o: 0 }, t, dur); if (v) tw(e[v], { o: 1 }, t, dur); cur = v; };
};
const aHue = v => v > 0 ? HUE.pos : HUE.neg;
// Tablero: la muestra sobre el eje, la fila de signos σ arriba, la franja con los signos de h abajo y el umbral.
const aBoard = (p, y, { r = 14, top = 48, hy = 72, size = 40, ends = true } = {}) => {
  const b = { y }, gh = b.gh = G(p, { o: 0 }), ga = b.ga = G(p, { o: 0 });
  const cells = aIdx.map(i => mk('rect', { x: aPX(aEdge[i]), y: y + hy - 30, width: (aEdge[i + 1] - aEdge[i]) * aXW + .5, height: 50, fill: HUE.pos, 'fill-opacity': .25 }, gh));
  mk('path', { d: `M${aPX(0)} ${y}H${aPX(1)}`, stroke: COL.dim, 'stroke-width': 3 }, ga);
  if (ends) { T(ga, '0', { x: aPX(0) - 14, y: y + 9, size: 24, fill: COL.dim, anchor: 'end', font: MATH }); T(ga, '1', { x: aPX(1) + 14, y: y + 9, size: 24, fill: COL.dim, font: MATH }); }
  b.line = put(mk('path', { d: `M0 ${y - top - 30}V${y + hy + 26}`, stroke: HUE.hyp, 'stroke-width': 5 }, p), { x: aPX(0), o: 0 });
  b.dots = aXs.map(x => put(mk('circle', { r, fill: COL.dim }, p), { x: aPX(x), y, o: 0 }));
  const sg = aXs.map(x => aSign(p, aPX(x), y - top, size)), hs = aXs.map(x => aSign(gh, aPX(x), y + hy - 5, size * .85)), ms = aXs.map(x => aMark(p, aPX(x), y + hy + 62));
  let first = true;
  b.sig = (v, t, dur = .3) => aIdx.forEach(i => { sg[i](v[i], t, dur); if (v[i]) tw(b.dots[i], { c_fill: aHue(v[i]) }, t, dur); });
  b.hyp = (h, t, dur = .2) => { aIdx.forEach(i => { hs[i](h[i], t, dur); if (first) cells[i].setAttribute('fill', aHue(h[i])); else tw(cells[i], { c_fill: aHue(h[i]) }, t, dur); }); first = false; };
  b.marks = (v, h, t, dur = .2) => aIdx.forEach(i => ms[i](v ? v[i] * h[i] : 0, t, dur));
  b.cut = (j, t, dur = .2) => tw(b.line, { x: aPX(aEdge[j]) }, t, dur);
  b.label = (str, dy, t0) => aTx(p, str, 62, y + dy, t0, { size: 30, fill: COL.dim, anchor: 'end' });
  return b;
};

/* ---------- beats: [id, título, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Inicio', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Unidad 1 · Capítulo 4', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Complejidad de Rademacher', { x: 800, y: 430, size: 80, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'Para medir un conjunto infinito de hipótesis, se le pide que imite el ruido.', 800, 600, m('sub'), { size: 34, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],

  ['infinito', 'Cuando H es infinito', (m) => {
    const p = panel(0), ti = m('inf'), tv = ti + 7, tr = m('rect'), mm = 200, d = .05, ns = [50, 5000, 1e12], k = 1400;
    const full = put(mk('rect', { x: aPX(0), y: 170, width: aXW, height: 160, fill: HUE.hyp, 'fill-opacity': .5 }, p), { o: 0 });
    show(full, ti, 1.2);
    const ax = G(p, { o: 0 });
    mk('path', { d: `M${aPX(0)} 250H${aPX(1)}`, stroke: COL.dim, 'stroke-width': 3 }, ax);
    T(ax, '0', { x: aPX(0) - 14, y: 259, size: 24, fill: COL.dim, anchor: 'end', font: MATH }); T(ax, '1', { x: aPX(1) + 14, y: 259, size: 24, fill: COL.dim, font: MATH });
    show(ax, .2);
    for (let i = 1; i <= 50; i++) tw(put(mk('path', { d: `M${aPX(i / 50)} 170V330`, stroke: HUE.hyp, 'stroke-width': 3 }, p), { o: 0 }), { o: .6 }, .2 + i * .012, .3);
    const h1 = text(p, 'H: 50 umbrales', aX0, 130, .3, { size: 28, fill: COL.task, weight: 600 });
    hide(h1, ti, .4); text(p, 'H: todos los umbrales de [0, 1]', aX0, 130, ti + .4, { size: 28, fill: COL.task, weight: 600 });
    aTx(p, `el término de la cota, con m = ${mm} y δ = ${d}:`, aX0, 410, m('term'), { size: 22, fill: COL.dim, font: UI });
    const row = (i, lab, w, val, t, fill) => {
      const y = 462 + i * 50;
      aTx(p, lab, aX0, y, t, { size: 28 }); aBar(p, 300, y, w, t, fill);
      aTx(p, val, 314 + w, y, t + .4, { size: 28, weight: 600, fill: fill === COL.bad ? COL.bad : COL.chalk });
    };
    ns.forEach((n, i) => row(i, ['|H| = 50', '|H| = 5 000', '|H| = 10^{12}'][i], aTermH(n, mm, d) * k, aFmt(aTermH(n, mm, d)), i ? m('grow') + (i - 1) * 1.2 : m('term') + .6, COL.chalk));
    row(3, '|H| = ∞', 470, '››  ∞', tv, COL.bad);
    text(p, 'Capítulo 3: contar hipótesis', 940, 150, .3, { size: 32, fill: COL.task, weight: 600 });
    aTx(p, 'R(h) ≤ R̂_{S}(h) + √[ (log|H| + log(2/δ)) / 2m ]', 940, 204, .5, { size: 27 });
    text(p, 'teorema 2.13 del libro', 940, 238, .5, { size: 22, fill: COL.dim });
    aTx(p, 'Con H infinito:  log|H| = ∞', 940, 308, tv, { size: 30, fill: COL.bad, weight: 600 });
    text(p, 'la cota no dice nada', 940, 344, tv + .6, { size: 22, fill: COL.dim });
    const rg = G(p, { o: 0 }), rr = aRng(7);                                   // recuerdo del cap. 2: rectángulos
    mk('rect', { x: 940, y: 420, width: 300, height: 190, fill: 'none', stroke: COL.faint, 'stroke-width': 2 }, rg);
    mk('rect', { x: 1010, y: 462, width: 160, height: 104, fill: HUE.hyp, 'fill-opacity': .12, stroke: HUE.hyp, 'stroke-width': 3 }, rg);
    for (let i = 0; i < 22; i++) { const x = 954 + rr() * 272, y = 434 + rr() * 162; mk('circle', { cx: x, cy: y, r: 6, fill: x > 1010 && x < 1170 && y > 462 && y < 566 ? HUE.pos : HUE.neg }, rg); }
    T(rg, 'rectángulos (cap. 2):', { x: 1262, y: 500, size: 24 }); T(rg, 'infinitos, y aun así', { x: 1262, y: 536, size: 24 }); T(rg, 'PAC-aprendibles', { x: 1262, y: 572, size: 24, fill: COL.good, weight: 600 });
    show(rg, tr);
    text(p, 'Hace falta otra medida de H:', 800, 760, m('idea'), { size: 30, fill: COL.task, anchor: 'middle', weight: 600 });
    text(p, 'no cuántas hipótesis tiene, sino cuánto pueden hacer sobre una muestra.', 800, 806, m('idea', 2.2), { size: 30, fill: COL.task, anchor: 'middle', weight: 600 });
  }],

  ['ruido', 'Seguir el ruido', (m) => {
    const p = panel(0), b = aBoard(p, 300), th = m('hyp'), tc = m('corr'), ts = m('sweep'), tb = m('best'), ta = m('again'), j0 = 3;
    aNote(p);
    show(b.ga, .2);
    text(p, `S: una muestra fija de m = ${aM} puntos, sin etiquetas`, aX0, 130, m('sample'), { size: 26, fill: COL.dim });
    b.dots.forEach((e, i) => aFall(e, m('sample') + i * .1));
    b.label('σ', -38, m('sigma')); aIdx.forEach(i => b.sig(aS1.map((v, n) => n <= i ? v : 0), m('sigma') + .4 + i * .32));
    b.label('h', 78, th); show(b.gh, th); show(b.line, th); put(b.line, { x: aPX(aEdge[j0]) }); b.hyp(aThrH(j0), th);
    const seq = [[tc, aS1, j0], ...aCLS.thr.map((_, j) => [ts + j * .25, aS1, j]), [tb, aS1, aBestJ(aS1)], [ta + 1, aS2, aBestJ(aS2)]];
    seq.forEach(([t, sg, j], n) => {
      const h = aThrH(j), dp = aDotp(sg, h), a = (aM + dp) / 2, g = G(p, { o: 0 }), t1 = n === seq.length - 2 ? ta : seq[n + 1]?.[0];
      T(g, `coincide en ${a} puntos, difiere en ${aM - a}`, { x: aX0, y: 520, size: 26 });
      const f = aTx(g, `correlación = (${a} − ${aM - a})/${aM} = ${aFmt(dp / aM)}`, aX0, 568, null, { size: 32, weight: 600 });
      if (!n) { put(f, { o: 0 }); show(f, t + 6); }
      show(g, t, .1); if (t1 != null) hide(g, t1, .1);
      if (n === seq.length - 1) { b.sig(aS2, ta); b.marks(null, null, ta); }
      if (n) { b.cut(j, t); b.hyp(h, t, .15); }
      b.marks(sg, h, t, .15);
    });
    aTx(p, 'Signos al azar:  σ = (σ_{1}, …, σ_{m})', 940, 150, m('sigma'), { size: 30, fill: COL.task, weight: 600 });
    text(p, 'cada uno +1 o −1, con probabilidad ½', 940, 188, m('sigma', 2), { size: 22, fill: COL.dim });
    text(p, 'H: todos los umbrales de [0, 1]', 940, 258, th, { size: 26, weight: 600 });
    text(p, 'cada uno: +1 a su derecha, −1 a su izquierda', 940, 294, th + 3, { size: 22, fill: COL.dim });
    text(p, 'Correlación de h con el ruido:', 940, 364, tc, { size: 24 });
    aTx(p, '(1/m) Σ_{i} σ_{i} h(x_{i})', 940, 412, tc + 5.5, { size: 32 });
    text(p, 'El umbral que mejor sigue al ruido:', 940, 486, tb, { size: 24 });
    aTx(p, 'sup_{h∈H} (1/m) Σ_{i} σ_{i} h(x_{i})', 940, 536, tb + .6, { size: 34, fill: COL.task, weight: 600 });
    text(p, `con estos signos:  ${aFmt(aSup(aS1, aCLS.thr))}`, 940, 602, tb + 5, { size: 26, weight: 600 });
    text(p, `con otros signos:  ${aFmt(aSup(aS2, aCLS.thr))}`, 940, 644, ta + 3.4, { size: 26, weight: 600 });
    text(p, 'En el ruido no hay nada que aprender: seguirlo solo mide la flexibilidad de H.', 800, 790, ta + 4.6, { size: 30, fill: COL.task, anchor: 'middle', weight: 600 });
  }],

  ['q1', 'Comprobación', () => {
    const p = panel(0), b = aBoard(p, 300);
    put(b.ga, { o: 1 }); b.dots.forEach(e => put(e, { o: 1 })); b.sig(aS3, 0, .01);
    aTx(p, 'σ', 62, 262, null, { size: 30, fill: COL.dim, anchor: 'end' });
    S.q1 = aQ1.map((j, i) => {
      const g = G(p, { x: aPX(aEdge[j]) });
      mk('path', { d: 'M0 215V398', stroke: HUE.hyp, 'stroke-width': 5 }, g);
      T(g, 'ABC'[i], { y: 200, size: 32, anchor: 'middle', weight: 700, fill: HUE.hyp });
      return g;
    });
    T(p, 'Tres umbrales de H', { x: 940, y: 240, size: 30, fill: COL.task, weight: 600 });
    T(p, 'cada uno: +1 a su derecha, −1 a su izquierda', { x: 940, y: 282, size: 24 });
    T(p, 'correlación = (coincidencias − diferencias) / m', { x: 940, y: 344, size: 24, fill: COL.dim });
  }, { ask: done => {
    const vs = aQ1.map(j => aDotp(aS3, aThrH(j))), right = vs.indexOf(Math.max(...vs)), cnt = v => `coincide con el ruido en ${(aM + v) / 2} de los ${aM} puntos: (${(aM + v) / 2} − ${(aM - v) / 2})/${aM} = ${aFmt(v / aM)}`;
    return quiz(BAND, [{
      id: 'c-ruido', prompt: ['¿Cuál de los tres umbrales tiene la mayor correlación con estos signos? Elegirlo en el dibujo.'],
      build: pickEls(aQ1.map((j, i) => ({ el: S.q1[i], box: [aPX(aEdge[j]) - 34, 166, 68, 240], label: 'umbral ' + 'ABC'[i] })), right,
        `El umbral ${'ABC'[right]} ${cnt(vs[right])}. Ningún otro umbral de H lo supera con estos signos.`,
        i => `Ese umbral ${cnt(vs[i])}. Otro de los tres coincide en más puntos.`),
    }], done);
  } }],

  ['promedio', 'El promedio sobre los signos', (m) => {
    const p = panel(0), b = aBoard(p, 215, { r: 11, top: 42, hy: 56, size: 32 }), tm = m('many'), ta = m('all'), tn = m('mean');
    const HX = k => 190 + k * 150, HB = 640, HS = 1.8, col = v => aVs.indexOf(v);
    aNote(p);
    put(b.ga, { o: 1 }); put(b.gh, { o: 1 }); put(b.line, { o: 1, x: aPX(aEdge[aBestJ(aDraws[0])]) });
    b.dots.forEach((e, i) => show(e, .2 + i * .03, .3)); b.sig(aDraws[0], .2); b.hyp(aBest(aDraws[0], aCLS.thr), .2);
    b.label('σ', -32, .2); b.label('h', 62, .2);
    const hx = G(p, { o: 0 });                                                 // eje del histograma
    mk('path', { d: `M${HX(0) - 80} ${HB}H${HX(4) + 80}`, stroke: COL.dim, 'stroke-width': 2 }, hx);
    aVs.forEach((v, k) => T(hx, String(v), { x: HX(k), y: HB + 32, size: 24, fill: COL.dim, anchor: 'middle', font: MATH }));
    T(hx, 'correlación del mejor umbral con cada σ', { x: HX(2), y: HB + 68, size: 22, fill: COL.dim, anchor: 'middle' });
    show(hx, tm);
    const stack = aVs.map(() => 0);
    aDraws.forEach((sg, n) => {
      const t = tm + .5 + n * .55, k = col(aSup(sg, aCLS.thr));
      if (n) { b.sig(sg, t, .2); b.hyp(aBest(sg, aCLS.thr), t, .2); b.cut(aBestJ(sg), t, .25); }
