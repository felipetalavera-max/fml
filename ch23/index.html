'use strict';
const CHAPTER = { number: 23, title: 'Regresión: cotas de generalización', minutes: 6, language: 'es', next: '../ch24/' };

/* ---------- helpers de dibujo del capítulo (los genéricos, copiados del cap. 22) ---------- */
// En regresión no hay clases: tiza = puntos de la muestra (y testigos) · ámbar = la hipótesis o la función elegida ·
// rosa (local) = residuo y pérdida · violeta = complejidad (log |H|, Rademacher, pseudo-dimensión) · verde/rojo = lado pedido logrado o no.
const HUE = { pt: COL.chalk, hyp: COL.task, loss: COL.rat, cx: COL.real, ok: COL.good, bad: COL.bad };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500, font = UI } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, font, o: 0 }); show(e, t0); return e; };
// Texto con subíndices y superíndices: 'w_{t,i}', 'r^{2}'. Con t0 = null queda visible desde el inicio. e._set(str) lo reescribe. No anida llaves.
const aSYM = /([αβεγδηθφρσλμξΦΨΠΛΩΣΔ‖ℜℝ√∑∏⟹⟺≈∼∞⊤∈∃→↦′″⌊⌋])/;                                      // símbolos que van siempre en la fuente matemática
const aFill = (e, str, size, font) => {
  e.replaceChildren();
  let prev = 0;
  str.split(/([_^]\{[^}]*\})/).forEach(s => {
    if (!s) return;
    const k = /^[_^]\{/.test(s) ? (s[0] === '_' ? 1 : -1) : 0, dy = k > 0 ? size * .22 : k < 0 ? -size * .38 : 0;
    (k ? s.slice(2, -1) : s).split(aSYM).filter(q => q).forEach((q, n) => { mk('tspan', { dy: n ? 0 : dy - prev, ...(k ? { 'font-size': size * .68 } : {}), ...(aSYM.test(q) && font !== MATH ? { 'font-family': MATH } : {}) }, e).textContent = q; });
    prev = dy;
  });
};
const aTx = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500, font = MATH } = {}) => {
  const e = T(p, '', { x, y, size, fill, anchor, weight, font, o: t0 == null ? 1 : 0 });
  aFill(e, str, size, font); e._set = s => aFill(e, s, size, font);

  return e;
};
// Varias piezas de aTx en una línea: [texto, color, fuente, tamaño]; t0 puede ser una lista con un instante por pieza.
const aRow = (p, parts, x, y, t0, opts = {}) => { const xs = [], els = parts.map(([str, fill, font, size], k) => { xs.push(x); const e = aTx(p, str, x, y, Array.isArray(t0) ? t0[k] : t0, { ...opts, fill: fill || COL.chalk, ...(font ? { font } : {}), ...(size ? { size } : {}) }); x += e.getComputedTextLength(); return e; }); els.xs = xs; els.end = x; return els; };
const aNote = (p, str) => aTx(p, str, 1570, 884, .4, { size: 22, fill: COL.dim, anchor: 'end', font: UI });
const aTitle = (p, str) => text(p, str, 100, 130, .3, { size: 30, fill: COL.task, weight: 600 });
const aHalo = e => { [['stroke', COL.board], ['stroke-width', 7], ['paint-order', 'stroke'], ['stroke-linejoin', 'round']].forEach(([k, v]) => e.setAttribute(k, v)); return e; };   // borde del color de la pizarra: el texto se lee sobre líneas
const aSq = (p, x, y, col, lab, { line = false, dash = null, dot = false } = {}) => { mk(line ? 'path' : dot ? 'circle' : 'rect', line ? { d: `M${x} ${y - 8}h30`, stroke: col, 'stroke-width': 4, fill: 'none', ...(dash ? { 'stroke-dasharray': dash } : {}) } : dot ? { cx: x + 15, cy: y - 8, r: 9, fill: col } : { x: x + 6, y: y - 17, width: 18, height: 18, fill: col }, p); return aTx(p, lab, x + 42, y, null, { size: 22, fill: COL.dim, font: UI }); };   // entrada de leyenda
const aAt = (fn, t) => prog(() => fn(), t, 0);                                      // un cambio instantáneo en el instante t
const aSetA = (e, o) => { Object.entries(o).forEach(([k, v]) => e.setAttribute(k, typeof v === 'number' ? v.toFixed(1) : v)); return e; };

/* aMATH:begin — cuentas del capítulo, sin dibujo (se prueban aparte con Node) */
const aSum = v => v.reduce((s, u) => s + u, 0);
const aRng = seed => () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

const aHy = (u, v, x) => u + (v - u) * x / 2;
const aRes = (S0, u, v) => S0.map(([x, y]) => aHy(u, v, x) - y);                         // residuos h(x_i) − y_i
const aEmp = (S0, u, v, pw = 2) => aSum(aRes(S0, u, v).map(r => Math.abs(r) ** pw)) / S0.length;   // (11.2), con la pérdida L_p
// (11.1) exacto con la pérdida cuadrática: E[(h(x) − f(x))²] + Var(ruido); con h − f = a + b·x, E[x] = 1 y E[x²] = 4/3.
const aRisk = (u, v) => { const a = u - aF0, b = (v - u) / 2 - aF1; return a * a + 2 * a * b + b * b * 4 / 3 + aNz * aNz / 3; };
const aSeed = 103, aMs = 12, aS = aDrawS(aSeed, aMs), aSeed2 = 1103, aM2 = 1200, aS2 = aDrawS(aSeed2, aM2), aDl = .05;

const aHiI = aRes(aS, ...aH0).reduce((q, r, i, all) => r < all[q] ? i : q, 0);   // el punto que más supera a la recta: el que se rotula
// --- H finito: las 25 rectas con h(0) y h(2) en la cuadrícula {0, 0.5, 1, 1.5, 2}.
const aGridV = [0, .5, 1, 1.5, 2], aHs = aGridV.flatMap(u => aGridV.map(v => [u, v])), aNH = aHs.length;

const aFin = (n, k, dl, M0 = aM) => M0 * Math.sqrt((Math.log(k) + Math.log(1 / dl)) / (2 * n));   // teorema 11.1: M √((log|H| + log(1/δ)) / 2m)
const aT1 = aFin(aMs, aNH, aDl), aT2 = aFin(aM2, aNH, aDl);
const aConf = (n, dl, M0 = aM) => M0 * Math.sqrt(Math.log(1 / dl) / (2 * n));           // término de confianza: M √(log(1/δ) / 2m)

const aRadS = aRad(aS);
const aMu = (pw, B0 = aBres) => pw * B0 ** (pw - 1);                                     // pérdida L_p con |h(x) − y| ≤ M: μ = p M^(p−1)
// --- Pseudo-dimensión. Un punto con su testigo: [z, t]. Signo de la recta a + b·z: +1 si pasa por encima del testigo, −1 si pasa por debajo.
const aThru = ([z1, v1], [z2, v2]) => { const b = (v2 - v1) / (z2 - z1); return [v1 - b * z1, b]; };
const aSgOf = (pts, [a, b]) => pts.map(([z, t]) => a + b * z > t ? 1 : -1);
// Una recta que logra los signos sg con la mayor holgura de la lista, o null. El conjunto de rectas válidas, si no es vacío, tiene un vértice
// con dos restricciones activas (los z son distintos): basta probar las rectas que pasan a distancia gp de dos testigos.
const aLineFor = (pts, sg, gaps = [.35, .25, .15, .05, 1e-6]) => { for (const gp of gaps) for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) { const L = aThru([pts[i][0], pts[i][1] + sg[i] * gp], [pts[j][0], pts[j][1] + sg[j] * gp]); if (pts.every(([z, t], k) => sg[k] * (L[0] + L[1] * z - t) >= gp - 1e-9)) return L; } return null; };
const aTryL = (pts, sg, skip, gp = .3) => { const q = pts.map((pt, i) => [pt[0], pt[1] + sg[i] * gp]).filter((_, i) => i !== skip); return aThru(q[0], q[1]); };   // cumple con todos menos con el punto skip
const aCombos = n => Array.from({ length: 2 ** n }, (_, k) => Array.from({ length: n }, (_, i) => k >> (n - 1 - i) & 1 ? -1 : 1));   // (+,+), (+,−), (−,+), (−,−)
const aP2 = [[.6, 1.2], [1.4, .8]], aP3 = [[.4, .8], [1, 1.3], [1.6, .8]], aP3a = aP3.slice(0, 2);
const aC2 = aCombos(2), aL2 = aC2.map(sg => aLineFor(aP2, sg)), aL3a = aC2.map(sg => aLineFor(aP3a, sg));
const aC3 = aCombos(3), aL3 = aC3.map(sg => aLineFor(aP3, sg)), aNo3 = aC3.filter((_, k) => !aL3[k]);   // las combinaciones de tres que ninguna recta logra
const aPd = (d, n, M0 = aM) => M0 * Math.sqrt(2 * d * Math.log(Math.E * n / d) / n);     // primer término de (11.6)
// --- Comprobaciones. 1: tres muestras de tres puntos (x = 1, 2, 3) frente a la hipótesis constante h = 2. 2: tres combinaciones sobre aP3.
const aQ1 = [[3, 1, 3], [2, 2, 4], [2, 3, 1]], aQ1h = 2, aQ1res = aQ1.map(r => r.map(y => Math.abs(aQ1h - y))), aQ1mse = aQ1res.map(r => aSum(r.map(v => v * v)) / r.length), aQ1r = aQ1mse.indexOf(Math.max(...aQ1mse));
const aQ2 = [[1, -1, 1], [1, 1, -1], [-1, 1, -1]], aQ2L = aQ2.map(sg => aLineFor(aP3, sg)), aQ2r = aQ2L.findIndex(L => !L);
const aQ1tx = j => Number.isInteger(aQ1mse[j]) ? String(aQ1mse[j]) : `${aSum(aQ1res[j].map(v => v * v))}/${aQ1res[j].length} ≈ ${aQ1mse[j].toFixed(2)}`;
const aF2 = v => (Math.abs(v) < .005 ? 0 : v).toFixed(2).replace('-', '−');
const aEq = v => Math.abs(v * 100 - Math.round(v * 100)) < 1e-9 ? '=  ' + String(Math.round(v * 100) / 100).replace('-', '−') : '≈  ' + aF2(v);   // «=» solo si el valor es exacto con dos decimales
const aInt = v => String(Math.round(v)).replace(/\B(?=(\d{3})+$)/g, ' ');           // miles con espacio fino
const aLst = v => v.length > 1 ? v.slice(0, -1).join(', ') + ' y ' + v[v.length - 1] : String(v[0]);
/* aMATH:end */

let aClipN = 0;
// Plano de regresión: marco de 2 × 2 unidades (la misma escala en los dos ejes, para que los cuadrados sean cuadrados), con la muestra S0.
// Capas, de abajo hacia arriba: pl.g0 (libre, recortada al marco), pl.gs (cuadrados de la pérdida), pl.gr (residuos), pl.gh (la hipótesis), pl.gp (puntos).
// pl.setH(u, v): pone la recta por (0, u) y (2, v) y recalcula residuos y cuadrados · pl.box(i): [x, y, lado] del cuadrado del punto i.
const aPlot = (p, S0, { x0 = 120, y0 = 750, un = 280, t0 = .4, r = 9 } = {}) => {
  const PX = x => x0 + x * un, PY = y => y0 - y * un, g = G(p, { o: t0 == null ? 1 : 0 }), id = 'aclip' + (aClipN++), pl = { g, PX, PY, x0, y0, un };
  if (t0 != null) show(g, t0);
  pl.fr = mk('rect', { x: x0, y: y0 - 2 * un, width: 2 * un, height: 2 * un, fill: 'none', stroke: COL.faint, 'stroke-width': 2 }, g);
  [0, 1, 2].forEach(v => { T(g, String(v), { x: PX(v), y: y0 + 34, size: 22, fill: COL.dim, anchor: 'middle', font: MATH }); T(g, String(v), { x: x0 - 16, y: PY(v) + 8, size: 22, fill: COL.dim, anchor: 'end', font: MATH }); });
  aTx(g, 'x', PX(1.5), y0 + 34, null, { size: 24, fill: COL.dim, anchor: 'middle' }); aTx(g, 'y', x0 - 16, PY(1.5) + 8, null, { size: 24, fill: COL.dim, anchor: 'end' });
  mk('rect', { x: x0, y: y0 - 2 * un, width: 2 * un, height: 2 * un }, mk('clipPath', { id }, g));
  pl.g0 = G(g); pl.gs = G(g, { o: 0 }); [pl.g0, pl.gs].forEach(e => e.setAttribute('clip-path', `url(#${id})`));
  pl.gr = G(g, { o: 0 }); pl.gh = G(g, { o: 0 }); pl.gp = G(g);

  pl.rs = S0.map(() => mk('path', { stroke: HUE.loss, 'stroke-width': 5, 'stroke-linecap': 'round', fill: 'none' }, pl.gr));
  pl.ln = mk('path', { stroke: HUE.hyp, 'stroke-width': 6, 'stroke-linecap': 'round', fill: 'none' }, pl.gh);
  pl.hl = aTx(pl.gh, 'h', 0, 0, null, { size: 30, fill: HUE.hyp, weight: 700 });
  pl.dot = S0.map(([x, y]) => mk('circle', { cx: PX(x), cy: PY(y), r, fill: HUE.pt, stroke: COL.board, 'stroke-width': 2 }, pl.gp));
  pl.box = i => { const [x, y] = S0[i], hy = aHy(...pl.hv, x), s = Math.abs(hy - y) * un; return [x <= 1 ? PX(x) : PX(x) - s, Math.min(PY(hy), PY(y)), s]; };
  pl.setH = (u, v) => {

    S0.forEach(([x, y], i) => { const [bx, by, s] = pl.box(i); pl.rs[i].setAttribute('d', `M${PX(x).toFixed(1)} ${PY(y).toFixed(1)}V${PY(aHy(u, v, x)).toFixed(1)}`); aSetA(pl.sq[i], { x: bx, y: by, width: s, height: s }); });

// Tablero de testigos: un eje con los puntos z_i, un testigo (z_i, t_i) por punto (marca horizontal) y una recta a + b·z recortada al marco.
// wt.set(a, b): mueve la recta; en cada punto pone el cruce, un trazo desde el testigo y su signo (+ por encima del testigo, − por debajo; si hay lado pedido, ✓ verde o ✗ rojo) ·

const aWit = (p, pts, { x0 = 120, y0 = 750, un = 280, t0 = .4, names = true, lw = 6 } = {}) => {
  const k = un / 280, PX = z => x0 + z * un, PY = v => y0 - v * un, g = G(p, { o: t0 == null ? 1 : 0 }), id = 'aclip' + (aClipN++), wt = { g, PX, PY, pts, want: null };

  pts.forEach(([z], i) => {
    mk('path', { d: `M${PX(z)} ${y0}V${y0 - 2 * un}`, stroke: COL.faint, 'stroke-width': 2, 'stroke-dasharray': '5 7' }, g); mk('circle', { cx: PX(z), cy: y0, r: 6 * k + 3, fill: HUE.pt }, g);
    if (names) aTx(g, `z_{${i + 1}}`, PX(z), y0 + 42, null, { size: 26, anchor: 'middle' });

    mk('path', { d: `M${PX(z) - 20 * k - 4} ${PY(t)}h${40 * k + 8}`, stroke: HUE.pt, 'stroke-width': 3 + 2 * k, 'stroke-linecap': 'round' }, wt.gw);

  wt.gs = G(g);
  wt.cn = pts.map(() => mk('path', { fill: 'none', stroke: COL.dim, 'stroke-width': 2 + 2 * k }, wt.gs));
  wt.cr = pts.map(() => mk('circle', { r: 5 * k + 3, fill: HUE.hyp, stroke: COL.board, 'stroke-width': 2 }, wt.gs));

const aSgTx = sg => '( ' + sg.map(s => s > 0 ? '+' : '−').join(',  ') + ' )';

/* ---------- beats: [id, título, run(m, D), { ask }?] ---------- */
const aE0 = aEmp(aS, ...aH0), aR0 = aRisk(...aH0);
const BEATS = [
  ['intro', 'Inicio', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Unidad 3 · Capítulo 23', { x: 800, y: 350, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Regresión: cotas de generalización', { x: 800, y: 450, size: 60, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'Cuando la etiqueta es un número, el error tiene tamaño. Y las garantías se adaptan.', 800, 580, m('sub'), { size: 30, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],

  ['reg', 'El problema de regresión', (m) => {
    const p = panel(0), tp = m('pts'), th = m('hyp'), tr = m('res'), to = m('one'), tl = m('lossf'), td = m('dif'), RX = 800;
    aNote(p, `datos ilustrativos, con semilla fija · tiza: la muestra · ámbar: la hipótesis · rosa: residuo y pérdida · violeta: complejidad`);
    aTitle(p, 'Regresión: la etiqueta es un número real');

      aTx(p, aSgTx(sg), RX + j * 188 + 80, 652, tg[j] + .3, { size: 26, anchor: 'middle', weight: 700, font: UI });
    });
    aRow(p, [['testigos  ', COL.chalk, UI, 26], ['t_{1}, …, t_{m} ∈ ℝ'], [':   un umbral por punto', COL.chalk, UI, 26]], RX, 250, twi, { size: 28, weight: 600 });
    aRow(p, [['sgn( g(z_{i}) − t_{i} )'], [':      +  por encima del testigo,    −  por debajo', COL.chalk, UI, 24]], RX, 320, tab, { size: 28, weight: 600 });
    aRow(p, [['fragmentado', HUE.hyp, UI, 26], [':   para algunos testigos, G logra las 2^{m} combinaciones', COL.chalk, UI, 24]], RX, 390, tfo, { size: 26, weight: 600 });
    aRow(p, [['Pdim(G)', HUE.cx], ['   =   tamaño del mayor conjunto fragmentado por G', COL.chalk, UI, 24]], RX, 728, tde, { size: 30, weight: 600 });
    aRow(p, [['Pdim(G)', HUE.cx], ['   =   VCdim( { (x, t) ↦ 1[ g(x) − t > 0 ] :  g ∈ G } )'], ['      (11.3)', COL.dim, UI, 22]], RX, 798, tvc, { size: 27, weight: 600 });
  }],

  ['q2', 'Comprobación', () => {
    const p = panel(0), BX = [130, 590, 1050], W = 420, HH = 380, Y = 262;
    T(p, 'Tres puntos, cada uno con su testigo', { x: 100, y: 130, size: 30, fill: COL.task, weight: 600 });
    aTx(p, 'La flecha dice de qué lado del testigo tiene que pasar la recta:  +  por encima,  −  por debajo.', 100, 190, null, { size: 26, fill: COL.dim, font: UI });
    S.q2L = [];
    S.q2 = aQ2.map((sg, j) => {
      const g = G(p, { x: BX[j], y: Y });
      mk('rect', { x: 0, y: 0, width: W, height: HH, fill: COL.board, stroke: COL.faint, 'stroke-width': 3 }, g);
      mk('circle', { cx: 380, cy: 40, r: 22, fill: COL.chalk }, g); T(g, String(j + 1), { x: 380, y: 49, size: 26, fill: COL.board, weight: 700, anchor: 'middle' });
      const wt = aWit(g, aP3, { x0: 46, y0: 346, un: 150, t0: null, names: false, lw: 5 }); wt.ask(sg);
      [wt.gl, wt.gs].forEach(e => put(e, { o: 0 }));
      if (aQ2L[j]) { wt.set(...aQ2L[j]); S.q2L.push(wt.gl, wt.gs); }
      return g;
    });
    S.q2B = BX.map(bx => [bx, Y, W, HH]);
  }, { ask: done => quiz(BAND, [{
    id: 'c-testigos', prompt: ['¿Qué combinación no logra ninguna recta?'],
    build: pickEls(S.q2.map((el, j) => ({ el, box: S.q2B[j], label: 'combinación ' + (j + 1) })), aQ2r,
      'Una recta por debajo de los testigos de los extremos queda también por debajo del central.',
      j => aQ2L[j][1] === 0 ? 'Esa sí se logra: con una recta horizontal entre los testigos.' : 'Esa sí se logra: con una recta inclinada, que deja al último testigo del otro lado.',
      () => S.q2L.forEach(e => fx(e, { o: 1 }, .2, .5))),
  }], done) }],

  ['dim', 'La cota con pseudo-dimensión', (m) => {
    const p = panel(0), tl2 = m('l2'), tl3 = m('l3'), thy = m('hyp'), tve = m('vec'), tth = m('thm'), tgr = m('grow'), RX = 800, no = aNo3[0];
    aNote(p, `los mismos tres puntos de la comprobación · barras: primer término de (11.6) con M = ${aM}; los valores de d son ilustrativos`);
    aTitle(p, 'Cuánto vale la pseudo-dimensión, y la cota que da');
    // dos puntos: las cuatro combinaciones; tres puntos: una combinación que ninguna recta logra
    const wa = aWit(p, aP3a), wb = aWit(p, aP3, { t0: tl3 });
    wa.set(...aL3a[0]); let from = aL3a[0];
    [1, 2, 3, 0].forEach((j, n) => { const a = from, b = aL3a[j]; prog(q => wa.set(...aMix(a, b, q)), tl2 + .5 + .7 * n, .5); from = b; });
    hide(wa.g, tl3, .4);
    wb.ask(no); const tries = [2, 0, 1].map(k => aTryL(aP3, no, k)); wb.set(...tries[0]); put(wb.gl, { o: 0 }); put(wb.gs, { o: 0 }); show(wb.gl, tl3 + 2.6, .4); show(wb.gs, tl3 + 2.6, .4);
    tries.forEach((L, n) => { if (n) { const a = tries[n - 1]; prog(q => wb.set(...aMix(a, L, q)), tl3 + 2.6 + 1.9 * n, .8); } });
    aRow(p, [['rectas sobre un eje:    ', COL.chalk, UI, 24], ['2 puntos, sí', COL.chalk, UI, 24], [';    3 puntos, nunca', COL.chalk, UI, 24], ['          Pdim = 2', HUE.cx]], RX, 250, [tl2, tl2, tl3, thy - 2.2], { size: 28, weight: 700 });
    aRow(p, [['Pdim( { x ↦ w · x + b :  w ∈ ℝ^{N},  b ∈ ℝ } )   =   '], ['N + 1', HUE.cx], ['      teorema 11.6', COL.dim, UI, 22]], RX, 334, thy, { size: 27, weight: 600 });
    aRow(p, [['H  espacio vectorial de funciones:    ', COL.chalk, UI, 24], ['Pdim(H) = dim(H)', HUE.cx], ['     teorema 11.7', COL.dim, UI, 22]], RX, 404, tve, { size: 27, weight: 600 });
    aRow(p, [['teorema 11.8', HUE.hyp, UI, 24], [',  (11.6)', COL.dim, UI, 22], [':    si  ', COL.chalk, UI, 24], ['Pdim(G) = d', HUE.cx], ['  y la pérdida es  ≤ M,', COL.chalk, UI, 24]], RX, 488, tth, { size: 27, weight: 600 });
    aRow(p, [['R(h) ≤ R̂_{S}(h) + '], ['M √( 2d log(em/d) / m )', HUE.cx], [' + M √( log(1/δ) / 2m )']], RX, 548, tth + 4.4, { size: 26, weight: 600 });
    // el término de complejidad para dos valores de d, mientras m crece
    const gb = G(p, { o: 0 }), DS = [2, 10], KX = 132, x0 = RX + 96, lm = aTx(gb, '', RX, 634, null, { size: 26, weight: 700, font: UI }); show(gb, tgr, .4);
    const bars = DS.map((d, k) => { const y = 664 + 52 * k; aTx(gb, `d = ${d}`, RX, y + 22, null, { size: 24, fill: HUE.cx, weight: 600 }); return { e: mk('rect', { x: x0, y, width: 0, height: 30, fill: HUE.cx }, gb), t: T(gb, '', { x: x0, y: y + 23, size: 24, fill: COL.dim, font: MATH }) }; });
    const setM = n => { lm._set(`m = ${aInt(n)}:      el término que crece con d y se achica con m`); DS.forEach((d, k) => { const v = aPd(d, n); bars[k].e.setAttribute('width', (v * KX).toFixed(1)); put(bars[k].t, { x: x0 + v * KX + 12 }); bars[k].t.textContent = aF2(v); }); };
    setM(100); prog(q => { const v = 10 ** (2 + 3 * q), st = 10 ** Math.floor(Math.log10(v) - 1); setM(q >= 1 ? 1e5 : Math.round(v / st) * st); }, tgr + 1.6, 3.6, lin);
  }],

  ['wrap', 'Resumen', (m) => {
    const p = panel(0);
    [['Regresión:  etiquetas reales; la pérdida mide la magnitud del error, acotada por M.', 'w1'], ['H finito (teorema 11.1):  la cota de clasificación, multiplicada por M.', 'w2'],
      ['Rademacher (teorema 11.3):  una pérdida μ-Lipschitz aporta, a lo sumo, un factor μ.', 'w3'], ['Pseudo-dimensión:  fragmentar con testigos; la cota (11.6) crece con d.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 240 + i * 130, o: 0 });
      mk('circle', { cx: 160, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 160, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      aTx(g, str, 220, 0, null, { size: 30, weight: 600, font: UI });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Práctica del capítulo', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-vf', prompt: ['Sobre este capítulo: ¿verdadero o falso?'],
    build: grid([
      { parts: ['En regresión, la pérdida mide cuánto difieren la predicción y la etiqueta, no solo si coinciden.'], ans: ['v'], why: 'Por eso se usan pérdidas como la cuadrática: el residuo al cuadrado.' },
      { parts: ['El error empírico con la pérdida cuadrática es el mayor de los residuos al cuadrado.'], ans: ['f'], why: 'Es el promedio sobre la muestra: el error cuadrático medio (11.2).' },
      { parts: ['Con H finito y la pérdida acotada por M, el término de la cota es el de clasificación multiplicado por M.'], ans: ['v'], why: 'Teorema 11.1: Hoeffding y la cota de la unión, con M. Si M = 1, coinciden.' },
      { parts: ['Si la pérdida es μ-Lipschitz, la complejidad de Rademacher de las pérdidas es al menos μ veces la de H.'], ans: ['f'], why: 'Es a lo sumo μ veces la de H: el lema de contracción da una cota superior.' },
      { parts: ['La pseudo-dimensión de las rectas sobre un eje es 3.'], ans: ['f'], why: 'Es N + 1 = 2: dos puntos se fragmentan con testigos; tres, nunca.' },
    ], [['v', 'verdadero', COL.real], ['f', 'falso', COL.task]], { multi: false, text: true }),
  }], done, 'Práctica del capítulo   1 de 1') }],

  ['finish', 'Fin', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
