<script>
'use strict';
const CHAPTER = { number: 7, title: 'Estimación contra aproximación: ERM y SRM', minutes: 6, language: 'es', next: '../ch08/' };

/* ---------- helpers de dibujo del capítulo (copiados del cap. 6) ---------- */
const HUE = { pos: COL.nat, neg: COL.whole, hyp: COL.task, est: COL.real, app: COL.rat };   // violeta: estimación y complejidad · rosa: aproximación
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500, font = UI } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, font, o: 0 }); show(e, t0); return e; };
// Texto con subíndices y superíndices: 'R_{D}(h_{S})'. Con t0 = null queda visible desde el inicio.
const aTx = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500, font = MATH } = {}) => {
  const e = T(p, '', { x, y, size, fill, anchor, weight, font, o: t0 == null ? 1 : 0 });
  let prev = 0;
  str.split(/([_^]\{[^}]*\})/).forEach(s => {
    if (!s) return;
    const k = /^[_^]\{/.test(s) ? (s[0] === '_' ? 1 : -1) : 0, dy = k > 0 ? size * .22 : k < 0 ? -size * .38 : 0;
    mk('tspan', { dy: dy - prev, ...(k ? { 'font-size': size * .68 } : {}) }, e).textContent = k ? s.slice(2, -1) : s;
    prev = dy;
  });
  if (t0 != null) show(e, t0);
  return e;
};
// Varias piezas de aTx seguidas en una línea, cada una con su color: [[texto, color], …]. Devuelve los elementos y, en .xs, dónde empieza cada uno.
const aRow = (p, parts, x, y, t0, opts = {}) => { const xs = [], els = parts.map(([str, fill]) => { xs.push(x); const e = aTx(p, str, x, y, t0, { ...opts, fill: fill || COL.chalk }); x += e.getComputedTextLength(); return e; }); els.xs = xs; els.end = x; return els; };
const aF3 = v => v.toFixed(3);
const aNote = (p, str) => text(p, str, 1570, 884, .4, { size: 22, fill: COL.dim, anchor: 'end' });
const aHue = v => v > 0 ? HUE.pos : HUE.neg;                                       // etiqueta +1 = salmón, etiqueta −1 = azul
const aSq = (p, x, y, fill, t0, o = .85) => { const e = put(mk('rect', { x, y: y - 18, width: 20, height: 20, fill, 'fill-opacity': o }, p), { o: 0 }); show(e, t0); return e; };

/* aMATH:begin — cuentas del capítulo, sin dibujo (se prueban aparte con Node) */
const aRng = seed => () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const aSum = l => l.reduce((s, v) => s + v, 0);
const aR6 = v => Math.round(v * 1e6) / 1e6;
const aBinom = (n, q) => { const o = []; let lc = 0; for (let k = 0; k <= n; k++) { o.push(Math.exp(lc + k * Math.log(q) + (n - k) * Math.log(1 - q))); lc += Math.log(n - k) - Math.log(k + 1); } return o; };
// El ejemplo: x uniforme en [0, 1); la etiqueta más probable es 1 en dos tramos (dados en celdas de 1/32) y se invierte con probabilidad aNu.
const aC = 32, aPos = [[1, 8], [12, 22]], aNu = .1, aM = 100, aK = 8, aKs = Array.from({ length: aK }, (_, i) => i + 1);
const aBay = Array.from({ length: aC }, (_, i) => aPos.some(([a, b]) => i >= a && i < b) ? 1 : 0);     // clasificador de Bayes, celda por celda
const aBins = k => 2 ** (k - 1);                                                   // H_k: funciones constantes en 2^(k−1) tramos iguales (anidados)
const aDraw = (seed, m) => { const r = aRng(seed); return Array.from({ length: m }, () => { const x = r(), y = aBay[Math.floor(x * aC)]; return [x, r() < aNu ? 1 - y : y]; }); };
const aAt = (h, x) => h[Math.min(h.length - 1, Math.floor(x * h.length))];
// Error de generalización exacto de una hipótesis h (lista de etiquetas, una por tramo): suma sobre 128 celdas.
const aRisk = h => { let s = 0; for (let c = 0; c < 128; c++) { const x = (c + .5) / 128; s += (aAt(h, x) === aAt(aBay, x) ? aNu : 1 - aNu) / 128; } return s; };
const aBest = k => { const N = aBins(k), w = Math.max(1, aC / N); return Array.from({ length: N }, (_, b) => N >= aC ? aAt(aBay, (b + .5) / N) : 2 * aSum(aBay.slice(b * w, b * w + w)) > w ? 1 : 0); };   // la mejor de H_k
const aErm = (smp, k) => { const N = aBins(k), v = Array(N).fill(0); smp.forEach(([x, y]) => v[Math.floor(x * N)] += y ? 1 : -1); return v.map(t => t > 0 ? 1 : 0); };   // ERM en H_k: voto por mayoría en cada tramo (empate o tramo vacío: 0)
const aEmp = (smp, h) => smp.filter(([x, y]) => aAt(h, x) !== y).length / smp.length;
// Complejidad de Rademacher exacta de H_k con x uniforme: (N/m) · E[ E|σ_1 + … + σ_n| ], con n ~ Binomial(m, 1/N).
const aRad = (m, k) => { const N = aBins(k), pmf = N > 1 ? aBinom(m, 1 / N) : null; let s = 0, g = 0; for (let n = 1; n <= m; n++) { g = n === 1 ? 1 : n % 2 ? g * n / (n - 1) : g; s += pmf ? pmf[n] * g : 0; } return (pmf ? N * s : g) / m; };
const aLogT = (m, k) => Math.sqrt(Math.log(k) / m);                                // √(log k / m), objetivo de SRM (4.4)
const aConf = (m, d) => Math.sqrt(2 * Math.log(3 / d) / m);                        // √(2 log(3/δ) / m), teorema 4.2
const aAll = k => { const N = aBins(k); return Array.from({ length: 2 ** N }, (_, c) => Array.from({ length: N }, (_, b) => c >> b & 1)); };   // todas las hipótesis de H_k (k pequeño)
// Una muestra y, para cada k: la solución de ERM, su error empírico y real, el mejor error de H_k, las dos partes del exceso y el objetivo de SRM.
const aRun = (seed, m) => {
  const smp = aDraw(seed, m), rows = aKs.map(k => { const h = aErm(smp, k), emp = aEmp(smp, h), R = aR6(aRisk(h)), inf = aR6(aRisk(aBest(k))), rad = aRad(m, k), lg = aLogT(m, k); return { k, h, emp, R, inf, est: aR6(R - inf), app: aR6(inf - aNu), exc: aR6(R - aNu), rad, lg, pen: rad + lg, F: emp + rad + lg }; });
  const F = rows.map(o => o.F), E = rows.map(o => o.exc);
  return { S: smp, rows, ks: F.indexOf(Math.min(...F)) + 1, ko: E.indexOf(Math.min(...E)) + 1 };
};
const aA = aRun(3, aM), aB = aRun(5, aM);                                           // la muestra del capítulo y la de la comprobación 2
const aRw = k => aA.rows[k - 1];
// Las 256 hipótesis de H_4 como puntos (R, R̂), la mayor brecha |R − R̂|, la que elige ERM y la mejor.
const aSc = (() => { const k = 4, pts = aAll(k).map(h => [aR6(aRisk(h)), aEmp(aA.S, h)]), low = j => pts.reduce((b, q, i) => q[j] < pts[b][j] ? i : b, 0); return { k, pts, gap: aR6(Math.max(...pts.map(([r, e]) => Math.abs(r - e)))), erm: pts[low(1)], best: pts[low(0)] }; })();
const aKh = aA.rows.find(o => o.app === 0).k, aDl = .05;                           // k(h*): el primer conjunto que contiene al clasificador de Bayes
const aTh = [100, 1600, 25600].map(m => [m, 2 * aRad(m, aKh), aLogT(m, aKh), aConf(m, aDl)]);   // términos de (4.6) al crecer m
const aQk = [1, 3, 8], aQF = aQk.map(k => aB.rows[k - 1].F), aQr = aQF.indexOf(Math.min(...aQF));   // comprobación 2
const aP2 = [[2, .30, .10], [5, .12, .30]].map(([k, e, r]) => [k, e, r, e + r + aLogT(100, k)]);   // práctica 2: [k, error empírico, ℜ, F]
/* aMATH:end */

// Hipótesis constante por tramos como franja de celdas de color.
const aStrip = (p, h, x, y, w, ht = 30) => { const g = G(p), cw = w / h.length; h.forEach((v, i) => mk('rect', { x: (x + i * cw).toFixed(2), y, width: (cw + .5).toFixed(2), height: ht, fill: aHue(v), 'fill-opacity': .82 }, g)); return g; };
// Muestra sobre el eje: los +1 arriba de la línea, los −1 debajo.
const aPts = (p, smp, x, y, w, t0) => smp.forEach(([u, v], j) => { const e = put(mk('circle', { cx: (x + u * w).toFixed(1), cy: y + (v ? -1 : 1) * (11 + (j % 3) * 11), r: 5, fill: aHue(v) }, p), { o: 0 }); show(e, t0 + j * .02, .25); });
// Barra vertical que crece desde la base.
const aUp = (p, x, base, w, h, t0, fill, o = .85) => { const e = mk('rect', { x, y: base, width: w, height: 0, fill, 'fill-opacity': o }, p); put(e, {}); tw(e, { a_y: base - h, a_height: h }, t0, .6, out); return e; };
const aTr = k => aBins(k) === 1 ? '1 tramo' : aBins(k) + ' tramos';
const aMs = n => String(n).replace(/\B(?=(\d{3})+$)/g, ' ');                       // 25600 → «25 600»

/* ---------- beats: [id, título, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Inicio', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Unidad 1 · Capítulo 7', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Estimación contra aproximación', { x: 800, y: 420, size: 68, weight: 600, anchor: 'middle' });
    T(g, 'ERM y SRM', { x: 800, y: 500, size: 48, weight: 600, anchor: 'middle', fill: COL.task });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'Selección de modelo: cómo elegir el conjunto de hipótesis H.', 800, 620, m('sub'), { size: 32, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],

  ['problema', 'El problema de selección de modelo', (m) => {
    const p = panel(0), td = m('data'), tb = m('bay'), ts = [m('h1'), m('h4'), m('h8')], tt = m('trade'), X = 360, W = 880;
    aNote(p, 'datos ilustrativos · muestra con semilla · errores calculados en la página');
    text(p, 'Selección de modelo: ¿qué conjunto de hipótesis H conviene usar?', 100, 130, .3, { size: 30, fill: COL.task, weight: 600 });
    show(put(mk('path', { d: `M${X} 250H${X + W}`, stroke: COL.dim, 'stroke-width': 2 }, p), { o: 0 }), td, .3);
    text(p, 'muestra S', 100, 244, td, { size: 26, weight: 600 }); text(p, `m = ${aM} puntos`, 100, 276, td + .4, { size: 22, fill: COL.dim });
    text(p, '0', X - 14, 258, td, { size: 22, fill: COL.dim, anchor: 'end', font: MATH }); text(p, '1', X + W + 14, 258, td, { size: 22, fill: COL.dim, font: MATH });
    aPts(p, aA.S, X, 250, W, td + .3);
    [[1, 'etiqueta +1'], [0, 'etiqueta −1']].forEach(([v, s], i) => { show(put(mk('circle', { cx: 1300, cy: 232 + i * 34, r: 7, fill: aHue(v) }, p), { o: 0 }), td + .6); text(p, s, 1318, 240 + i * 34, td + .6, { size: 22, fill: COL.dim }); });
    aTx(p, 'h_{Bayes}', 100, 352, tb, { size: 28, weight: 600 }); text(p, 'etiqueta más probable', 100, 382, tb + .4, { size: 22, fill: COL.dim });
    show(put(aStrip(p, aBay, X, 330, W), { o: 0 }), tb, .6);
    aTx(p, `R^{*} = ${aF3(aNu)}`, 1290, 352, tb + 7.4, { size: 28, weight: 600 }); text(p, 'error de Bayes', 1290, 382, tb + 7.8, { size: 22, fill: COL.dim });
    text(p, 'en cada conjunto, la hipótesis con menor error en la muestra', X, 440, ts[0], { size: 22, fill: COL.dim });
    aTx(p, 'R̂_{S}(h)', 1290, 440, ts[0], { size: 24, fill: COL.dim }); aTx(p, 'R(h)', 1440, 440, ts[0], { size: 24, fill: COL.dim });
    [1, 4, 8].forEach((k, i) => {
      const y = 490 + i * 90, o = aRw(k), t = ts[i];
      aTx(p, `H_{${k}}`, 100, y + 10, t, { size: 30, fill: HUE.hyp, weight: 600 }); text(p, aTr(k), 160, y + 9, t + .3, { size: 22, fill: COL.dim });
      show(put(aStrip(p, o.h, X, y - 15, W), { o: 0 }), t + .4, .6);
      text(p, aF3(o.emp), 1290, y + 10, t + 1.2, { size: 28 }); text(p, aF3(o.R), 1440, y + 10, t + 1.8, { size: 28, weight: 700 });
    });
    text(p, 'H pobre: ninguna hipótesis se acerca a Bayes.   H rico: aprender con él es más difícil.', 800, 800, tt, { size: 28, fill: COL.task, anchor: 'middle', weight: 600 });
  }],

  ['descomp', 'Dos partes del error', (m) => {
    const p = panel(0), tx = m('exc'), tb = m('best'), te = m('est'), ta = m('app'), tn = m('num'), th = m('hid'), tc = m('bound'), o = aRw(4);
    const CX = 330, CY = 400, RX = 220, RY = 140, B = [640, 220], Hh = [250, 450], k = 1 / Math.hypot((B[0] - CX) / RX, (B[1] - CY) / RY), Hs = [CX + (B[0] - CX) * k, CY + (B[1] - CY) * k];
    aNote(p, 'arriba, esquema de la figura 4.1 · abajo, valores exactos del ejemplo');
    text(p, 'El error de una hipótesis h elegida en H, en dos partes', 100, 130, .3, { size: 30, fill: COL.task, weight: 600 });
    show(put(mk('ellipse', { cx: CX, cy: CY, rx: RX, ry: RY, fill: COL.faint, 'fill-opacity': .25, stroke: COL.chalk, 'stroke-width': 3 }, p), { o: 0 }), .3);
    text(p, 'H', 170, 350, .4, { size: 36, font: MATH, weight: 600 });
    const seg = (a, b, c) => path(p, `M${a[0]} ${a[1]}L${b[0].toFixed(1)} ${b[1].toFixed(1)}`, { stroke: c, 'stroke-width': 7, 'stroke-linecap': 'round' }, { d: 0 });
    show(put(mk('path', { d: `M${Hh[0]} ${Hh[1]}L${B[0]} ${B[1]}`, stroke: COL.dim, 'stroke-width': 2, 'stroke-dasharray': '8 8' }, p), { o: 0 }), tx + .6);
    draw(seg(Hh, Hs, HUE.est), te, 1); draw(seg(Hs, B, HUE.app), ta, 1);
    const dot = (q, c, t, lab, dx, dy) => { show(put(mk('circle', { cx: q[0], cy: q[1], r: 12, fill: c }, p), { o: 0 }), t, .4); aTx(p, lab, q[0] + dx, q[1] + dy, t, { size: 28, fill: c, weight: 600 }); };
    dot(Hh, HUE.hyp, .5, 'h', -34, 34); dot(B, COL.chalk, tx, 'h_{Bayes}', 20, -14); dot(Hs, COL.chalk, tb, 'h^{*}', -6, -22);
    text(p, 'estimación', 386, 440, te + .6, { size: 24, fill: HUE.est, weight: 600 }); text(p, 'aproximación', 596, 312, ta + .6, { size: 24, fill: HUE.app, weight: 600 });
    aTx(p, 'h^{*}: la mejor hipótesis de H', 100, 590, tb + .4, { size: 22, fill: COL.dim, font: UI });
    aTx(p, 'R(h) − R^{*}', 820, 210, tx, { size: 38, weight: 600 }); text(p, 'exceso de error', 1060, 208, tx + .5, { size: 24, fill: COL.dim });
    aTx(p, '=   R(h) − inf_{h∈H} R(h)', 820, 284, te, { size: 34, fill: HUE.est, weight: 600 }); text(p, 'estimación', 1280, 282, te + .5, { size: 24, fill: HUE.est, weight: 600 });
    aTx(p, '+   inf_{h∈H} R(h) − R^{*}', 820, 358, ta, { size: 34, fill: HUE.app, weight: 600 }); text(p, 'aproximación', 1280, 356, ta + .5, { size: 24, fill: HUE.app, weight: 600 });
    text(p, '(4.1)', 1480, 356, ta + .5, { size: 22, fill: COL.dim });
    text(p, 'aproximación: no se puede medir, depende de D', 820, 450, th, { size: 26 });
    text(p, 'estimación: a veces se puede acotar', 820, 494, tc, { size: 26 });
    // el ejemplo, sobre un eje de error
    const EX = e => 200 + e * 4400, Y = 740;
    aTx(p, `en el ejemplo, con H_{4} (${aTr(4)}) y la hipótesis h con menor error en la muestra`, 200, 640, tn, { size: 22, fill: COL.dim, font: UI });
    show(put(mk('path', { d: `M${EX(0)} ${Y}H${EX(.26)}M${EX(0)} ${Y - 8}v16`, stroke: COL.dim, 'stroke-width': 2, fill: 'none' }, p), { o: 0 }), tn);
    text(p, '0', EX(0), Y + 38, tn, { size: 22, fill: COL.dim, anchor: 'middle', font: MATH }); text(p, 'error', EX(.26) + 14, Y + 8, tn, { size: 22, fill: COL.dim });
    [[aNu, o.inf, HUE.app, 'aproximación', o.app], [o.inf, o.R, HUE.est, 'estimación', o.est]].forEach(([a, b, c, s, v], i) => {
      show(put(mk('rect', { x: EX(a), y: Y - 7, width: EX(b) - EX(a), height: 14, fill: c }, p), { o: 0 }), tn + .8 + i * 2.6);
      text(p, `${s} ${aF3(v)}`, (EX(a) + EX(b)) / 2, Y + 44, tn + .8 + i * 2.6, { size: 24, fill: c, anchor: 'middle', weight: 600 });
    });
    [[aNu, `R^{*} = ${aF3(aNu)}`], [o.inf, `mejor de H_{4}: ${aF3(o.inf)}`], [o.R, `R(h) = ${aF3(o.R)}`]].forEach(([e, s], i) => {
      show(put(mk('path', { d: `M${EX(e)} ${Y - 16}v32`, stroke: COL.chalk, 'stroke-width': 3 }, p), { o: 0 }), tn + .3 + i * .2);
      aTx(p, s, EX(e), Y - 30, tn + .3 + i * .2, { size: 24, anchor: 'middle', font: UI });
    });
  }],

  ['crece', 'Agrandar H', (m) => {
    const p = panel(0), tn = m('nest'), ta = m('app'), te = m('est'), ts = m('sum'), tm = m('min'), th = m('how');
    const LX = 80, CY = 440, rx = k => 40 + 30 * k, ry = k => rx(k) * .6, B = [490, 410], edge = k => LX + rx(k) + rx(k) * Math.sqrt(1 - ((B[1] - CY) / ry(k)) ** 2);
    const KX = k => 780 + (k - 1) * 98, base = 660, sc = 800, R = aA.rows;
    aNote(p, 'a la izquierda, esquema de la figura 4.2 · a la derecha, errores exactos del ejemplo');
    text(p, 'Agrandar H: lo que se gana y lo que se pierde', 100, 130, .3, { size: 30, fill: COL.task, weight: 600 });
    aTx(p, `H_{1} ⊂ H_{2} ⊂ … ⊂ H_{${aK}}`, LX, 200, tn, { size: 32, weight: 600 }); text(p, 'conjuntos anidados', LX, 236, tn + .5, { size: 22, fill: COL.dim });
    const el = aKs.map(k => { const e = put(mk('ellipse', { cx: LX + rx(k), cy: CY, rx: rx(k), ry: ry(k), fill: COL.faint, 'fill-opacity': .1, stroke: COL.chalk, 'stroke-width': 2 }, p), { o: 0 }); show(e, k === 1 ? .3 : tn + .4 + k * .45, .4); return e; });
    aTx(p, 'H_{1}', LX + 34, CY + 8, .4, { size: 24 }); aTx(p, `H_{${aK}}`, LX + rx(aK), CY + ry(aK) + 32, tn + .4 + aK * .45, { size: 24, anchor: 'middle' });
    // el tramo rosa: lo que le falta al conjunto actual para llegar a h_Bayes
    const gap = put(mk('path', { d: `M${B[0]} ${B[1]}H${B[0]}`, stroke: HUE.app, 'stroke-width': 7, 'stroke-linecap': 'round' }, p), { o: 0 }); show(gap, ta, .2);
    prog(q => { const k = Math.min(aK, 1 + Math.floor(q * aK)); gap.setAttribute('d', `M${B[0]} ${B[1]}H${Math.min(B[0], edge(k)).toFixed(1)}`); el.forEach((e, i) => e.setAttribute('stroke-width', i + 1 === k && q < 1 ? 5 : 2)); }, ta, aK * .8, lin);
    show(put(mk('circle', { cx: B[0], cy: B[1], r: 11, fill: COL.chalk }, p), { o: 0 }), .5); aTx(p, 'h_{Bayes}', B[0] + 8, B[1] - 20, .5, { size: 26, weight: 600 });
    // el gráfico: una pareja de barras por conjunto y la suma como línea
    const ax = G(p, { o: 0 });
    mk('path', { d: `M${KX(1) - 50} ${base - .42 * sc}V${base}H${KX(aK) + 50}`, fill: 'none', stroke: COL.dim, 'stroke-width': 2 }, ax);
    [0, .1, .2, .3, .4].forEach(v => { T(ax, v ? v.toFixed(1) : '0', { x: KX(1) - 62, y: base - v * sc + 8, size: 22, fill: COL.dim, anchor: 'end', font: MATH }); mk('path', { d: `M${KX(1) - 56} ${base - v * sc}h6`, stroke: COL.dim, 'stroke-width': 2 }, ax); });
    aKs.forEach(k => { T(ax, String(k), { x: KX(k), y: base + 32, size: 24, anchor: 'middle', font: MATH }); T(ax, String(aBins(k)), { x: KX(k), y: base + 62, size: 22, fill: COL.dim, anchor: 'middle', font: MATH }); });
    T(ax, 'k', { x: KX(1) - 62, y: base + 32, size: 24, anchor: 'end', font: MATH }); T(ax, 'tramos', { x: KX(1) - 62, y: base + 62, size: 22, fill: COL.dim, anchor: 'end' });

    id: 'p-srm', prompt: [`Con m = 100. En H₂, la solución de ERM tiene error empírico ${aP2[0][1].toFixed(2)} y la complejidad de Rademacher es ${aP2[0][2].toFixed(2)}. En H₅: error empírico ${aP2[1][1].toFixed(2)} y complejidad ${aP2[1][2].toFixed(2)}. ¿Cuál elige SRM entre los dos?`],
    build: choice([['H₂'], ['H₅'], ['cualquiera: las dos sumas coinciden']], 0,
      `F₂ = ${aP2[0][1].toFixed(2)} + ${aP2[0][2].toFixed(2)} + √(log 2 / 100) ≈ ${aF3(aP2[0][3])};  F₅ = ${aP2[1][1].toFixed(2)} + ${aP2[1][2].toFixed(2)} + √(log 5 / 100) ≈ ${aF3(aP2[1][3])}. Gana la suma menor.`,
      [null, `Su error empírico es menor, pero la penalización pesa más: F₅ ≈ ${aF3(aP2[1][3])} contra F₂ ≈ ${aF3(aP2[0][3])}.`, `No coinciden: F₂ ≈ ${aF3(aP2[0][3])} y F₅ ≈ ${aF3(aP2[1][3])}.`]),
  }], done, 'Práctica del capítulo   2 de 2') }],

  ['finish', 'Fin', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
