const aSYM = /([αβεγδηφρσλμ‖ℜ√∑∏⟹⟺≈∼∞ŷ])/;                                            // símbolos que van siempre en la fuente matemática

};
// Varias piezas de aTx en una línea: [texto, color, fuente]; t0 puede ser una lista con un instante por pieza.

const aF2 = v => { const s = v.toFixed(2); return /^-0\.00$/.test(s) ? '0.00' : s.replace('-', '−'); };
const aWt = v => v === 0 ? '0' : String(+v.toFixed(3));                              // peso: 1, 0.5, 0.125
const aNote = (p, str) => aTx(p, str, 1570, 884, .4, { size: 22, fill: COL.dim, anchor: 'end', font: UI });

const aSq = (p, x, y, col, lab, { line = false, dash = null } = {}) => { mk(line ? 'path' : 'rect', line ? { d: `M${x} ${y - 8}h30`, stroke: col, 'stroke-width': 4, fill: 'none', ...(dash ? { 'stroke-dasharray': dash } : {}) } : { x: x + 6, y: y - 17, width: 18, height: 18, fill: col }, p); return aTx(p, lab, x + 42, y, null, { size: 22, fill: COL.dim, font: UI }); };   // entrada de leyenda

/* aMATH:begin — cuentas del capítulo, sin dibujo (se prueban aparte con Node) */
const aRng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

const aSum = v => v.reduce((s, u) => s + u, 0);

const aPe = [.42, .3, .48, .15, .38, .5, .33, .45];
const aGen = (seed, pe, n) => { const r = aRng(seed), y = [], adv = []; for (let t = 0; t < n; t++) { const yt = r() < .5 ? 1 : 0; y.push(yt); adv.push(pe.map(q => r() < q ? 1 - yt : yt)); } return { y, adv }; };

const aCum = (adv, y) => { const c = [adv[0].map(() => 0)]; adv.forEach((a, t) => c.push(a.map((v, i) => c[t][i] + (v !== y[t] ? 1 : 0)))); return c; };
// --- Mayoría ponderada (figura 8.3): voto ponderado, empate a favor de 1; solo si el algoritmo falla, peso × β para los expertos que fallaron.
// Con β = 0 es Halving (figura 8.2). y puede ser una lista o una función (predicción, ronda) → etiqueta: el adversario.
// Por ronda: w (antes), s0 y s1 (peso por 0 y por 1), pred, y, err, wn (después), m (errores acumulados), W y Wn (suma de pesos antes y después).
const aWM = (adv, y, beta) => { let w = adv[0].map(() => 1), m = 0; const yf = Array.isArray(y) ? (q, t) => y[t] : y; return adv.map((a, t) => { const s1 = aSum(w.filter((v, i) => a[i] === 1)), s0 = aSum(w.filter((v, i) => a[i] === 0)), pred = s1 >= s0 ? 1 : 0, yt = yf(pred, t), err = pred !== yt, wn = err ? w.map((v, i) => a[i] !== yt ? v * beta : v) : w; m += err ? 1 : 0; const row = { w, s0, s1, pred, y: yt, err, wn, m, W: aSum(w), Wn: aSum(wn) }; w = wn; return row; }); };
// --- Mayoría ponderada aleatorizada (figura 8.4): p = w / W, pérdida esperada L = ∑ p_i l_i, peso × β para todo experto que falla.
// pick = experto sorteado con semilla; cumL = pérdida esperada acumulada; cumS = errores del sorteo.
const aRWM = (adv, y, beta, seed) => { let w = adv[0].map(() => 1), cumL = 0, cumS = 0; const r = aRng(seed); return adv.map((a, t) => { const W = aSum(w), p = w.map(v => v / W), l = a.map(v => v !== y[t] ? 1 : 0), L = aSum(p.map((v, i) => v * l[i])); let u = r(), pick = 0; while (pick < p.length - 1 && u >= p[pick]) { u -= p[pick]; pick++; } const wn = w.map((v, i) => l[i] ? v * beta : v); cumL += L; cumS += l[pick]; const row = { w, p, L, pick, pred: a[pick], err: !!l[pick], wn, cumL, cumS }; w = wn; return row; }); };

const aEWA = (adv, y, eta) => { let w = adv[0].map(() => 1), cumL = 0; return adv.map((a, t) => { const W = aSum(w), yh = aSum(w.map((v, i) => v * a[i])) / W, loss = Math.abs(yh - y[t]), wn = w.map((v, i) => v * Math.exp(-eta * Math.abs(a[i] - y[t]))); cumL += loss; const row = { w, p: w.map(v => v / W), yh, loss, wn, cumL }; w = wn; return row; }); };
// --- Cotas del libro (logaritmo natural).
const aB86 = (n, ms, beta) => (Math.log(n) + ms * Math.log(1 / beta)) / Math.log(2 / (1 + beta));   // (8.6)
const aBetaOpt = (n, tt) => Math.max(.5, 1 - Math.sqrt(Math.log(n) / tt));                          // β del teorema 8.4
const aB89 = (n, lmin, beta) => Math.log(n) / (1 - beta) + (2 - beta) * lmin;                       // (8.9), cota de L_T
const aB812 = (n, tt) => 2 * Math.sqrt(tt * Math.log(n));                                           // (8.12)
const aEtaOpt = (n, tt) => Math.sqrt(8 * Math.log(n) / tt);                                         // η del teorema 8.6
const aB815 = (n, tt, eta) => Math.log(n) / eta + eta * tt / 8;                                     // (8.15)
const aB816 = (n, tt) => Math.sqrt(tt / 2 * Math.log(n));                                           // (8.16)

const aSeq = aGen(112, aPe, aTT), aCumM = aCum(aSeq.adv, aSeq.y), aWm = aWM(aSeq.adv, aSeq.y, aBeta);
const aArgmin = v => v.indexOf(Math.min(...v));
const aBest = aArgmin(aCumM[aTT]), aBest10 = aArgmin(aCumM[aShow]);                  // mejor experto en retrospectiva, a 100 y a 10 rondas
const aMs = aCumM[aTT][aBest], aMT = aWm[aTT - 1].m, aBnd = aB86(aN, aMs, aBeta), aK86 = Math.log(1 / aBeta) / Math.log(2 / (1 + aBeta));
const aWtot = [...aWm.map(r => r.W), aWm[aTT - 1].Wn], aWbest = [...aWm.map(r => r.w[aBest]), aWm[aTT - 1].wn[aBest]];   // W_t y el peso del mejor experto, t = 1 … T + 1
// Halving: ocho expertos con consejos al azar (semilla), uno de ellos copia la etiqueta (caso realizable).
const aHal = (() => { const seed = 141, c = seed % aN, r = aRng(seed), y = [], adv = []; for (let t = 0; t < aShow; t++) { const yt = r() < .5 ? 1 : 0; y.push(yt); adv.push(Array.from({ length: aN }, (_, i) => i === c ? yt : (r() < .5 ? 1 : 0))); } return { y, adv, c }; })();
const aHv = aWM(aHal.adv, aHal.y, 0), aHw = [...aHv.map(r => r.w), aHv[aShow - 1].wn];
const aHerr = aHv.map((r, t) => r.err ? t : -1).filter(t => t >= 0), aHact = aHerr.map(t => aHv[t].Wn);   // rondas con error (desde 0) y activos que quedan tras cada una

const aA2 = Array.from({ length: aTT }, () => [0, 1]), aAd = aWM(aA2, q => 1 - q, aBeta), aY2 = aAd.map(r => r.y), aCum2 = aCum(aA2, aY2);

// Tablero de rondas: una fila por experto, una columna por ronda, y debajo la etiqueta y la predicción del algoritmo.
// side = { head, vals[k][i], fmt, bar, vmax }: columna lateral por experto (errores, peso, probabilidad) con el valor tras k rondas.
// pick[k] = experto sorteado en la ronda k (recuadro ámbar). dimZero: la fila se apaga cuando su valor lateral llega a 0.

const aBoard = (p, { adv, y, pred, names, n = aShow, side = null, pick = null, ox = 250, oy = 244, t0 = .4, dimZero = false }) => {
  const N = adv[0].length, cw = 54, rh = 42, CX = k => ox + k * cw + cw / 2, RY = i => oy + i * rh, LY = RY(N) + 10, AY = LY + rh, SX = ox + n * cw + 24, BW = 120;
  const g = G(p, { o: t0 == null ? 1 : 0 }), gE = G(g), bd = { g, gE, CX, RY, LY, AY, SX, N, n, cw, rh, ox };
  T(g, 'ronda', { x: ox - 14, y: oy - rh + 8, size: 22, fill: COL.dim, anchor: 'end' });
  for (let k = 0; k < n; k++) T(g, String(k + 1), { x: CX(k), y: oy - rh + 8, size: 22, fill: COL.dim, anchor: 'middle', font: MATH });
  mk('path', { d: `M${ox - 150} ${LY - rh / 2 - 5}H${ox + n * cw}`, stroke: COL.faint, 'stroke-width': 2 }, g);
  const cell = (par, k, yy, str, fill, ok, weight = 500) => {
    const bg = ok == null ? null : put(mk('rect', { x: CX(k) - cw / 2 + 3, y: yy - rh / 2 + 3, width: cw - 6, height: rh - 6, fill: ok ? COL.good : COL.bad, 'fill-opacity': ok ? .16 : .42 }, par), { o: 0 });

  };

  if (side) aTx(bd.sg, side.head, SX, oy - rh + 8, null, { size: 22, fill: COL.dim, font: UI });
  bd.rows = names.map((nm, i) => {
    const rg = G(gE), rw = { rg };
    rw.lab = T(rg, nm, { x: ox - 14, y: RY(i) + 8, size: 22, fill: COL.chalk, anchor: 'end' });
    rw.cells = Array.from({ length: n }, (_, k) => cell(rg, k, RY(i), String(adv[k][i]), COL.chalk, adv[k][i] === y[k]));
    if (side) {
      const sr = G(bd.sg);
      if (side.bar) rw.bar = mk('rect', { x: SX, y: RY(i) - 9, width: BW, height: 18, fill: HUE.w }, sr);
      rw.num = T(sr, '', { x: SX + (side.bar ? BW + 12 : 30), y: RY(i) + 8, size: 22, fill: side.bar ? HUE.w : COL.chalk, font: MATH, weight: 600, anchor: side.bar ? 'start' : 'middle' });
      rw.sr = sr;
    }
    return rw;
  });
  T(g, 'etiqueta', { x: ox - 14, y: LY + 8, size: 22, fill: COL.dim, anchor: 'end' });
  bd.lab = Array.from({ length: n }, (_, k) => cell(g, k, LY, String(y[k]), y[k] ? HUE.pos : HUE.neg, null, 700));
  T(g, 'algoritmo', { x: ox - 14, y: AY + 8, size: 22, fill: HUE.hyp, anchor: 'end', weight: 600 });
  bd.alg = Array.from({ length: n }, (_, k) => cell(g, k, AY, String(pred[k]), HUE.hyp, pred[k] === y[k], 700));

  ['escenario', 'El escenario on-line', (m) => {

    const f1 = aTx(p, 'ŷ_{t}   =   ∑_{i} w_{t,i} y_{t,i}  /  ∑_{i} w_{t,i}', 100, 252, ta, { size: 30, weight: 600 });
    text(p, '(8.13)', 100 + f1.getComputedTextLength() + 22, 250, ta, { size: 22, fill: COL.dim });
    const f2 = aTx(p, 'w_{t+1,i}   =   w_{t,i} · exp( −η L(y_{t,i}, y_{t}) )', 100, 310, tu, { size: 30, weight: 600 });
    text(p, '(8.14)', 100 + f2.getComputedTextLength() + 22, 308, tu, { size: 22, fill: COL.dim });
    aTx(p, 'aquí:   L(ŷ, y)  =  |ŷ − y|', 1000, 252, tr, { size: 28, weight: 600 });
    // izquierda: pesos normalizados de los ocho expertos
    const gb = G(p, { o: 0 }); show(gb, tr);
    const ro = aTx(gb, '', 100, 362, null, { size: 24, fill: COL.dim, font: UI });
    const bars = aNames.map((nm, i) => { T(gb, nm, { x: BX - 14, y: RY(i) + 8, size: 22, anchor: 'end' }); const b = mk('rect', { x: BX, y: RY(i) - 9, width: 0, height: 18, fill: HUE.w }, gb), n = T(gb, '', { x: BX, y: RY(i) + 8, size: 22, fill: HUE.w, font: MATH, weight: 600 }); return { b, n }; });
    // derecha: pérdida acumulada
    const ch = aPlot(p, CX0, Y0, 460, 250, { v0: 0, v1: 20, yt: [[0, '0'], [10, '10'], [20, '20']], t0: tr });
    aTx(ch.g, 'pérdida acumulada', CX0, 376, null, { size: 22, fill: COL.dim, font: UI });
    aSq(ch.g, CX0 + 210, 376, HUE.hyp, 'algoritmo', { line: true }); aSq(ch.g, CX0 + 380, 376, COL.chalk, 'mejor experto', { line: true });
    const lb = ch.live(aCumOf(aCumM, aBest), COL.chalk), la = ch.live(aAcc(aEw, 'cumL'), HUE.hyp);
    const setR = r => {
      const k = Math.min(aTT - 1, Math.floor(r)), pp = r >= aTT ? aEw[aTT - 1].wn.map(v => v / aSum(aEw[aTT - 1].wn)) : aEw[k].p;
      bars.forEach((e, i) => { e.b.setAttribute('width', (pp[i] * BW).toFixed(1)); put(e.n, { x: BX + pp[i] * BW + 12 }); e.n.textContent = aF2(pp[i]); });
      ro._set(`pesos normalizados tras ${Math.min(aTT, Math.floor(r))} rondas`);
      la(r); lb(r);
    };
    setR(0);
    prog(q => setR(q * aTT), tr + .8, tn + 3 - tr - .8, lin);
    aHalo(aTx(p, aF2(LT), ch.CX(aTT) + 14, ch.VY(LT) + 2, tn + 3, { size: 24, fill: HUE.hyp, weight: 600 }));
    aHalo(aTx(p, String(aMs), ch.CX(aTT) + 14, ch.VY(aMs) + 14, tn + 4.6, { size: 24, weight: 600 }));
    aRow(p, [['regret:   ', COL.dim, UI], [`R_{T}  =  ${aF2(LT - aMs)}`, HUE.hyp]], 1290, 470, tn + 5.6, { size: 26, weight: 600 });
    const g1 = aRow(p, [['Teorema 8.6:     ', HUE.hyp, UI], ['R_{T}   ≤   (log N)/η  +  ηT/8']], 100, 772, tt, { size: 30, weight: 600 });
    text(p, '(8.15)', g1.end + 22, 770, tt, { size: 22, fill: COL.dim });
    const g2 = aRow(p, [[`con  η = √( 8 (log N)/T ) = ${aF2(aEta)}:     `, COL.dim], ['R_{T}   ≤   √( (T/2) log N )'], [`   =   ${aF2(aB816(aN, aTT))}`, HUE.hyp]], 100, 830, [to, to + 1, to + 5], { size: 28, weight: 600 });
    text(p, '(8.16)', g2.end + 22, 828, to + 1, { size: 22, fill: COL.dim });
  }],

  ['wrap', 'Resumen', (m) => {
    const p = panel(0);
    [['On-line: por rondas y sin distribución; se mide el regret frente al mejor experto.', 'w1'], ['Halving (caso realizable):  a lo sumo  log_{2} N  errores.', 'w2'],
      ['Mayoría ponderada: peso × β al fallar;  errores ≤ O(log N) + constante × los del mejor.', 'w3'], ['Pérdida 0-1: sortear.  Pérdidas convexas: promediar.  Regret del orden de √(T log N).', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 240 + i * 130, o: 0 });
      mk('circle', { cx: 160, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 160, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      aTx(g, str, 220, 0, null, { size: 30, weight: 600, font: UI });
      tw(g, { o: 1, x: 0 }, m(mark), .6);

  }],

  ['final1', 'Práctica del capítulo', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-vf', prompt: ['Sobre este capítulo: ¿verdadero o falso?'],
    build: grid([
      { parts: ['En el escenario on-line se supone que los puntos salen de una distribución fija.'], ans: ['f'], why: 'No se supone ninguna distribución: la secuencia puede elegirla un adversario.' },
      { parts: ['En el caso realizable, con 8 expertos, Halving comete a lo sumo 3 errores.'], ans: ['v'], why: 'La cota es logaritmo en base 2 de 8: cada error apaga al menos a la mitad de los activos.' },
      { parts: ['En la mayoría ponderada, un experto que falla queda apagado para siempre.'], ans: ['f'], why: 'Su peso se multiplica por beta y sigue votando. Apagarlo es lo que hace Halving.' },
      { parts: ['Con la pérdida 0-1, un algoritmo determinista puede sufrir un regret lineal en T.'], ans: ['v'], why: 'El adversario elige siempre la etiqueta contraria a la predicción.' },
      { parts: ['El regret de la mayoría ponderada aleatorizada crece linealmente con T.'], ans: ['f'], why: 'Es, a lo sumo, dos por la raíz de T por logaritmo de N: crece como la raíz de T.' },
    ], [['v', 'verdadero', COL.real], ['f', 'falso', COL.task]], { multi: false, text: true }),
  }], done, 'Práctica del capítulo   1 de 1') }],

  ['finish', 'Fin', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));
