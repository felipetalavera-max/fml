const aSYM = /([αβεγδηθφρσλμξχΦΨΓΠΛΩΣΔ‖ℜℝ√∑∏⟹⟺⟷≈∼∞⊤†∈∃∀→←↦′″⌊⌋½∇∝≫≪⟨⟩⋯≠π⊆])/;                        // símbolos que van siempre en la fuente matemática

/* aMATH:begin — cuentas del capítulo, sin dibujo (se prueban aparte con Node) */
const aSIG = ['a', 'b'];

// DFA parcial → completo (agrega un estado sumidero si falta alguna transición), para poder comparar con aDiff.

// A/π: autómata cociente. blk[q] = bloque del estado q. Estados = bloques, ordenados por su menor estado; mem = estados de cada bloque.

// ¿Reversible? (definición 16.7) A determinista y su reverso también: un solo estado final y, hacia cada estado, a lo sumo una transición por símbolo.
const aIsRev = A => A.fin.filter(v => v).length === 1 && A.d.every((_, q) => aSIG.every(c => A.d.filter(r => r[c] === q).length <= 1));

// { q1, q2, why: 'fin' | 'succ' | 'pred', c: símbolo, src: estado del bloque que originó el par, blk: partición después de fusionar, n: bloques que quedan }.

const aMem = (blk, q) => blk.map((v, i) => v === blk[q] ? i : -1).filter(i => i >= 0);

const aShort = A => { const qu = [[A.ini, '']], o = {}; for (let k = 0; k < qu.length; k++) { const [q, x] = qu[k]; if (o[q] == null) { o[q] = x; aSIG.forEach(c => qu.push([A.d[q][c], x + c])); } } return o; };

const aS2 = ['ab', 'b'], aRUN2 = aRev(aS2);

const aNRr = { ini: 2, inis: [2], fin: [true, false, false], lab: aNR.lab, ed: aNR.d.flatMap((r, q) => aSIG.filter(c => r[c] != null).map(c => [r[c], c, q])) };   // su reverso
const aQ2s = aRUN2.steps[1], aQ2r = aQ2s.q1 === 0 ? aQ2s.q2 : aQ2s.q1;                        // comprobación 2: el estado que se fusiona con el 0
const aTg = (A, q) => aGo(aL, A.us[q]);                                                       // estado del objetivo al que corresponde un prefijo
const aEps = u => u || 'ε', aPl = (n, s) => `${n} ${s}${n === 1 ? '' : 's'}`;
/* aMATH:end */

// Cadena como fila de casillas (la del cap. 13). s.lit(i, col, ta, tb) tiñe la casilla i desde ta y la devuelve a su color en tb.
const aStr = (p, str, x, y, { cw = 60, t0 = .4, fill = COL.chalk } = {}) => {
  const g = G(p, { o: t0 == null ? 1 : 0 }), s = { g, x, y, cw, n: str.length, end: x + str.length * cw }, size = cw * .62;
  s.c = [...str].map((ch, i) => [mk('rect', { x: x + i * cw + 2, y: y + 2, width: cw - 4, height: cw - 4, fill: 'none', stroke: fill === COL.chalk ? COL.faint : fill, 'stroke-width': 2 }, g), T(g, ch, { x: x + i * cw + cw / 2, y: y + cw / 2 + size * .3, size, fill, anchor: 'middle', font: MATH, weight: 600 })]);

// Autómata como grafo, con los estados en cualquier lugar (generaliza el aGraph del cap. 31). A = { ini, fin, d, lab } (DFA, puede ser parcial) o, para un
// autómata cualquiera, { inis, fin, lab, ed: [[origen, símbolo, destino]] }. pos = [[x, y], …]. Estado inicial = círculo grueso; final = círculo doble.

// up: los rótulos de las flechas van siempre del lado de arriba (árboles). Un rótulo de estado con «\n» sale en dos líneas.
// gr.of[estado + símbolo] y gr.ek['p>q'] = índice de la flecha · gr.hot tiñe una flecha · gr.mark tiñe el borde de un estado · gr.tint / gr.paint lo rellenan ·
// gr.run(ficha, x, …) lee una cadena desde el estado inicial (solo DFA).
const aGraph = (p, A, pos, { t0 = .4, tE = null, rad = 38, size = 26, col = COL.chalk, up = false, fs = null } = {}) => {
  const g = G(p, { o: t0 == null ? 1 : 0 }), ge = G(g, { o: tE == null ? 1 : 0 }), gs = G(g), gr = { g, ge, pos, A, rad, ring: [], inner: [], sg: [], ed: [], of: {}, dir: {}, ek: {} };
  const f = Q => Q.map(v => v.toFixed(1)).join(' '), inis = A.inis || [A.ini], w0 = id => inis.includes(id) ? 7 : 3, ext = rad * 2.3;

    aAt(() => put(tok, { x: pos[A.ini][0], y: pos[A.ini][1] }), ta - .15); show(tok, ta - .15, .15);

      const k = gr.of[q + c], t = ta + j * dt, e = gr.ed[k].pe, to = A.d[q][c], bk = gr.dir[q + c] < 0;
