<script>
'use strict';
const CHAPTER = { number: 8, title: 'Validación cruzada, regularización y pérdidas convexas', minutes: 6, language: 'es', next: '../ch09/' };

/* ---------- helpers de dibujo del capítulo (copiados del cap. 7) ---------- */
// rosa: muestra o pliegue de validación · violeta: término de complejidad · ámbar: lo elegido · amarillo, rosa y violeta: las tres pérdidas sustitutas
const HUE = { pos: COL.nat, neg: COL.whole, hyp: COL.task, val: COL.rat, pen: COL.real, hin: COL.int, exp: COL.rat, log: COL.real };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500, font = UI } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, font, o: 0 }); show(e, t0); return e; };
// Texto con subíndices y superíndices: 'R_{D}(h_{S})'. Con t0 = null queda visible desde el inicio.
const aTx = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500, font = MATH } = {}) => {
  const e = T(p, '', { x, y, size, fill, anchor, weight, font, o: t0 == null ? 1 : 0 });
  let prev = 0;
  str.split(/([_^]\{[^}]*\})/).forEach(s => {
    if (!s) return;
    const k = /^[_^]\{/.test(s) ? (s[0] === '_' ? 1 : -1) : 0, dy = k > 0 ? size * .22 : k < 0 ? -size * .38 : 0;
    // la α de la fuente de interfaz se confunde con una «a»: va siempre en la fuente matemática
    (k ? s.slice(2, -1) : s).split(/(α)/).filter(q => q).forEach((q, n) => { mk('tspan', { dy: n ? 0 : dy - prev, ...(k ? { 'font-size': size * .68 } : {}), ...(q === 'α' && font !== MATH ? { 'font-family': MATH } : {}) }, e).textContent = q; });
    prev = dy;
  });
  if (t0 != null) show(e, t0);
  return e;
};
const aRow = (p, parts, x, y, t0, opts = {}) => { const xs = [], els = parts.map(([str, fill]) => { xs.push(x); const e = aTx(p, str, x, y, t0, { ...opts, fill: fill || COL.chalk }); x += e.getComputedTextLength(); return e; }); els.xs = xs; els.end = x; return els; };
const aF3 = v => v.toFixed(3), aF2 = v => v.toFixed(2);
const aNote = (p, str) => aTx(p, str, 1570, 884, .4, { size: 22, fill: COL.dim, anchor: 'end', font: UI });
const aHue = v => v > 0 ? HUE.pos : HUE.neg;                                       // etiqueta +1 = salmón, etiqueta −1 = azul
const aSq = (p, x, y, fill, t0, o = .85) => { const e = put(mk('rect', { x, y: y - 18, width: 20, height: 20, fill, 'fill-opacity': o }, p), { o: 0 }); show(e, t0); return e; };
const aTitle = (p, str) => text(p, str, 100, 130, .3, { size: 30, fill: COL.task, weight: 600 });

/* aMATH:begin — cuentas del capítulo, sin dibujo (se prueban aparte con Node) */
const aRng = seed => () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const aSum = l => l.reduce((s, v) => s + v, 0);
const aR6 = v => Math.round(v * 1e6) / 1e6;
const aArg = l => l.indexOf(Math.min(...l));                                       // posición del mínimo (el primero si hay empate)
const aBinom = (n, q) => { const o = []; let lc = 0; for (let k = 0; k <= n; k++) { o.push(Math.exp(lc + k * Math.log(q) + (n - k) * Math.log(1 - q))); lc += Math.log(n - k) - Math.log(k + 1); } return o; };
// El ejemplo del cap. 7: x uniforme en [0, 1); la etiqueta más probable es 1 en dos tramos (en celdas de 1/32) y se invierte con probabilidad aNu.
const aC = 32, aPos = [[1, 8], [12, 22]], aNu = .1, aM = 100, aK = 8, aKs = Array.from({ length: aK }, (_, i) => i + 1);
const aBay = Array.from({ length: aC }, (_, i) => aPos.some(([a, b]) => i >= a && i < b) ? 1 : 0);     // clasificador de Bayes, celda por celda
const aBins = k => 2 ** (k - 1);                                                   // H_k: funciones constantes en 2^(k−1) tramos iguales (anidados)
const aDraw = (seed, m) => { const r = aRng(seed); return Array.from({ length: m }, () => { const x = r(), y = aBay[Math.floor(x * aC)]; return [x, r() < aNu ? 1 - y : y]; }); };
const aAt = (h, x) => h[Math.min(h.length - 1, Math.floor(x * h.length))];
const aRisk = h => { let s = 0; for (let c = 0; c < 128; c++) { const x = (c + .5) / 128; s += (aAt(h, x) === aAt(aBay, x) ? aNu : 1 - aNu) / 128; } return s; };   // error de generalización exacto
const aErm = (smp, k) => { const N = aBins(k), v = Array(N).fill(0); smp.forEach(([x, y]) => v[Math.floor(x * N)] += y ? 1 : -1); return v.map(t => t > 0 ? 1 : 0); };   // ERM en H_k: voto por mayoría en cada tramo
const aEmp = (smp, h) => smp.filter(([x, y]) => aAt(h, x) !== y).length / smp.length;
const aRad = (m, k) => { const N = aBins(k), pmf = N > 1 ? aBinom(m, 1 / N) : null; let s = 0, g = 0; for (let n = 1; n <= m; n++) { g = n === 1 ? 1 : n % 2 ? g * n / (n - 1) : g; s += pmf ? pmf[n] * g : 0; } return (pmf ? N * s : g) / m; };   // ℜ_m(H_k) exacta, x uniforme
const aLogT = (m, k) => Math.sqrt(Math.log(k) / m);
const aS = aDraw(3, aM);                                                           // la misma muestra del cap. 7, en el orden en que se extrajo
// §4.4 — una muestra de validación apartada: S1 = los primeros (1 − α)m puntos, S2 = los últimos αm.
const aAl = .2, aN1 = Math.round((1 - aAl) * aM), aS1 = aS.slice(0, aN1), aS2 = aS.slice(aN1);
const aHo = aKs.map(k => { const h = aErm(aS1, k); return { k, h, tr: aEmp(aS1, h), va: aEmp(aS2, h), R: aR6(aRisk(h)) }; });
const aKcv = aArg(aHo.map(o => o.va)) + 1, aKtr = aArg(aHo.map(o => o.tr)) + 1;    // el k que elige la validación y el que elegiría el error de entrenamiento
const aKsrm = aArg(aHo.map(o => o.tr + aRad(aN1, o.k) + aLogT(aN1, o.k))) + 1;     // SRM entrenado con S1
const aRhs = (al, m, k, d) => 2 * Math.sqrt(Math.log(k) / (al * m)) + 2 * Math.sqrt(Math.log(4 / d) / (2 * al * m));   // lado derecho del teorema 4.4
const aDl = .05, aMb = 1000, aKm = Math.max(aKcv, aKsrm);
const aQ = (() => { const s = aDraw(8, aM), s1 = s.slice(0, aN1), s2 = s.slice(aN1); return [3, 5, 8].map(k => { const h = aErm(s1, k); return { k, tr: aEmp(s1, h), va: aEmp(s2, h) }; }); })(), aQr = aArg(aQ.map(o => o.va));   // comprobación 1: otra muestra
// §4.5 — n pliegues: bloques consecutivos en el orden de extracción (la muestra es i.i.d., así que es una partición al azar).
const aFold = (smp, n) => Array.from({ length: n }, (_, i) => { const a = Math.round(i * smp.length / n), b = Math.round((i + 1) * smp.length / n); return [smp.filter((_, j) => j < a || j >= b), smp.slice(a, b)]; });
const aNf = 5, aF5 = aFold(aS, aNf);
const aCv = aKs.map(k => { const hs = aF5.map(([tr]) => aErm(tr, k)), es = hs.map((h, i) => aEmp(aF5[i][1], h)); return { k, hs, es, cv: aR6(aSum(es) / aNf) }; });
const aK0 = aArg(aCv.map(o => o.cv)) + 1, aR0 = aR6(aRisk(aErm(aS, aK0)));         // θ0 y el error de la hipótesis entrenada con toda la muestra
// §4.6 — regularización: H = constantes en 128 celdas, ℛ(h) = número de saltos de h. Mínimo exacto de R̂_S(h) + λℛ(h) por programación dinámica.
const aReg = (smp, lam) => {
  const N = 128, m = smp.length, c = Array.from({ length: N }, () => [0, 0]); smp.forEach(([x, y]) => c[Math.floor(x * N)][1 - y] += 1 / m);
  let d = [c[0][0], c[0][1]]; const bk = [];
  for (let i = 1; i < N; i++) { const n = [0, 0], b = [0, 0]; for (let v = 0; v < 2; v++) { const s = d[v], j = d[1 - v] + lam; b[v] = j < s - 1e-12 ? 1 - v : v; n[v] = Math.min(s, j) + c[i][v]; } bk.push(b); d = n; }
  let v = d[1] < d[0] - 1e-12 ? 1 : 0; const h = Array(N);
  for (let i = N - 1; i >= 0; i--) { h[i] = v; if (i) v = bk[i - 1][v]; }
  return h;
};
const aJ = h => h.filter((v, i) => i && v !== h[i - 1]).length;
const aLs = [0, .005, .01, .02, .05, .1, .3];
const aRg = aLs.map(l => { const h = aReg(aS, l), J = aJ(h), emp = aEmp(aS, h); return { l, h, J, emp, pen: l * J, R: aR6(aRisk(h)), cv: aR6(aSum(aF5.map(([tr, te]) => aEmp(te, aReg(tr, l)))) / aNf) }; });
const aLcv = aArg(aRg.map(o => o.cv));                                             // el λ que elige la validación cruzada de 5 pliegues
// §4.7 — pérdidas sustitutas Φ(u) y constantes (s, c) del teorema 4.7.
const aPhi = [['bisagra', u => Math.max(0, 1 + u), 1, .5, '1/2'], ['exponencial', u => Math.exp(u), 2, Math.SQRT1_2, '1/√2'], ['logística', u => Math.log2(1 + Math.exp(u)), 2, Math.SQRT1_2, '1/√2']];
const aBd = (c, s, e) => 2 * c * e ** (1 / s);                                      // 2c · (exceso de pérdida Φ)^(1/s)
/* aMATH:end */

// Hipótesis constante por tramos como franja de celdas de color.
const aStrip = (p, h, x, y, w, ht = 30) => { const g = G(p), cw = w / h.length; h.forEach((v, i) => mk('rect', { x: (x + i * cw).toFixed(2), y, width: (cw + .5).toFixed(2), height: ht, fill: aHue(v), 'fill-opacity': .82 }, g)); return g; };
// Barra vertical que crece desde la base.
const aUp = (p, x, base, w, h, t0, fill, o = .85) => { const e = mk('rect', { x, y: base, width: w, height: 0, fill, 'fill-opacity': o }, p); put(e, {}); tw(e, { a_y: base - h, a_height: h }, t0, .6, out); return e; };
const aTr = k => aBins(k) === 1 ? '1 tramo' : aBins(k) + ' tramos';
const aMs = n => String(n).replace(/\B(?=(\d{3})+$)/g, ' ');                       // 10000 → «10 000»
// La muestra como fila de puntos, en el orden de extracción; fx(j) da la x del punto j. Devuelve los puntos (se mueven con tw sobre x).
const aDots = (p, smp, fx, y, t0) => smp.map(([, v], j) => { const e = put(mk('circle', { r: 5, fill: aHue(v) }, p), { x: fx(j), y, o: 0 }); show(e, t0 + j * .006, .3); return e; });
// Posiciones de la fila partida en n bloques separados por un hueco.
const aXs = (n, gap, x0 = 110) => j => x0 + j * 13 + Math.floor(j * n / aM) * gap;
// Barra horizontal fina (subrayado de un bloque de la fila).
const aBar = (p, x1, x2, y, fill, t0, h = 7) => { const e = put(mk('rect', { x: x1, y, width: x2 - x1, height: h, fill }, p), { o: t0 == null ? 1 : 0 }); if (t0 != null) show(e, t0, .4); return e; };
// Cambia el contenido de un texto simple (creado con T o text) en el instante t.
const aSet = (e, str, t) => prog(() => { e.textContent = str; }, t, 0);
// Curva y = f(u) como trazo, recortada a f ≤ top.
const aCurve = (f, u0, u1, UX, UY, top) => { let d = ''; for (let i = 0, n = 240; i <= n; i++) { const u = u0 + (u1 - u0) * i / n, v = f(u); if (v <= top) d += (d ? 'L' : 'M') + UX(u).toFixed(1) + ' ' + UY(v).toFixed(1); } return d; };
const aStep = (u0, u1, UX, UY) => `M${UX(u0)} ${UY(1)}H${UX(0)}V${UY(0)}H${UX(u1)}`;     // la pérdida 0-1 como función de y·h(x)

/* ---------- beats: [id, título, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Inicio', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Unidad 1 · Capítulo 8', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Validación cruzada, regularización', { x: 800, y: 420, size: 64, weight: 600, anchor: 'middle' });
    T(g, 'y pérdidas convexas', { x: 800, y: 500, size: 48, weight: 600, anchor: 'middle', fill: COL.task });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'SRM suele ser intratable: las alternativas que se usan en la práctica.', 800, 620, m('sub'), { size: 32, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],

  ['cv', 'Apartar una muestra de validación', (m) => {
    const p = panel(0), ts = m('split'), te = m('erm'), tv = m('val'), tp = m('pick'), tr = m('real'), Y = 240, x0 = aXs(1, 0), BX = k => 190 + (k - 1) * 92, base = 790, sc = 520, RX = 1000;
    aNote(p, 'ejemplo del cap. 7: H_{k} = constantes en 2^{k−1} tramos · datos ilustrativos · errores calculados en la página');
    aTitle(p, 'Validación cruzada: apartar parte de la muestra para elegir k');
    const cap = text(p, `muestra S · m = ${aM} puntos, en el orden en que se extrajeron`, 110, 196, .4, { size: 22, fill: COL.dim });
    const ds = aDots(p, aS, x0, Y, .4);
    ds.forEach((e, j) => { if (j >= aN1) tw(e, { x: x0(j) + 50 }, ts, .8); });
    hide(cap, ts, .4);
    aBar(p, x0(0) - 8, x0(aN1 - 1) + 8, Y + 20, COL.chalk, ts + .7); aBar(p, x0(aN1) + 42, x0(aM - 1) + 58, Y + 20, HUE.val, ts + .7);
    aTx(p, `S_{1} · entrenamiento · (1 − α)m = ${aN1}`, 110, Y + 64, ts + 1, { size: 24, weight: 600, font: UI });
    aTx(p, `S_{2} · validación · αm = ${aM - aN1}`, x0(aM - 1) + 58, Y + 64, ts + 4, { size: 24, fill: HUE.val, weight: 600, font: UI, anchor: 'end' });
    // gráfico: por cada k, el error de la solución de ERM (entrenada con S1) en S1 y en S2
    const ax = G(p, { o: 0 });
    mk('path', { d: `M${BX(1) - 60} ${base - .6 * sc}V${base}H${BX(aK) + 60}`, fill: 'none', stroke: COL.dim, 'stroke-width': 2 }, ax);
    [0, .2, .4, .6].forEach(v => { T(ax, v ? v.toFixed(1) : '0', { x: BX(1) - 72, y: base - v * sc + 8, size: 22, fill: COL.dim, anchor: 'end', font: MATH }); mk('path', { d: `M${BX(1) - 66} ${base - v * sc}h6`, stroke: COL.dim, 'stroke-width': 2 }, ax); });
    T(ax, 'k', { x: BX(1) - 72, y: base + 34, size: 24, anchor: 'end', font: MATH });
    show(ax, te - .4);
    const kl = aHo.map(o => text(p, String(o.k), BX(o.k), base + 34, te - .4, { size: 24, anchor: 'middle', font: MATH }));
    aHo.forEach(o => {
      aUp(p, BX(o.k) - 30, base, 28, o.tr * sc, te + 2.6 + (o.k - 1) * .35, COL.chalk, .8);
      aUp(p, BX(o.k) + 2, base, 28, o.va * sc, tv + (o.k - 1) * .3, HUE.val, .9);
      text(p, aF2(o.va), BX(o.k) + 20, base - o.va * sc - 10, tv + .5 + (o.k - 1) * .3, { size: 22, fill: HUE.val, anchor: 'middle' });
    });
    aSq(p, RX, 430, COL.chalk, te, .8); aTx(p, 'error en S_{1} de la solución de ERM en H_{k}', RX + 32, 428, te, { size: 24, font: UI });
    aSq(p, RX, 472, HUE.val, tv, .9); aTx(p, 'error de la misma hipótesis en S_{2}', RX + 32, 470, tv, { size: 24, fill: HUE.val, font: UI });
    const top = base - Math.max(aHo[aKcv - 1].va, aHo[aKcv - 1].tr) * sc;
    show(put(mk('rect', { x: BX(aKcv) - 44, y: top - 44, width: 92, height: base - top + 52, fill: 'none', stroke: COL.task, 'stroke-width': 4 }, p), { o: 0 }), tp + 3.6, .4);
    tw(kl[aKcv - 1], { c_fill: COL.task }, tp + 3.6, .3);
    const f = G(p);
    aTx(f, 'h^{CV}_{S}  =  argmin R̂_{S₂}(h)', RX, 570, tp, { size: 34, weight: 600 }); text(f, '(4.7)', RX + 470, 568, tp, { size: 22, fill: COL.dim });
    aTx(f, 'h ∈ { h^{ERM}_{S₁,k} : k ≥ 1 }', RX + 130, 622, tp + .6, { size: 28 });
    hide(f, tr - .3, .3);
    aTx(p, `R(h^{CV}_{S}) = ${aF3(aHo[aKcv - 1].R)}`, RX, 570, tr, { size: 34, fill: COL.task, weight: 600 });
    aTx(p, `con k = ${aKcv}, el de menor error en S_{2}`, RX, 614, tr + .4, { size: 24, font: UI });
    aTx(p, `eligiendo por el error en S_{1}: k = ${aKtr}, R = ${aF3(aHo[aKtr - 1].R)}`, RX, 680, tr + 3, { size: 24, fill: COL.dim, font: UI });
  }],

  ['garantia', 'La garantía de la validación cruzada', (m) => {
    const p = panel(0), tf = m('fix'), tpr = m('prop'), tu = m('union'), tt = m('thm'), tsm = m('small'), tb = m('big'), ta = tt + 8, BX0 = 100, BW = 1000, BY = 440, cut = a => BX0 + (1 - a) * BW;
    aNote(p, `valores de la cota: ilustrativos, con m = ${aMs(aMb)}, max k = ${aKm} y δ = ${aDl}`);
    aTitle(p, 'La garantía de la validación cruzada');
    // la muestra como barra: S1 | S2, con el corte en (1 − α)m
    const r1 = put(mk('rect', { x: BX0, y: BY, width: cut(aAl) - BX0, height: 44, fill: COL.chalk, 'fill-opacity': .28 }, p), { o: 0 }), r2 = put(mk('rect', { x: cut(aAl), y: BY, width: BX0 + BW - cut(aAl), height: 44, fill: HUE.val, 'fill-opacity': .85 }, p), { o: 0 });
    show(r1, .3); show(r2, .3);
    aTx(p, 'S_{1} · entrenamiento', BX0 + 16, BY + 31, .4, { size: 24, font: UI, weight: 600 });
    aTx(p, 'S_{2} · validación', BX0 + BW + 24, BY + 14, .4, { size: 24, fill: HUE.val, font: UI, weight: 600 });
    const la = text(p, `α = ${aF2(aAl)}`, BX0 + BW + 24, BY + 48, .4, { size: 30, fill: HUE.val, weight: 700, font: MATH });
    // la idea de la proposición 4.3
    const gF = G(p);
    show(put(aStrip(gF, aHo[aKcv - 1].h, BX0, BY + 66, cut(aAl) - BX0, 26), { o: 0 }), tf, .6);
    aTx(gF, 'h^{ERM}_{S₁,k}: queda fija una vez vista S_{1}', BX0, BY + 134, tf + .6, { size: 26, font: UI });
    aTx(gF, 'S_{2} es independiente de ella: su error en S_{2} es un promedio de αm puntos nuevos (Hoeffding)', BX0, BY + 180, tf + 5, { size: 26, font: UI });
    hide(gF, tt, .4);
    const gP = G(p);
    text(gP, 'Proposición 4.3', 100, 204, tpr, { size: 26, fill: COL.task, weight: 600 }); aTx(gP, 'para todo α > 0 y todo m ≥ 1', 320, 204, tpr + .4, { size: 22, fill: COL.dim, font: UI });
    const f = aRow(gP, [['P[ sup_{k≥1} | R(h^{ERM}_{S₁,k}) − R̂_{S₂}(h^{ERM}_{S₁,k}) | > ε + '], ['√[ log k / αm ]'], [' ]  ≤  4 exp( −2αmε^{2} )']], 100, 262, tpr + .8, { size: 28 });
    tw(f[1], { c_fill: COL.task }, tu, .4);
    text(gP, 'el precio de mirar todos los k a la vez', f.xs[1] - 80, 304, tu + .6, { size: 22, fill: COL.task, weight: 600 });
    hide(gP, tt, .4);
    text(p, 'Teorema 4.4 · validación cruzada frente a SRM', 100, 204, tt + .5, { size: 26, fill: COL.task, weight: 600 }); text(p, 'con probabilidad ≥ 1 − δ', 720, 204, tt + .9, { size: 22, fill: COL.dim });
    aTx(p, 'R(h^{CV}_{S}) − R(h^{SRM}_{S₁})  ≤  2√[ log max( k(h^{CV}_{S}), k(h^{SRM}_{S₁}) ) / αm ]  +  2√[ log(4/δ) / 2αm ]', 100, 262, tt + 1, { size: 28 });
    aTx(p, 'h^{SRM}_{S₁}: SRM entrenado con S_{1}  ·  k(h): el menor índice de un conjunto que contiene a h', 100, 306, tt + 4, { size: 22, fill: COL.dim, font: UI });
    // el dial de α: se mueve el corte y cambian los puntos de entrenamiento y el lado derecho de la cota

  ['q2', 'Comprobación', () => {
    const p = panel(0), fs = [u => Math.max(0, -u), u => Math.max(0, 1 - u) ** 2, u => Math.min(1, Math.max(0, 1 - u))];
    T(p, 'Tres curvas sobre el escalón de la pérdida 0-1', { x: 100, y: 130, size: 30, fill: COL.task, weight: 600 });
    T(p, 'Eje horizontal: y · h(x). En blanco, el escalón; en ámbar, una candidata a pérdida sustituta.', { x: 100, y: 184, size: 26 });
    S.q2 = fs.map((fn, i) => {
      const x = 100 + i * 480, g = G(p), UX = u => x + 210 + u * 80, UY = v => 580 - v * 100;
      mk('rect', { x, y: 230, width: 420, height: 410, fill: 'none', stroke: COL.faint, 'stroke-width': 2 }, g);
      T(g, 'ABC'[i], { x: x + 24, y: 276, size: 32, weight: 700, fill: HUE.hyp });
      mk('path', { d: `M${UX(-2.4)} ${UY(0)}H${UX(2.4)}M${UX(0)} ${UY(0)}V${UY(3.1)}`, fill: 'none', stroke: COL.dim, 'stroke-width': 2 }, g);
      [-2, -1, 1, 2].forEach(u => { mk('path', { d: `M${UX(u)} ${UY(0)}v6`, stroke: COL.dim, 'stroke-width': 2 }, g); T(g, (u < 0 ? '−' : '') + Math.abs(u), { x: UX(u), y: UY(0) + 30, size: 22, fill: COL.dim, anchor: 'middle', font: MATH }); });
      T(g, '1', { x: UX(0) + 12, y: UY(1) - 10, size: 22, fill: COL.dim, font: MATH });
      mk('path', { d: aStep(-2.4, 2.4, UX, UY), fill: 'none', stroke: COL.chalk, 'stroke-width': 9, 'stroke-opacity': .9 }, g);
      mk('path', { d: aCurve(fn, -2.4, 2.4, UX, UY, 3.1), fill: 'none', stroke: HUE.hyp, 'stroke-width': 4, 'stroke-linejoin': 'round' }, g);
      return g;
    });
  }, { ask: done => quiz(BAND, [{
    id: 'c-sust', prompt: ['¿Qué curva es convexa y cubre al escalón por arriba?'],
    build: pickEls(S.q2.map((el, i) => ({ el, box: [100 + i * 480, 230, 420, 410], label: 'curva ' + 'ABC'[i] })), 1,
      'Es convexa y nunca baja del escalón: sirve como pérdida sustituta.',
      i => i ? 'Cubre el escalón, pero no es convexa: plana, diagonal y plana otra vez.' : 'Es convexa, pero entre −1 y 0 queda por debajo del escalón.'),
  }], done) }],

  ['teorema', 'Lo que garantiza la pérdida sustituta', (m) => {
    const p = panel(0), tlo = m('loss'), tu = m('upper'), tt = m('thm'), tb = m('bars'), tz = m('zero'), BX0 = 560, sc = 860, cols = [HUE.hin, HUE.exp, HUE.log];
    aNote(p, 's y c: valores de la p. 77 · el exceso de pérdida Φ que se recorre es ilustrativo');
    aTitle(p, 'Teorema 4.7 · lo que garantiza la pérdida sustituta');
    hide(text(p, '¿Minimizar la pérdida sustituta controla el error 0-1?', 100, 214, .5, { size: 28 }), tlo - .4, .3);
    const g0 = G(p);
    aTx(g0, 'L_{Φ}(h)  =  E_{(x,y)∼D} [ Φ( −y h(x) ) ]', 100, 214, tlo, { size: 34 }); text(g0, '(4.10) · pérdida esperada con Φ', 700, 212, tlo + .5, { size: 22, fill: COL.dim });
    aTx(g0, 'R(h)  ≤  L_{Φ}(h)', 100, 280, tu, { size: 34 }); text(g0, 'porque Φ cubre al escalón', 700, 278, tu + .5, { size: 22, fill: COL.dim });
    const gT = G(p);
    const f = aRow(gT, [['R(h) − R^{*}', COL.task], ['  ≤  2c [ ', COL.task], ['L_{Φ}(h) − L^{*}_{Φ}', COL.chalk], [' ]^{1/s}', COL.task]], 100, 390, tt, { size: 42, weight: 600 });
    text(gT, 'exceso de error', f.xs[0], 432, tt + 1.4, { size: 22, fill: COL.task, weight: 600 }); text(gT, 'exceso de pérdida Φ', f.xs[2], 432, tt + 5.4, { size: 22, weight: 600 });
    aTx(gT, 'R^{*}: error de Bayes · L^{*}_{Φ}: la menor pérdida Φ posible · vale si Φ cumple una condición con constantes s ≥ 1 y c > 0', 100, 478, tt + 3, { size: 22, fill: COL.dim, font: UI });
    hide(g0, tb - .3, .4); tw(gT, { y: -170 }, tb, .8);
    // las tres cotas, al encogerse el exceso de pérdida Φ
    const E0 = .5, E1 = .005, t1 = tb + 2.4, rows = [[400, 'exceso de pérdida Φ', COL.chalk, e => e], ...aPhi.map(([name, , s, c, cs], i) => [480 + i * 62, `${name} · s = ${s}, c = ${cs}`, cols[i], e => aBd(c, s, e)])];
    const live = rows.map(([y, lab, col, fn], i) => {
      const t = tb + .9 + i * .25;
      text(p, lab, 100, y, t, { size: 26, fill: col, weight: 600 });
      const b = put(mk('rect', { x: BX0, y: y - 22, width: 0, height: 28, fill: col, 'fill-opacity': .85 }, p), { o: 0 }), v = text(p, '', BX0, y, t, { size: 24, fill: col, weight: 600 }); show(b, t);
      return [b, v, fn, i ? 'cota: ' : ''];
    });
    const setE = e => live.forEach(([b, v, fn, pre]) => { const w = fn(e) * sc; b.setAttribute('width', w.toFixed(1)); v.setAttribute('x', (w + 14).toFixed(1)); v.textContent = pre + aF3(fn(e)); });
    setE(E0);
    prog(q => setE(E0 * (E1 / E0) ** q), t1, Math.max(6, tz + 4 - t1), lin);
    text(p, 'si el exceso de pérdida Φ tiende a 0, el exceso de error también', 100, 740, tz, { size: 28, fill: COL.task, weight: 600 });
  }],

  ['wrap', 'Resumen', (m) => {
    const p = panel(0);
    [['Validación cruzada: entrenar con S₁ y elegir con la parte apartada, S₂.', 'w1'], ['Con n pliegues, cada punto sirve para entrenar y para validar.', 'w2'],
      ['Regularización: error empírico más λ por un término de complejidad.', 'w3'], ['Una pérdida sustituta convexa cubre a la 0-1 y hace tratable el problema.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 240 + i * 130, o: 0 });
      mk('circle', { cx: 160, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 160, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 220, size: 31, weight: 600 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Práctica del capítulo', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-vf', prompt: ['Sobre este capítulo: ¿verdadero o falso?'],
    build: grid([
      { parts: ['La validación cruzada elige la solución de ERM con menor error en S₁, la parte de entrenamiento.'], ans: ['f'], why: 'Elige por el error en S₂, la parte apartada. El error en S₁ no sube al crecer k: premiaría al conjunto más rico.' },
      { parts: ['Con n = m pliegues (dejar uno fuera) hay que entrenar m veces.'], ans: ['v'], why: 'Cada vuelta aparta un solo punto y entrena con los otros m − 1.' },
      { parts: ['Con λ = 0, un algoritmo de regularización coincide con ERM.'], ans: ['v'], why: 'El término de regularización deja de pesar y solo queda el error empírico.' },
      { parts: ['La pérdida 0-1 se reemplaza por una sustituta porque es convexa.'], ans: ['f'], why: 'Al revés: no es convexa. Se reemplaza por una cota superior convexa, como la bisagra, la exponencial o la logística.' },
      { parts: ['Según el teorema 4.7, un exceso pequeño de pérdida sustituta asegura un exceso pequeño de error.'], ans: ['v'], why: 'R(h) − R* ≤ 2c [L_Φ(h) − L*_Φ]^(1/s), con las constantes s y c de cada pérdida.' },
    ], [['v', 'verdadero', COL.real], ['f', 'falso', COL.task]], { multi: false, text: true }),
  }], done, 'Práctica del capítulo   1 de 1') }],

  ['finish', 'Fin', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
