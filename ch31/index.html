<script>
'use strict';
const CHAPTER = { number: 31, title: 'Aprender autómatas con consultas', minutes: 6, language: 'es', next: '../ch32/' };

/* ---------- helpers de dibujo del capítulo (los genéricos, copiados del cap. 30; aStr y aGraph, adaptados del cap. 13) ---------- */
// Sin clases en este capítulo. Ámbar = estado o camino activo, y la hipótesis · verde/rojo = acepta/rechaza y respuesta sí/no del maestro ·
// rosa (local) = contraejemplo · violeta = cadenas distinguidoras del árbol · tiza = el objetivo y las cadenas de acceso.
const HUE = { act: COL.task, yes: COL.good, no: COL.bad, cex: COL.rat, dis: COL.real };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500, font = UI } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, font, o: 0 }); show(e, t0); return e; };
// Texto con subíndices y superíndices: 'x_{j}', 'a^{*}'. Con t0 = null queda visible desde el inicio. No anida llaves.
const aSYM = /([αβεγδηθφρσλμξχΦΨΓΠΛΩΣΔ‖ℜℝ√∑∏⟹⟺⟷≈∼∞⊤†∈∃∀→←↦′″⌊⌋½∇∝≫≪⟨⟩⋯≠])/;                          // símbolos que van siempre en la fuente matemática
const aFill = (e, str, size, font) => {
  e.replaceChildren();
  let prev = 0;
  str.split(/([_^]\{[^}]*\})/).forEach(s => {
    if (!s) return;
    const k = /^[_^]\{/.test(s) ? (s[0] === '_' ? 1 : -1) : 0, dy = k > 0 ? size * .22 : k < 0 ? -size * .38 : 0;
    (k ? s.slice(2, -1) : s).split(aSYM).filter(q => q).forEach((q, n) => { mk('tspan', { dy: n ? 0 : dy - prev, ...(k ? { 'font-size': size * .68 } : {}), ...(aSYM.test(q) && font !== MATH ? { 'font-family': MATH } : {}) }, e).textContent = q; });
    prev = dy;
  });
};
const aTx = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500, font = MATH } = {}) => {
  const e = T(p, '', { x, y, size, fill, anchor, weight, font, o: t0 == null ? 1 : 0 });
  aFill(e, str, size, font); e._set = s => aFill(e, s, size, font);
  if (t0 != null) show(e, t0);
  return e;
};
// Varias piezas de aTx en una línea: [texto, color, fuente, tamaño]; t0 puede ser una lista con un instante por pieza.
const aRow = (p, parts, x, y, t0, opts = {}) => { const xs = [], els = parts.map(([str, fill, font, size], k) => { xs.push(x); const e = aTx(p, str, x, y, Array.isArray(t0) ? t0[k] : t0, { ...opts, fill: fill || COL.chalk, ...(font ? { font } : {}), ...(size ? { size } : {}) }); x += e.getComputedTextLength(); return e; }); els.xs = xs; els.end = x; return els; };
const aNote = (p, str) => aTx(p, str, 1570, 884, .4, { size: 22, fill: COL.dim, anchor: 'end', font: UI });
const aTitle = (p, str) => text(p, str, 100, 130, .3, { size: 30, fill: COL.task, weight: 600 });
const aAt = (fn, t) => prog(() => fn(), t, 0);                                      // un cambio instantáneo en el instante t
const aHideAll = (els, t) => els.forEach(e => hide(e, t, .3));

/* aMATH:begin — cuentas del capítulo, sin dibujo (se prueban aparte con Node) */
const aSIG = ['a', 'b'];
// DFA completo: { ini, fin: [¿final?], d: [{ a: destino, b: destino }], lab: [rótulo de cada estado] }.
// Objetivo: el autómata A de la figura 16.5 del libro (4 estados; inicial 0; finales 1 y 3).
const aTgt = { ini: 0, fin: [false, true, false, true], d: [{ a: 0, b: 1 }, { a: 2, b: 0 }, { a: 3, b: 2 }, { a: 3, b: 2 }], lab: ['0', '1', '2', '3'] };
const aGo = (A, x, q = A.ini) => { for (const c of x) q = A.d[q][c]; return q; };            // A(x): estado al que llega x
const aTrail = (A, x) => { const o = [A.ini]; for (const c of x) o.push(A.d[o[o.length - 1]][c]); return o; };
const aAcc = (A, x) => A.fin[aGo(A, x)];
// La cadena más corta en la que difieren dos DFA completos (la primera en orden alfabético entre las más cortas), o null si son equivalentes:
// búsqueda en anchura sobre el autómata producto.
const aDiff = (A, B) => {
  const seen = new Set([A.ini + ',' + B.ini]), qu = [[A.ini, B.ini, '']];
  for (let k = 0; k < qu.length; k++) {
    const [p, q, x] = qu[k];
    if (A.fin[p] !== B.fin[q]) return x;
    for (const c of aSIG) { const p2 = A.d[p][c], q2 = B.d[q][c], key = p2 + ',' + q2; if (!seen.has(key)) { seen.add(key); qu.push([p2, q2, x + c]); } }
  }
  return null;
};
// ¿Es mínimo? Todos los estados accesibles y distinguibles dos a dos.
const aSub = (A, q) => ({ ...A, ini: q });
const aIsMin = A => { const reach = new Set([A.ini]), qu = [A.ini]; for (let k = 0; k < qu.length; k++) for (const c of aSIG) { const r = A.d[qu[k]][c]; if (!reach.has(r)) { reach.add(r); qu.push(r); } } return reach.size === A.d.length && A.d.every((_, p) => A.d.every((_, q) => p >= q || aDiff(aSub(A, p), aSub(A, q)) != null)); };
// El maestro: responde las consultas de pertenencia simulando el objetivo y las de equivalencia con aDiff. Lleva la cuenta:
// nm = cadenas distintas consultadas (el aprendiz anota las respuestas), raw = consultas contando repeticiones, ne = consultas de equivalencia.
const aTeacher = A => { const tch = { nm: 0, raw: 0, ne: 0, memo: {} }; tch.mq = x => { tch.raw++; if (!(x in tch.memo)) { tch.memo[x] = aAcc(A, x); tch.nm++; } return tch.memo[x]; }; tch.eq = H => { tch.ne++; return aDiff(A, H); }; return tch; };
// Árbol de clasificación: nodo interno { v, l, r } (v = cadena distinguidora; l = «no», r = «sí»); hoja { u } (u = cadena de acceso, o null para nil).
const aSift = (root, x, mq) => { let nd = root; const tr = []; while (nd.v != null) { const ans = mq(x + nd.v); tr.push([nd.v, ans]); nd = ans ? nd.r : nd.l; } return { u: nd.u, nd, tr }; };   // T(x)
const aLeaves = nd => nd.v != null ? [...aLeaves(nd.l), ...aLeaves(nd.r)] : [nd];
const aSnap = nd => nd.v != null ? { v: nd.v, l: aSnap(nd.l), r: aSnap(nd.r) } : { u: nd.u };
const aOrd = (p, q) => p.length - q.length || (p < q ? -1 : p > q ? 1 : 0);
const aLca = (root, u1, u2) => { let nd = root; for (;;) { const inL = aLeaves(nd.l).map(n => n.u), a1 = inL.includes(u1), a2 = inL.includes(u2); if (a1 !== a2) return nd; nd = a1 ? nd.l : nd.r; } };
// ConstructAutomaton(): un estado por hoja; final si la hoja está bajo la rama «sí» de la raíz; la transición de u con el símbolo c va a T(uc).
const aBuild = (root, mq) => {
  const us = aLeaves(root).map(n => n.u).filter(u => u != null).sort(aOrd), yes = aLeaves(root.r).map(n => n.u);
  return { ini: us.indexOf(''), us, lab: us.map(u => u || 'ε'), fin: us.map(u => yes.includes(u)), d: us.map(u => Object.fromEntries(aSIG.map(c => [c, us.indexOf(aSift(root, u + c, mq).u)]))) };
};
// QueryLearnAutomata() (figura 16.3). Devuelve un paso por consulta de equivalencia: el árbol y la hipótesis de ese momento, el contraejemplo x (null = «sí»),
// la tabla de prefijos de la línea 8 (prefijo, hoja del árbol, estado de la hipótesis), j, la hoja partida y los conteos antes (nm0) y después (nm1) de procesar x.
const aLearn = A => {
  const tch = aTeacher(A), mq = tch.mq, steps = [], t = mq('');
  let root = { v: '', l: { u: t ? null : '' }, r: { u: t ? '' : null } };
  let H = { ini: 0, us: [''], lab: ['ε'], fin: [t], d: [Object.fromEntries(aSIG.map(c => [c, 0]))] };
  for (;;) {
    const sp = { tree: aSnap(root), H, nm0: tch.nm, x: tch.eq(H), ne: tch.ne };
    steps.push(sp);
    if (sp.x == null) break;
    const x = sp.x, nil = aLeaves(root).find(n => n.u == null);
    if (nil) nil.u = x;
    else {
      sp.rows = [];
      for (let k = 1; k <= x.length && !sp.j; k++) { const pre = x.slice(0, k), tl = aSift(root, pre, mq).u, hl = H.us[aGo(H, pre)]; sp.rows.push([pre, tl, hl]); if (tl !== hl) sp.j = k; }
      const [, tl, hl] = sp.rows[sp.j - 1], pre = x.slice(0, sp.j - 1), old = H.us[aGo(H, pre)], nv = x[sp.j - 1] + aLca(root, tl, hl).v, leaf = aLeaves(root).find(n => n.u === old), side = mq(pre + nv);
      sp.split = { leaf: old, node: nv, add: pre, side, other: mq(old + nv) };
      delete leaf.u; leaf.v = nv; leaf.l = { u: side ? old : pre }; leaf.r = { u: side ? pre : old };

    sp.nm1 = tch.nm;
  }
  return { steps, tch, H };

const aRUN = aLearn(aTgt), aST = aRUN.steps;
// --- Datos de los beats (todo sale del objetivo y de la ejecución de arriba).
const aW1 = 'baa', aW2 = 'bab';                                                        // las dos cadenas del beat «aut»
const aQ1x = 'abaab', aQ1tr = aTrail(aTgt, aQ1x), aQ1r = aQ1tr[aQ1x.length];             // comprobación 1
// Muestra del libro para el escenario pasivo, S = ((a, +1), (b, −1)), y dos DFA parciales consistentes (sin transición = se rechaza).
const aS = [['a', true], ['b', false]];
const aP2 = { ini: 0, fin: [false, true], d: [{ a: 1 }, {}], lab: ['0', '1'] }, aP1 = { ini: 0, fin: [true], d: [{ a: 0 }], lab: ['0'] };
const aAccP = (A, x) => { let q = A.ini; for (const c of x) { q = A.d[q][c]; if (q == null) return false; } return A.fin[q]; };
const aM1 = 'ba', aM2 = 'b';                                                           // consultas de pertenencia del beat «qry»
const aMid = aST[2], aSx = 'aba', aSf = aSift(aMid.tree, aSx, x => aAcc(aTgt, x));         // árbol de tres hojas y cadena que se cierne en el beat «tree»
const aQ2x = 'abb', aQ2f = aSift(aMid.tree, aQ2x, x => aAcc(aTgt, x)), aQ2lv = aLeaves(aMid.tree).map(n => n.u), aQ2r = aQ2lv.indexOf(aQ2f.u);   // comprobación 2
const aSay = v => v ? 'sí' : 'no', aEps = u => u || 'ε';
/* aMATH:end */

// Cadena como fila de casillas (la del cap. 13). s.lit(i, col, ta, tb) tiñe la casilla i desde ta y la devuelve a su color en tb.
const aStr = (p, str, x, y, { cw = 60, t0 = .4, fill = COL.chalk } = {}) => {
  const g = G(p, { o: t0 == null ? 1 : 0 }), s = { g, x, y, cw, n: str.length, end: x + str.length * cw }, size = cw * .62;
  s.c = [...str].map((ch, i) => [mk('rect', { x: x + i * cw + 2, y: y + 2, width: cw - 4, height: cw - 4, fill: 'none', stroke: fill === COL.chalk ? COL.faint : fill, 'stroke-width': 2 }, g), T(g, ch, { x: x + i * cw + cw / 2, y: y + cw / 2 + size * .3, size, fill, anchor: 'middle', font: MATH, weight: 600 })]);
  if (t0 != null) show(g, t0);
  s.lit = (i, col, ta, tb) => { const [r, t] = s.c[i]; tw(r, { c_stroke: col }, ta, .15); tw(t, { c_fill: col }, ta, .15); if (tb != null) { tw(r, { c_stroke: COL.faint }, tb, .25); tw(t, { c_fill: fill }, tb, .25); } };
  return s;
};
// Autómata determinista como grafo (adaptado del aGraph del cap. 13). A = { ini, fin, d, lab }; pos = [[x, y], …], un lugar por estado, en fila.
// Estado inicial = círculo grueso; estado final = círculo doble. Las transiciones con el mismo origen y destino comparten flecha (rótulo «a, b»);
// si hay ida y vuelta entre dos estados, las dos flechas se curvan. col = color de los estados (tiza para el objetivo, ámbar para una hipótesis).
// gr.of[estado + símbolo] = índice de su flecha · gr.hot tiñe una flecha · gr.mark tiñe un estado · gr.run(ficha, x, …) lee una cadena desde el estado inicial.
const aGraph = (p, A, pos, { t0 = .4, tE = null, rad = 38, size = 26, col = COL.chalk } = {}) => {
  const g = G(p, { o: t0 == null ? 1 : 0 }), ge = G(g, { o: tE == null ? 1 : 0 }), gs = G(g), gr = { g, ge, pos, A, rad, ring: [], inner: [], sg: [], ed: [], of: {} };
  const f = Q => Q.map(v => v.toFixed(1)).join(' '), ext = rad * 2.3, w0 = id => id === A.ini ? 7 : 3;
  A.d.forEach((row, a) => {
    const by = {};
    aSIG.forEach(c => { if (row[c] != null) (by[row[c]] = by[row[c]] || []).push(c); });
    Object.keys(by).map(Number).sort((u, v) => u - v).forEach(b => {
      const [x1, y1] = pos[a], [x2, y2] = pos[b], eg = G(ge);
      let d, P2, C, lx, ly;
      if (a === b) {
        const th = -Math.PI / 2, pt = (ang, r) => [x1 + r * Math.cos(ang), y1 + r * Math.sin(ang)], C1 = pt(th - .75, rad + ext);
        C = pt(th + .75, rad + ext); P2 = pt(th + .5, rad + 13); d = `M${f(pt(th - .5, rad))}C${f(C1)} ${f(C)} ${f(P2)}`;
        lx = x1; ly = y1 - (.769 * rad + 1.4 + .549 * ext) - 10;
      } else {
        const L = Math.hypot(x2 - x1, y2 - y1), bd = aSIG.some(c => A.d[b][c] === a) ? -.2 * L : 0, off = (U, V, r) => { const l = Math.hypot(V[0] - U[0], V[1] - U[1]); return [U[0] + (V[0] - U[0]) * r / l, U[1] + (V[1] - U[1]) * r / l]; };
        C = [(x1 + x2) / 2 - (y2 - y1) / L * bd, (y1 + y2) / 2 + (x2 - x1) / L * bd]; P2 = off([x2, y2], C, rad + 13);
        const P0 = off([x1, y1], C, rad), my = (P0[1] + 2 * C[1] + P2[1]) / 4;
        d = `M${f(P0)}Q${f(C)} ${f(P2)}`; lx = (P0[0] + 2 * C[0] + P2[0]) / 4; ly = C[1] <= (y1 + y2) / 2 ? my - 12 : my + 12 + size * .72;
      }
      const ha = Math.atan2(P2[1] - C[1], P2[0] - C[0]), u = [Math.cos(ha), Math.sin(ha)];
      const pe = mk('path', { d, fill: 'none', stroke: COL.dim, 'stroke-width': 3, 'stroke-linecap': 'round' }, eg);
      const hd = mk('path', { d: `M${f([P2[0] + 12 * u[0], P2[1] + 12 * u[1]])}L${f([P2[0] - 4 * u[0] - 8 * u[1], P2[1] - 4 * u[1] + 8 * u[0]])}L${f([P2[0] - 4 * u[0] + 8 * u[1], P2[1] - 4 * u[1] - 8 * u[0]])}Z`, fill: COL.dim }, eg);
      T(eg, by[b].join(', '), { x: lx, y: ly, size, anchor: 'middle', font: MATH, weight: 600 });
      by[b].forEach(c => { gr.of[a + c] = gr.ed.length; });
      gr.ed.push({ g: eg, pe, hd, to: b });
    });
  });
  A.d.forEach((_, id) => {
    const [x, y] = pos[id], sg = G(gs), lab = A.lab[id], fs = lab.length > 2 ? 22 : lab.length > 1 ? 24 : rad < 30 ? 24 : 30;
    gr.ring[id] = mk('circle', { cx: x, cy: y, r: rad, fill: COL.board, stroke: col, 'stroke-width': w0(id) }, sg);
    gr.inner[id] = A.fin[id] ? mk('circle', { cx: x, cy: y, r: rad - 8, fill: 'none', stroke: col, 'stroke-width': 2.5 }, sg) : null;
    T(sg, lab, { x, y: y + fs * .34, size: fs, anchor: 'middle', font: MATH, weight: 600, fill: col });
    gr.sg[id] = sg;
  });
  if (t0 != null) show(g, t0);
  if (tE != null) show(ge, tE);
  gr.hot = (k, ta, tb, c = HUE.act) => { const { pe, hd } = gr.ed[k]; tw(pe, { c_stroke: c }, ta, .15); tw(hd, { c_fill: c }, ta, .15); if (tb != null) { tw(pe, { c_stroke: COL.dim }, tb, .3); tw(hd, { c_fill: COL.dim }, tb, .3); } };
  gr.mark = (id, c, ta, tb) => { const e = gr.ring[id]; tw(e, { c_stroke: c, 'a_stroke-width': w0(id) + 4 }, ta, .25, out); if (tb != null) tw(e, { c_stroke: col, 'a_stroke-width': w0(id) }, tb, .4); };
  gr.flash = (id, t, c = HUE.act) => gr.mark(id, c, t, t + .8);
  gr.tok = () => put(mk('circle', { r: Math.max(9, rad * .3), fill: HUE.act, stroke: COL.board, 'stroke-width': 3 }, g), { x: pos[A.ini][0], y: pos[A.ini][1], o: 0 });
  // La ficha lee x desde el estado inicial, un símbolo cada dt segundos; al terminar, el estado se tiñe de verde (final) o rojo (no final) hasta tb.
  gr.run = (tok, x, ta, dt, tb, str) => {
    aAt(() => put(tok, { x: pos[A.ini][0], y: pos[A.ini][1] }), ta - .15); show(tok, ta - .15, .15);
    let q = A.ini;
    [...x].forEach((c, j) => {
      const k = gr.of[q + c], t = ta + j * dt, e = gr.ed[k].pe, to = A.d[q][c];

    return q;
  };

};
// Árbol de clasificación. tree = { v, l, r } (nodo interno: círculo violeta con la cadena distinguidora; rama izquierda «no», derecha «sí») o { u } (hoja: recuadro
// con la cadena de acceso; nil si u es null). Cada nodo se nombra por su camino desde la raíz: '', 'l', 'r', 'lr'… · tv.leafId[u] = nombre de la hoja u ·
// tv.hot tiñe un nodo y la rama que llega a él · tv.tok / tv.go: ficha que baja por el árbol.
const aLH = 26, aLW = 46;
const aTree = (p, tree, cx, y0, { dx = 130, dy = 130, t0 = .4, rad = 30 } = {}) => {
  const g = G(p, { o: t0 == null ? 1 : 0 }), ge = G(g), gn = G(g), tv = { g, pos: {}, el: {}, ln: {}, shape: {}, leafId: {}, isLeaf: {} }, x0 = cx - (aLeaves(tree).length - 1) * dx / 2;
  let n = 0;
  const place = (nd, id, dep) => { const x = nd.v == null ? x0 + dx * n++ : (place(nd.l, id + 'l', dep + 1) + place(nd.r, id + 'r', dep + 1)) / 2; tv.pos[id] = [x, y0 + dep * dy]; return x; };
  place(tree, '', 0);
  const drawNd = (nd, id) => {
    const [x, y] = tv.pos[id], sg = G(gn), leaf = nd.v == null;
    tv.isLeaf[id] = leaf;
    if (leaf) {
      tv.shape[id] = mk('rect', { x: x - aLW, y: y - aLH, width: 2 * aLW, height: 2 * aLH, fill: COL.board, stroke: nd.u == null ? COL.faint : COL.chalk, 'stroke-width': 3 }, sg);
      T(sg, nd.u == null ? 'nil' : aEps(nd.u), { x, y: y + 9, size: 26, anchor: 'middle', font: MATH, weight: 600, fill: nd.u == null ? COL.dim : COL.chalk });
      tv.leafId[nd.u] = id;
    } else {
      tv.shape[id] = mk('circle', { cx: x, cy: y, r: rad, fill: COL.board, stroke: HUE.dis, 'stroke-width': 3 }, sg);
      T(sg, aEps(nd.v), { x, y: y + 9, size: 26, anchor: 'middle', font: MATH, weight: 600, fill: HUE.dis });
      [['l', 'no', HUE.no], ['r', 'sí', HUE.yes]].forEach(([s, lab, c]) => {
        const [x2, y2] = tv.pos[id + s], ex = x2, ey = y2 - (nd[s].v == null ? aLH : rad) - 3, l = Math.hypot(ex - x, ey - y), sx = x + (ex - x) * rad / l, sy = y + (ey - y) * rad / l;
        tv.ln[id + s] = mk('path', { d: `M${sx.toFixed(1)} ${sy.toFixed(1)}L${ex.toFixed(1)} ${ey.toFixed(1)}`, stroke: COL.dim, 'stroke-width': 3, 'stroke-linecap': 'round', fill: 'none' }, ge);
        T(ge, lab, { x: (sx + ex) / 2 + (s === 'l' ? -12 : 12), y: (sy + ey) / 2 + 2, size: 22, fill: c, anchor: s === 'l' ? 'end' : 'start', weight: 600 });
        drawNd(nd[s], id + s);
      });
    }
    tv.el[id] = sg;
  };
  drawNd(tree, '');
