<script>
'use strict';
const CHAPTER = { number: 14, title: 'AdaBoost', minutes: 7, language: 'es', next: '../ch15/' };

/* ---------- helpers de dibujo del capítulo (copiados del cap. 13) ---------- */
// salmón = +1, azul = −1 (puntos y lados de un umbral) · ámbar = clasificador elegido, su α y la frontera final · rojo = error empírico y puntos fallados ·
// verde = acierto · rosa (local) = la cota del teorema 7.2 · blanco = F, la pérdida exponencial media · gris = punto sin etiqueta y candidatos
const HUE = { pos: COL.nat, neg: COL.whole, hyp: COL.task, un: COL.dim, bnd: COL.rat };
const aHue = v => v > 0 ? HUE.pos : HUE.neg;
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500, font = UI } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, font, o: 0 }); show(e, t0); return e; };
// Texto con subíndices y superíndices: 'D_{t}(i)', 'e^{−α}'. Con t0 = null queda visible desde el inicio. e._set(str) lo reescribe. No anida llaves.
const aSYM = /([αεγδφ√∑∏⟹≈∼∞])/;                                                    // símbolos que van siempre en la fuente matemática
const aFill = (e, str, size, font) => {
  e.replaceChildren();
  let prev = 0;
  str.split(/([_^]\{[^}]*\})/).forEach(s => {
    if (!s) return;
    const k = /^[_^]\{/.test(s) ? (s[0] === '_' ? 1 : -1) : 0, dy = k > 0 ? size * .22 : k < 0 ? -size * .38 : 0;
    (k ? s.slice(2, -1) : s).split(aSYM).filter(q => q).forEach((q, n) => { mk('tspan', { dy: n ? 0 : dy - prev, ...(k ? { 'font-size': size * .68 } : {}), ...(aSYM.test(q) && font !== MATH ? { 'font-family': MATH } : {}) }, e).textContent = q; });
    prev = dy;
  });
};
const aTx = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500, font = MATH } = {}) => {
  const e = T(p, '', { x, y, size, fill, anchor, weight, font, o: t0 == null ? 1 : 0 });
  aFill(e, str, size, font); e._set = s => aFill(e, s, size, font);
  if (t0 != null) show(e, t0);
  return e;
};
// Varias piezas de aTx en una línea: [texto, color, fuente]; t0 puede ser una lista con un instante por pieza.
const aRow = (p, parts, x, y, t0, opts = {}) => { const xs = [], els = parts.map(([str, fill, font], k) => { xs.push(x); const e = aTx(p, str, x, y, Array.isArray(t0) ? t0[k] : t0, { ...opts, fill: fill || COL.chalk, ...(font ? { font } : {}) }); x += e.getComputedTextLength(); return e; }); els.xs = xs; els.end = x; return els; };
const aF2 = v => { const s = v.toFixed(2); return /^-0\.00$/.test(s) ? '0.00' : s.replace('-', '−'); };
const aSg = v => (v < 0 ? '−' : '+') + Math.abs(v).toFixed(2);                       // número con signo
const aTh = v => String(+v.toFixed(2));
const aNote = (p, str) => aTx(p, str, 1570, 884, .4, { size: 22, fill: COL.dim, anchor: 'end', font: UI });
const aTitle = (p, str) => text(p, str, 100, 130, .3, { size: 30, fill: COL.task, weight: 600 });
const aHalo = e => { [['stroke', COL.board], ['stroke-width', 7], ['paint-order', 'stroke'], ['stroke-linejoin', 'round']].forEach(([k, v]) => e.setAttribute(k, v)); return e; };   // borde del color de la pizarra: el texto se lee sobre líneas
const aAt = (fn, t) => prog(() => fn(), t, 0);                                      // un cambio instantáneo en el instante t
// Marca de acierto (✓ verde) o de error (✗ roja) junto a un punto.
const aMark = (g, x, y, ok, t0) => { const e = put(mk('path', { d: ok ? 'M-9 0L-3 8L10 -9' : 'M-9 -9L9 9M9 -9L-9 9', fill: 'none', stroke: ok ? COL.good : COL.bad, 'stroke-width': 5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g), { x, y, o: 0 }); show(e, t0, .25); return e; };
const aCurve = (f, u0, u1, UX, UY, n = 80) => { let d = ''; for (let k = 0; k <= n; k++) { const u = u0 + (u1 - u0) * k / n; d += (k ? 'L' : 'M') + UX(u).toFixed(1) + ' ' + UY(f(u)).toFixed(1); } return d; };
const aSq = (p, x, y, col, lab, { line = false, dash = null } = {}) => { mk(line ? 'path' : 'rect', line ? { d: `M${x} ${y - 8}h30`, stroke: col, 'stroke-width': 4, fill: 'none', ...(dash ? { 'stroke-dasharray': dash } : {}) } : { x: x + 6, y: y - 17, width: 18, height: 18, fill: col }, p); return aTx(p, lab, x + 42, y, null, { size: 22, fill: COL.dim, font: UI }); };   // entrada de leyenda

/* aMATH:begin — cuentas del capítulo, sin dibujo (se prueban aparte con Node) */
// --- La muestra: 10 puntos ilustrativos en un marco de 10 × 8, dispuestos al estilo de la figura 7.2. [x1, x2, etiqueta].
const aW = 10, aH = 8;
const aP = [[1.2, 6.8, 1], [1.4, 2.6, 1], [3.2, 4.4, 1], [4.6, 3.4, 1], [6.6, 4.2, 1], [5.2, 1.4, 1], [2.6, 6, -1], [4.2, 7, -1], [9.2, 2.8, -1], [8.6, 1.2, -1]];
const aM = aP.length;
// --- Stumps: umbral th sobre la coordenada c; s es la etiqueta del lado de valores menores que th. h(x) = s si x_c < th, y −s si no.
const aHx = (st, q) => q[st.c] < st.th ? st.s : -st.s;
// Los umbrales distintos de una coordenada: los bordes del marco y los puntos medios entre valores consecutivos (a lo sumo m + 1).
const aThr = (pts, c) => { const v = [...new Set(pts.map(q => q[c]))].sort((a, b) => a - b), th = [0]; for (let k = 1; k < v.length; k++) th.push((v[k - 1] + v[k]) / 2); th.push(c ? aH : aW); return th; };
const aAll = pts => [0, 1].flatMap(c => aThr(pts, c).flatMap(th => [1, -1].map(s => ({ c, th, s }))));
const aErrW = (st, pts, D) => pts.reduce((e, q, i) => e + (aHx(st, q) !== q[2] ? D[i] : 0), 0);   // error ponderado por D
// Búsqueda exhaustiva del stump de menor error ponderado (ante un empate, el primero de la lista).
const aBest = (pts, D) => aAll(pts).reduce((b, st) => { const e = aErrW(st, pts, D); return !b || e < b.e - 1e-12 ? { st, e } : b; }, null);
// --- AdaBoost (figura 7.1) con T rondas. Por ronda: h, eps, al, Z, D (antes), Dn (después), miss (índices que h falla),
// f (valores de f_t en la muestra), err (error empírico de sgn(f_t)), prodZ (∏ Z_s), bnd (cota de (7.3)) y F (pérdida exponencial media, (7.6)).
const aRun = (pts, T) => {
  const m = pts.length, R = [];
  let D = pts.map(() => 1 / m), f = pts.map(() => 0), prodZ = 1, sum = 0;
  for (let t = 0; t < T; t++) {
    const { st, e: eps } = aBest(pts, D), al = .5 * Math.log((1 - eps) / eps), Z = 2 * Math.sqrt(eps * (1 - eps));
    const Dn = pts.map((q, i) => D[i] * Math.exp(-al * q[2] * aHx(st, q)) / Z);
    f = pts.map((q, i) => f[i] + al * aHx(st, q)); prodZ *= Z; sum += (.5 - eps) ** 2;
    const nerr = pts.filter((q, i) => q[2] * f[i] <= 0).length;
    R.push({ h: st, eps, al, Z, D, Dn, miss: pts.map((q, i) => i).filter(i => aHx(st, pts[i]) !== pts[i][2]), f, nerr, err: nerr / m, prodZ, bnd: Math.exp(-2 * sum), F: pts.reduce((s, q, i) => s + Math.exp(-q[2] * f[i]), 0) / m });
    D = Dn;
  }
  return R;
};
const aT = 3, aTmax = 8, aR = aRun(aP, aTmax);                                       // rondas que se muestran paso a paso · rondas de la gráfica
const aFt = (T, q) => aR.slice(0, T).reduce((s, r) => s + r.al * aHx(r.h, q), 0);   // f_T en un punto cualquiera del plano
const aErrN = (st, pts) => pts.filter(q => aHx(st, q) !== q[2]).length;                // puntos que el stump falla, sin pesos
const aGam = .5 - Math.max(...aR.map(r => r.eps));                                  // la menor ventaja ½ − ε_t de las rondas mostradas
const aPrev = aErrW(aR[0].h, aP, aR[1].D);                                          // error de h_1 con los pesos D_2 (da ½)
// Regiones donde f_T es constante (las cortan los umbrales de las T primeras rondas), con su valor, y la frontera de sgn(f_T).
const aCuts = (T, c) => [0, ...[...new Set(aR.slice(0, T).filter(r => r.h.c === c).map(r => r.h.th))].sort((a, b) => a - b), c ? aH : aW];
const aCells = T => { const xs = aCuts(T, 0), ys = aCuts(T, 1), out = []; for (let i = 0; i + 1 < xs.length; i++) for (let j = 0; j + 1 < ys.length; j++) out.push({ x0: xs[i], x1: xs[i + 1], y0: ys[j], y1: ys[j + 1], v: aFt(T, [(xs[i] + xs[i + 1]) / 2, (ys[j] + ys[j + 1]) / 2]) }); return out; };
const aFront = T => {
  const xs = aCuts(T, 0), ys = aCuts(T, 1), sg = (x, y) => aFt(T, [x, y]) > 0, e = 1e-6, out = [];
  for (let i = 1; i + 1 < xs.length; i++) for (let j = 0; j + 1 < ys.length; j++) { const y = (ys[j] + ys[j + 1]) / 2; if (sg(xs[i] - e, y) !== sg(xs[i] + e, y)) out.push([xs[i], ys[j], xs[i], ys[j + 1]]); }
  for (let j = 1; j + 1 < ys.length; j++) for (let i = 0; i + 1 < xs.length; i++) { const x = (xs[i] + xs[i + 1]) / 2; if (sg(x, ys[j] - e) !== sg(x, ys[j] + e)) out.push([xs[i], ys[j], xs[i + 1], ys[j]]); }
  return out;
};
// Lugar para el rótulo de una región: el más alejado de los puntos de la muestra (los rótulos son anchos: la distancia horizontal cuenta menos).
const aSpot = c => { let b = null; for (let i = 1; i < 12; i++) for (let j = 1; j < 8; j++) { const x = c.x0 + (c.x1 - c.x0) * i / 12, y = c.y0 + (c.y1 - c.y0) * j / 8; if (x - c.x0 < .75 || c.x1 - x < .75 || y - c.y0 < .45 || c.y1 - y < .45) continue; const d = Math.min(...aP.map(q => Math.hypot((q[0] - x) * .55, q[1] - y))); if (!b || d > b.d + 1e-9) b = { x, y, d }; } return b || { x: (c.x0 + c.x1) / 2, y: (c.y0 + c.y1) / 2 }; };
const aVotes = (T, q) => aR.slice(0, T).map(r => aHx(r.h, q));                      // lo que vota cada clasificador en un punto
const aEx = [5, 2.6];                                                               // un punto de la región central (ejemplo del voto)
// Comprobación 1: tres puntos de la muestra; solo uno lo falla h_1. Comprobación 2: un punto nuevo.
const aQ1 = [0, 6, 8], aQ1r = aQ1.findIndex(i => aR[0].miss.includes(i));
const aQ2 = [8.4, 4.3], aQ2v = aVotes(aT, aQ2), aQ2f = aFt(aT, aQ2);
// Z como función del paso α en una ronda de error ε: φ(α) = (1 − ε) e^{−α} + ε e^{α} (p. 150); su mínimo está en α_t y vale Z_t.
const aPhiZ = (eps, a) => (1 - eps) * Math.exp(-a) + eps * Math.exp(a);
// Cuatro puntos en cruz (XOR, §7.2.3): ningún stump baja de error ½.
const aXor = [[2.5, 6, 1], [7.5, 2, 1], [7.5, 6, -1], [2.5, 2, -1]];
const aXorMin = aBest(aXor, aXor.map(() => 1 / aXor.length)).e;
/* aMATH:end */

// Plano de dos clases con un punto por elemento de la muestra; el área de cada punto es proporcional a su peso (escala s = √(m · D(i))).
// pl.bg = capa de regiones teñidas, pl.lg = capa de rectas y rótulos, pl.dg = puntos. pl.size(D, t) lleva los puntos a los pesos D.
const aPl = (p, ox, oy, sc, { t0 = .4, pts = aP, D = null, ax = false } = {}) => {
  const X = x => ox + x * sc, Y = y => oy - y * sc, g = G(p, { o: t0 == null ? 1 : 0 }), pl = { X, Y, sc, g, pts, r0: sc > 40 ? 15 : sc * .27 };
  pl.bg = G(g);
  mk('rect', { x: ox, y: oy - aH * sc, width: aW * sc, height: aH * sc, fill: 'none', stroke: COL.faint, 'stroke-width': 2 }, g);
  if (ax) { aTx(g, 'x_{1}', X(aW), Y(0) + 28, null, { size: 22, fill: COL.dim, anchor: 'end' }); aTx(g, 'x_{2}', X(0) - 12, Y(aH) + 20, null, { size: 22, fill: COL.dim, anchor: 'end' }); }
  pl.lg = G(g); pl.dg = G(g);
  const sz = (D, i) => Math.sqrt(D[i] * pts.length);
  pl.dots = pts.map((q, i) => put(mk('circle', { r: pl.r0, fill: aHue(q[2]), stroke: COL.board, 'stroke-width': 2 }, pl.dg), { x: X(q[0]), y: Y(q[1]), s: D ? sz(D, i) : 1 }));
  if (t0 != null) show(g, t0);
  pl.size = (D, t, dur = .9) => pl.dots.forEach((e, i) => tw(e, { s: sz(D, i) }, t, dur));
  return pl;
};
// Un stump sobre el plano: sus dos lados teñidos con el color de la etiqueta que dicen, y la recta ámbar. st.set(h) lo coloca.
const aSt = (pl, { o = 0, tint = .2, sw = pl.sc > 40 ? 5 : 3 } = {}) => {
  const g = G(pl.bg, { o }), a = mk('rect', { 'fill-opacity': tint }, g), b = mk('rect', { 'fill-opacity': tint }, g), lg = G(pl.lg, { o }), ln = mk('path', { stroke: HUE.hyp, 'stroke-width': sw, fill: 'none' }, lg);
  const R = (e, x0, y0, x1, y1, col) => { [['x', pl.X(x0)], ['y', pl.Y(y1)], ['width', (x1 - x0) * pl.sc], ['height', (y1 - y0) * pl.sc]].forEach(([k, v]) => e.setAttribute(k, v.toFixed(1))); e.setAttribute('fill', col); };
  return { g, lg, show: (t, dur = .5) => { show(g, t, dur); show(lg, t, dur); }, hide: (t, dur = .4) => { hide(g, t, dur); hide(lg, t, dur); },
    set: h => {
      if (h.c === 0) { R(a, 0, 0, h.th, aH, aHue(h.s)); R(b, h.th, 0, aW, aH, aHue(-h.s)); ln.setAttribute('d', `M${pl.X(h.th).toFixed(1)} ${pl.Y(0)}V${pl.Y(aH)}`); }
      else { R(a, 0, 0, aW, h.th, aHue(h.s)); R(b, 0, h.th, aW, aH, aHue(-h.s)); ln.setAttribute('d', `M${pl.X(0)} ${pl.Y(h.th).toFixed(1)}H${pl.X(aW)}`); }
    } };
};
// Las regiones de f_T sobre el plano: cada una teñida con el color de su signo (más intenso = |f| mayor) y rotulada con su valor; fr = frontera de sgn(f_T).
const aComb = (pl, T) => {
  const g = G(pl.bg, { o: 0 }), lab = G(pl.lg, { o: 0 }), cs = aCells(T);
  cs.forEach(c => { mk('rect', { x: pl.X(c.x0), y: pl.Y(c.y1), width: (c.x1 - c.x0) * pl.sc, height: (c.y1 - c.y0) * pl.sc, fill: aHue(c.v), 'fill-opacity': Math.min(.6, .1 + .2 * Math.abs(c.v)).toFixed(2) }, g); const s = aSpot(c); aHalo(aTx(lab, aSg(c.v), pl.X(s.x), pl.Y(s.y) + 8, null, { size: 24, weight: 600, anchor: 'middle' })); });
  const fr = path(pl.lg, aFront(T).map(([a, b, c, d]) => `M${pl.X(a)} ${pl.Y(b)}L${pl.X(c)} ${pl.Y(d)}`).join(''), { stroke: HUE.hyp, 'stroke-width': 7, 'stroke-linecap': 'round' }, { d: 0 });
  return { g, lab, fr, cs };
};
const aBox = (pl, c, sw) => put(mk('rect', { x: pl.X(c.x0) + sw / 2, y: pl.Y(c.y1) + sw / 2, width: (c.x1 - c.x0) * pl.sc - sw, height: (c.y1 - c.y0) * pl.sc - sw, fill: 'none', stroke: COL.chalk, 'stroke-width': sw }, pl.lg), { o: 0 });   // recuadro de una región
// Gráfica por rondas: eje horizontal t = 0…T, eje vertical de 0 a 1. ch.bar = barra que crece; ch.line = línea por los valores (vals[0] en t = 0).
const aChart = (p, x0, y0, w, h, { t0 = .4, n = aTmax } = {}) => {
  const st = w / (n + .6), ch = { CX: t => x0 + t * st, VY: v => y0 - v * h, st, g: G(p, { o: 0 }) };
  mk('path', { d: `M${x0 - 22} ${y0 - h - 14}V${y0}H${x0 + w}`, stroke: COL.faint, 'stroke-width': 2, fill: 'none' }, ch.g);
  [0, .5, 1].forEach(v => { mk('path', { d: `M${x0 - 30} ${ch.VY(v)}h8`, stroke: COL.faint, 'stroke-width': 2 }, ch.g); T(ch.g, String(v), { x: x0 - 38, y: ch.VY(v) + 8, size: 22, fill: COL.dim, anchor: 'end', font: MATH }); });
  for (let t = 1; t <= n; t++) T(ch.g, String(t), { x: ch.CX(t), y: y0 + 32, size: 22, fill: COL.dim, anchor: 'middle', font: MATH });
  T(ch.g, 'ronda', { x: x0 + w + 8, y: y0 + 32, size: 22, fill: COL.dim });
  show(ch.g, t0);
  ch.bar = (t, v, col, tt) => { const bw = st * .46, e = mk('rect', { x: ch.CX(t) - bw / 2, y: y0, width: bw, height: 0, fill: col }, p); tw(e, { a_y: ch.VY(Math.max(v, .008)), a_height: Math.max(v, .008) * h }, tt, .45, out); return e; };
  ch.line = (vals, col, tt, dur, { dash = null, sw = 4, dots = true } = {}) => {
    const d = vals.map((v, t) => (t ? 'L' : 'M') + ch.CX(t).toFixed(1) + ' ' + ch.VY(v).toFixed(1)).join('');
    if (dash) show(put(mk('path', { d, fill: 'none', stroke: col, 'stroke-width': sw, 'stroke-dasharray': dash }, p), { o: 0 }), tt, dur);
    else draw(path(p, d, { stroke: col, 'stroke-width': sw, 'stroke-linejoin': 'round' }, { d: 0 }), tt, dur);
    if (dots) vals.forEach((v, t) => show(put(mk('circle', { cx: ch.CX(t), cy: ch.VY(v), r: 6, fill: col }, p), { o: 0 }), tt + dur * t / vals.length, .2));
  };
  return ch;
};
const aMain = (p, o = {}) => aPl(p, 100, 686, 62, { ax: true, ...o });
const NOTE = 'muestra ilustrativa, al estilo de la figura 7.2 · salmón = +1, azul = −1 · área del punto = su peso · todo se calcula en la página';
const aDesc = h => [[h.s > 0 ? '+1' : '−1', aHue(h.s)], ['  si  ', COL.dim, UI], [`x_{${h.c + 1}} < ${aTh(h.th)}`]];   // un stump en palabras

/* ---------- beats: [id, título, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Inicio', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Unidad 2 · Capítulo 14', { x: 800, y: 350, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'AdaBoost', { x: 800, y: 450, size: 72, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'Muchos clasificadores mediocres, combinados ronda a ronda, dan uno preciso.', 800, 580, m('sub'), { size: 32, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],

  ['debil', 'Aprendices débiles', (m) => {
    const p = panel(0), ts = m('stump'), tsw = m('sweep'), tb = m('best'), twk = m('weak'), tq = m('q'), RX = 800, AX = e => 840 + e * 560, AY = 440, h1 = aR[0].h, GS = .1;
    aNote(p, NOTE + ' · γ dibujado como ejemplo');
    aTitle(p, 'Un clasificador mediocre: un umbral');
    const pl = aMain(p), st = aSt(pl);
    st.show(ts, .4);
    aRow(p, [['clasificador base:  ', COL.dim, UI], ['umbral sobre una coordenada (stump)', COL.chalk, UI]], RX, 236, ts, { size: 28 });
    const ro = aTx(p, '', RX, 310, ts + 3.4, { size: 30, weight: 600, font: UI });
    // eje del error, con un marcador que sigue al umbral
    const ax = G(p, { o: 0 }); show(ax, ts + 3.4);
    mk('path', { d: `M${AX(0)} ${AY}H${AX(1)}` + [0, .5, 1].map(v => `M${AX(v)} ${AY - 10}v20`).join(''), stroke: COL.faint, 'stroke-width': 2, fill: 'none' }, ax);
    [[0, '0'], [.5, '½'], [1, '1']].forEach(([v, s]) => T(ax, s, { x: AX(v), y: AY + 42, size: 24, fill: COL.dim, anchor: 'middle', font: MATH }));

    mk('path', { d: `M${PXa(0)} ${PYz(1)}H${PXa(1.7)}`, stroke: COL.faint, 'stroke-width': 2, 'stroke-dasharray': '6 8', fill: 'none' }, ax);
    [.6, .8, 1, 1.2].forEach(z => T(ax, z.toFixed(1), { x: PXa(0) - 12, y: PYz(z) + 8, size: 22, fill: COL.dim, anchor: 'end', font: MATH }));
    [0, .5, 1, 1.5].forEach(a => T(ax, String(a), { x: PXa(a), y: PYz(.6) + 30, size: 22, fill: COL.dim, anchor: 'middle', font: MATH }));
    aTx(ax, 'α', PXa(1.7) + 12, PYz(.6) + 8, null, { size: 26, fill: COL.dim });
    aTx(ax, 'Z_{t}(α)  =  (1 − ε_{t}) e^{−α} + ε_{t} e^{α}', RX, 336, null, { size: 28, weight: 600 });
    const cur = mk('path', { fill: 'none', stroke: COL.chalk, 'stroke-width': 4 }, ax), drop = mk('path', { fill: 'none', stroke: HUE.hyp, 'stroke-width': 2, 'stroke-dasharray': '5 6' }, ax);
    const dot = put(mk('circle', { r: 11, fill: HUE.hyp, stroke: COL.board, 'stroke-width': 3 }, p), { x: PXa(0), y: PYz(1), o: 0 }); show(dot, tph + .3, .3);
    const ro = aTx(p, '', RX, 738, tph + .3, { size: 28, weight: 600 });
    let last = -1;
    const setR = (t, q) => {
      const r = aR[t], a = r.al * q, z = aPhiZ(r.eps, a);
      if (t !== last) { last = t; cur.setAttribute('d', aCurve(u => aPhiZ(r.eps, u), 0, 1.62, PXa, PYz)); }
      put(dot, { x: PXa(a), y: PYz(z) }); drop.setAttribute('d', q > .98 ? `M${PXa(a).toFixed(1)} ${PYz(z).toFixed(1)}V${PYz(.6)}` : '');
      ro._set(`ronda ${t + 1}:    ε_{${t + 1}} = ${aF2(r.eps)}      α = ${aF2(a)}      Z = ${aF2(z)}`);
    };
    setR(0, 0);
    show(ring, tph, .3);
    const step = (t, t0, dur) => { prog(q => setR(t, q), t0, dur); tw(ring, { x: ch.CX(t + 1), y: ch.VY(aR[t].F) }, t0 + dur * .5, dur * .6); };
    step(0, tm + .4, 1.6);
    aTx(p, 'ε_{t} < ½    ⟹    Z_{t}  =  2 √( ε_{t}(1 − ε_{t}) )  <  1', RX, 786, tls, { size: 28, weight: 600 });
    const dt = (tc - tls - 3.4) / (aTmax - 1);
    for (let t = 1; t < aTmax; t++) step(t, tls + 3 + (t - 1) * dt, dt * .85);
    aRow(p, [['descenso por coordenadas sobre F:   ', HUE.hyp, UI], ['dirección = un clasificador base h_{t}', COL.chalk, UI], ['    ·    paso = α_{t}', COL.chalk, UI]], 100, 840, [tc, tc + 4, tc + 8], { size: 26, weight: 600 });
  }],

  ['uso', 'En la práctica', (m) => {
    const p = panel(0), tt = m('thr'), tal = m('all'), tco = m('cost'), tT = m('t'), tx = m('xor'), RX = 800, th = [0, 1].map(c => aThr(aP, c));
    aNote(p, NOTE);
    aTitle(p, 'En la práctica: boosting con umbrales (stumps)');
    const pl = aMain(p);
    // todos los umbrales candidatos
    const ln = [0, 1].map(c => th[c].map((v, k) => { const e = put(mk('path', { d: c ? `M${pl.X(0)} ${pl.Y(v)}H${pl.X(aW)}` : `M${pl.X(v)} ${pl.Y(0)}V${pl.Y(aH)}`, stroke: COL.dim, 'stroke-width': 2.5, fill: 'none' }, pl.lg), { o: 0 }); tw(e, { o: .8 }, (c ? tal : tt) + .4 + k * .12, .3); return e; }));
    const all = ln.flat(), dd = Math.min(.16, (tco - tal - 2.6) / all.length);
    all.forEach((e, k) => { tw(e, { c_stroke: HUE.hyp, 'a_stroke-width': 5 }, tal + 2 + k * dd, .08); tw(e, { c_stroke: COL.dim, 'a_stroke-width': 2.5 }, tal + 2 + (k + 1) * dd, .2); });
    aRow(p, [['por coordenada:   ', COL.dim, UI], [`a lo sumo m + 1 = ${th[0].length} umbrales distintos`, COL.chalk, UI]], RX, 240, tt, { size: 28, weight: 600 });
    aRow(p, [['con N = 2 coordenadas:   ', COL.dim, UI], [`${th[0].length} + ${th[1].length} = ${all.length} umbrales por ronda`, COL.chalk, UI]], RX, 300, tal, { size: 28, weight: 600 });
    aRow(p, [['costo con T rondas:   ', COL.dim, UI], ['O( mN log m + mNT )', HUE.hyp]], RX, 390, tco, { size: 32, weight: 600 });
    aRow(p, [['T,  el número de rondas:   ', COL.chalk, UI], ['el parámetro del algoritmo', HUE.hyp, UI]], RX, 530, tT, { size: 28, weight: 600 });
    // cuatro puntos en cruz
    const px = aPl(p, 800, 840, 22, { t0: tx, pts: aXor }), sx = aSt(px), XR = 1060;
    px.dots.forEach(e => put(e, { s: 1.6 }));
    const ro = aTx(p, '', XR, 740, tx + 2, { size: 28, weight: 600, font: UI });
    const setX = s => { sx.set(s); ro._set(`error de este umbral:   ${aF2(aErrN(s, aXor) / aXor.length)}`); };
    setX({ c: 0, th: .5, s: 1 }); sx.show(tx + 2, .3);
    aTx(p, 'cuatro puntos en cruz (XOR):', XR, 690, tx + .4, { size: 26, fill: COL.dim, font: UI });
    prog(q => setX({ c: 0, th: .5 + 9 * q, s: 1 }), tx + 2.4, 2.4, lin);
    prog(q => setX({ c: 1, th: .5 + 7 * q, s: 1 }), tx + 4.8, 2.4, lin);
    aTx(p, `ningún umbral baja de ${aF2(aXorMin)}`, XR, 800, tx + 5.6, { size: 26, weight: 600, font: UI, fill: COL.bad });
  }],

  ['wrap', 'Resumen', (m) => {
    const p = panel(0);
    [['Boosting: combinar clasificadores base, apenas mejores que el azar, en uno preciso.', 'w1'], ['Cada ronda elige el de menor error ponderado y sube el peso de los puntos que falla.', 'w2'],
      ['Hipótesis final: sgn( ∑_{t} α_{t} h_{t} ),  con  α_{t} = ½ log( (1 − ε_{t}) / ε_{t} ).', 'w3'], ['Error empírico ≤ exp( −2 ∑_{t} (½ − ε_{t})^{2} ):  baja exponencialmente con las rondas.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 240 + i * 130, o: 0 });
      mk('circle', { cx: 160, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 160, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      aTx(g, str, 220, 0, null, { size: 31, weight: 600, font: UI });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Práctica del capítulo', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-vf', prompt: ['Sobre este capítulo: ¿verdadero o falso?'],
    build: grid([
      { parts: ['A un aprendiz débil se le exige un error cercano a cero.'], ans: ['f'], why: 'Solo un error menor que un medio por algún margen gama: algo mejor que el azar.' },
      { parts: ['Tras cada ronda, los puntos que el clasificador elegido falla pasan a pesar más.'], ans: ['v'], why: 'Su peso se multiplica por e a la alfa; el de los acertados, por e a la menos alfa.' },
      { parts: ['Un clasificador base con menor error ponderado recibe un peso alfa menor.'], ans: ['f'], why: 'Al revés: alfa crece cuando el error baja. Los más precisos pesan más en el voto.' },
      { parts: ['El error empírico de la combinación baja en todas las rondas.'], ans: ['f'], why: 'En el ejemplo sube en la ronda 2. Lo que baja en cada ronda es la cota, el producto de los Z.' },
      { parts: ['Cada ronda es un paso de descenso por coordenadas sobre la pérdida exponencial.'], ans: ['v'], why: 'La dirección es un clasificador base y el paso es alfa, el valor que hace mínimo a Z.' },
    ], [['v', 'verdadero', COL.real], ['f', 'falso', COL.task]], { multi: false, text: true }),
  }], done, 'Práctica del capítulo   1 de 1') }],

  ['finish', 'Fin', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
