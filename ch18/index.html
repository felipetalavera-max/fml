  ['prueba', 'La prueba, con un algoritmo sin regret', (m) => {
    const p = panel(0), tg = m('alg'), tb = m('br'), tr = m('run'), tu = m('up'), tlo = m('low'), ts = m('sq'), tn = m('num'), RX = 840, PL = 130, QH = 80, BR = 250, QY = 440;

    const setG = r => {

      pb.forEach((b, i) => { const v = (q.p[i] + (nx.p[i] - q.p[i]) * u) * PL; b.setAttribute('x', (BR - v).toFixed(1)); b.setAttribute('width', v.toFixed(1)); });
      pa.forEach((b, i) => { const v = (a ? a.pbar[i] : 0) * PL; b.setAttribute('x', (BR - v).toFixed(1)); b.setAttribute('width', v.toFixed(1)); put(b, { o: a ? 1 : 0 }); });
      qb.forEach((b, j) => b.setAttribute('height', ((a ? a.qbar[j] : 0) * QH).toFixed(1)));

      la(n); lb(n);
      info._set(`ronda ${k + 1} de ${aGT}:    p_{t} = (${q.p.map(aF2).join(', ')}),    responde la columna ${q.j + 1}`);

    };
    setG(0);
    prog(q => setG(q), tb + .4, 2.6, lin);                         // ronda 1: la columna responde y los pesos cambian
    prog(q => setG(1 + 9 * q), tr, tu - tr - .4, lin);
    prog(q => setG(10 + (aGT - 10) * q), tu, ts - tu, lin);
    aTx(p, 'fila: pesos exponenciales (sin regret), p_{t}', 100, 586, tg + 4, { size: 24, font: UI, weight: 600, fill: HUE.hyp });

    aHalo(aTx(p, 'pérdida promedio del algoritmo', ch.CX(30), ch.VY(.62), tu, { size: 22, fill: HUE.hyp, font: UI, weight: 600 }));
    aHalo(aTx(p, 'lo mejor contra la columna promedio', ch.CX(30), ch.VY(.31), tlo, { size: 22, font: UI, weight: 600 }));
    aHalo(aTx(p, `valor del juego: ${aNum(aVal)}`, ch.CX(aGT), ch.VY(aVal) + 48, ts, { size: 22, fill: COL.dim, font: UI, weight: 600, anchor: 'end' }));

    aTx(p, aF2(aHend.low), ch.CX(aGT) + 14, ch.VY(aHend.low) + 24, tn + 2, { size: 24, weight: 700 });
    aRow(p, [['min_{p} max_{q} p^{⊤}Mq'], ['   ≤   '], ['(1/T) ∑_{t} p_{t}^{⊤}Mq_{t}', HUE.hyp]], RX, 590, tu + 1, { size: 28, weight: 600 });
    aRow(p, [['(1/T) ∑_{t} p_{t}^{⊤}Mq_{t}', HUE.hyp], ['   ≤   '], ['max_{q} min_{p} p^{⊤}Mq'], ['  +  R_{T}/T', HUE.cx]], RX, 656, [tlo + 1, tlo + 1, tlo + 9, tlo + 3], { size: 28, weight: 600 });

  ['wrap', 'Resumen', (m) => {

    ], [['v', 'verdadero', COL.real], ['f', 'falso', COL.task]], { multi: false, text: true }),
  }], done, 'Práctica del capítulo   1 de 1') }],

  ['finish', 'Fin', () => { panel(0); }, { ask: finishCard }],
