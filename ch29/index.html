/* aMATH:begin — cuentas del capítulo, sin dibujo (se prueban aparte con Node) */

let aClipN = 0;

const aPl = (p, cx, cy, half, view, { t0 = .4, axes = true } = {}) => {

    const l2 = aRow(g2, [['√λ v_{i}'], ['        solo con K', COL.dim, UI, 22]], SX0, SY2 - 30, null, { size: 26, weight: 700 });
    aP.Y.forEach(y => mk('circle', { cx: SX(y[0]).toFixed(1), cy: SY1, r: 6, fill: HUE.hyp }, g1));
    aYk.forEach(v => mk('circle', { cx: SX(v).toFixed(1), cy: SY2, r: 12, fill: 'none', stroke: HUE.pt, 'stroke-width': 3 }, gr));
    tw(gr, { y: SY1 - SY2 }, tsm + .4, 1.4); l2.forEach(e => hide(e, tsm + .2, .3));
    const gA = G(p); hide(gA, tp - .6, .4);
    aRow(gA, [['X = (Φ(x_{1}), …, Φ(x_{m}))'], ['        en el espacio de características', COL.dim, UI, 22]], RX, 240, .5, { size: 30, weight: 700 });
    aRow(gA, [['K = X^{⊤}X'], [':    la matriz de kernel,    ', COL.chalk, UI, 26], ['K_{ij} = K(x_{i}, x_{j})']], RX, 312, tk, { size: 30, weight: 700 });
    aRow(gA, [['C = (1/m) U Λ U^{⊤}            K = V Λ V^{⊤}'], ['        (15.3)', COL.dim, UI, 22]], RX, 408, tsv, { size: 30, weight: 700 });
    aRow(p, [['x^{⊤}u   =   k_{x}^{⊤} v / √λ'], ['        (15.4)', COL.dim, UI, 22]], RX, 240, tp, { size: 34, weight: 700 });
    aTx(p, 'k_{x} = (K(x_{1}, x), …, K(x_{m}, x))^{⊤}:   solo valores del kernel', RX, 286, tp + 2.5, { size: 22, fill: COL.dim });
    aRow(p, [['x_{i}^{⊤}u   =   √λ v_{i}'], ['        (15.5) · si x es el punto i de la muestra', COL.dim, UI, 22]], RX, 388, tpt, { size: 34, weight: 700 });
    aRow(p, [['u   =   X v / √λ', HUE.hyp], ['        v:  vector propio de K, de valor λ', COL.dim, MATH, 22]], RX, 520, tu, { size: 36, weight: 700 });
    aTx(p, 'u:  vector singular de C, de valor λ/m', RX, 564, tu + 4, { size: 22, fill: COL.dim });
    aTx(p, 'con el kernel lineal:  las mismas coordenadas que PCA', RX, 680, tsm, { size: 26, fill: HUE.hyp, font: UI, weight: 600 });
    aTx(p, 'con otro kernel PDS:  la misma cuenta, con su matriz de kernel', RX, 740, tsm + 2.6, { size: 26, font: UI, weight: 600 });
  }],

  ['rings', 'Dos anillos', (m) => {
    const p = panel(0), tl = m('lin'), tl1 = m('lin1'), tk = m('ker'), tk1 = m('ker1'), CXs = [290, 800, 1310], CY = 400, HF = 180, SY = 700;
    aNote(p, `m = ${aRg.length}, con semilla · color: solo para seguir los anillos (no hay etiquetas) · gaussiano de ancho ${aKw} · K centrada: (I − 11^{⊤}/m) K (I − 11^{⊤}/m)`);
    aTitle(p, 'Kernel PCA con kernel gaussiano: dos anillos');
    const cols = aRg.map(x => x[2] > 0 ? HUE.pos : HUE.neg), vK = 1.18 * Math.max(...aRgY.flat().map(Math.abs)), ts = [.4, tl - .3, tk - .3];
    const pls = [3, 3, vK].map((v, k) => aPl(p, CXs[k], CY, HF, v, { t0: ts[k] }));
    ['los datos:  N = 2', 'PCA lineal:  dos componentes', 'kernel PCA:  dos componentes'].forEach((s, k) => aTx(p, s, CXs[k], 200, ts[k], { size: 26, anchor: 'middle', font: UI, weight: 600 }));
    [['x_{1}', 'x_{2}'], ['componente 1', 'componente 2'], ['componente 1', 'componente 2']].forEach(([a, b], k) => { aTx(pls[k].g, a, CXs[k] + HF, CY + HF + 30, null, { size: 22, fill: COL.dim, anchor: 'end', font: k ? UI : MATH }); aTx(pls[k].g, b, CXs[k] + 10, CY - HF + 28, null, { size: 22, fill: COL.dim, font: k ? UI : MATH }); });
    const A = aRg.map(x => [pls[0].X(x[0]), pls[0].Y(x[1])]), B = aRgP.Y.map(y => [pls[1].X(y[0]), pls[1].Y(y[1])]), Cc = aRg.map((x, i) => [pls[2].X(aRgY[0][i]), pls[2].Y(aRgY[1][i])]);
    aRg.forEach((x, i) => mk('circle', { cx: A[i][0].toFixed(1), cy: A[i][1].toFixed(1), r: 7, fill: cols[i], stroke: COL.board, 'stroke-width': 1.2 }, pls[0].gp));
    aFly(p, A, B, cols, tl, 1.8); aFly(p, A, Cc, cols, tk, 2.2);
    [[1, B, tl1, 'los dos grupos quedan mezclados'], [2, Cc, tk1, 'los dos grupos quedan separados']].forEach(([k, pos, t0, msg]) => {
      const g = G(p, { o: 0 }); show(g, t0 - .2, .3);
      mk('path', { d: `M${CXs[k] - HF} ${SY}h${2 * HF}`, stroke: COL.faint, 'stroke-width': 2, fill: 'none' }, g);
      aTx(g, 'solo la componente 1', CXs[k], SY - 36, null, { size: 22, fill: COL.dim, anchor: 'middle', font: UI });
      aFly(p, pos, pos.map(q => [q[0], SY]), cols, t0, 1.2);
      aTx(p, msg, CXs[k], SY + 64, t0 + 1.8, { size: 26, anchor: 'middle', font: UI, weight: 600, fill: k === 2 ? HUE.hyp : COL.chalk });
    });
  }],

  ['wrap', 'Resumen', (m) => {
    const p = panel(0);
    [['Reducir la dimensión:  una representación Y con k ≪ N coordenadas, fiel a X.', 'w1'], ['PCA:  proyección de rango k con el menor error de reconstrucción  =  la de mayor varianza.', 'w2'],
      ['Teorema 15.1:  P^{*} = U_{k} U_{k}^{⊤},  con los k vectores singulares principales de C.', 'w3'], ['Kernel PCA:  los vectores propios de K dan la proyección,  x_{i}^{⊤}u = √λ v_{i}.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 240 + i * 130, o: 0 });
      mk('circle', { cx: 160, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 160, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      aTx(g, str, 220, 0, null, { size: 28, weight: 600, font: UI });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Práctica del capítulo', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-vf', prompt: ['Sobre este capítulo: ¿verdadero o falso?'],
    build: grid([
      { parts: ['PCA proyecta los datos centrados sobre el subespacio que minimiza el error de reconstrucción.'], ans: ['v'], why: 'Es el problema (15.1), con los datos centrados.' },
      { parts: ['Minimizar el error de reconstrucción equivale a minimizar la varianza proyectada.'], ans: ['f'], why: 'Equivale a maximizarla: las dos suman una constante.' },
      { parts: ['La solución de PCA usa los k vectores singulares principales de la matriz de covarianza.'], ans: ['v'], why: 'Es el teorema 15.1.' },
      { parts: ['Para proyectar un punto, kernel PCA necesita las coordenadas del punto en el espacio de características.'], ans: ['f'], why: 'Solo usa valores del kernel entre el punto y la muestra.' },
      { parts: ['Los vectores propios de la matriz de kernel permiten obtener los vectores singulares de la covarianza.'], ans: ['v'], why: 'Cada uno se obtiene como X por v, sobre la raíz de lambda.' },
    ], [['v', 'verdadero', COL.real], ['f', 'falso', COL.task]], { multi: false, text: true }),
  }], done, 'Práctica del capítulo   1 de 2') }],

  ['final2', 'Práctica del capítulo', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-proy', prompt: ['Un vector propio ', $m('v'), ' de la matriz de kernel tiene valor propio ', $m(`λ = ${aQ3.lam}`), '. Su componente ', $m('i'), ` vale ${aDec(aQ3.vi)}. Según (15.5), ¿cuánto vale la proyección del punto `, $m('i'), ' de la muestra?'],
    build: choice(aQ3o.map(v => [aDec(v)]), 0,
      'Es la raíz de lambda por la componente: 4 por 0.5.',
      aQ3why),
  }], done, 'Práctica del capítulo   2 de 2') }],

  ['finish', 'Fin', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
