<script>
'use strict';
const CHAPTER = { number: 9, title: 'SVM: el caso separable', minutes: 6, language: 'es', next: '../ch10/' };

/* ---------- helpers de dibujo del capítulo (copiados de los caps. 1 y 8) ---------- */
// salmón = +1 · azul = −1 · ámbar = la recta (hipótesis), su franja y lo elegido · verde/rojo = acierto/error
const HUE = { pos: COL.nat, neg: COL.whole, hyp: COL.task };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500, font = UI } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, font, o: 0 }); show(e, t0); return e; };
// Texto con subíndices y superíndices: 'R_{D}(h_{S})'. Con t0 = null queda visible desde el inicio.
const aTx = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500, font = MATH } = {}) => {
  const e = T(p, '', { x, y, size, fill, anchor, weight, font, o: t0 == null ? 1 : 0 });
  let prev = 0;
  str.split(/([_^]\{[^}]*\})/).forEach(s => {
    if (!s) return;
    const k = /^[_^]\{/.test(s) ? (s[0] === '_' ? 1 : -1) : 0, dy = k > 0 ? size * .22 : k < 0 ? -size * .38 : 0;
    // α, ρ y ‖ se confunden en la fuente de interfaz (con «a», «p» y «II»): van siempre en la fuente matemática
    (k ? s.slice(2, -1) : s).split(/([αρ‖])/).filter(q => q).forEach((q, n) => { mk('tspan', { dy: n ? 0 : dy - prev, ...(k ? { 'font-size': size * .68 } : {}), ...(/[αρ‖]/.test(q) && font !== MATH ? { 'font-family': MATH } : {}) }, e).textContent = q; });
    prev = dy;
  });
  if (t0 != null) show(e, t0);
  return e;
};
const aRow = (p, parts, x, y, t0, opts = {}) => { const xs = [], els = parts.map(([str, fill]) => { xs.push(x); const e = aTx(p, str, x, y, t0, { ...opts, fill: fill || COL.chalk }); x += e.getComputedTextLength(); return e; }); els.xs = xs; els.end = x; return els; };
const aF2 = v => v.toFixed(2);
const aSg = v => (v < 0 ? '−' : '+') + Math.abs(v).toFixed(2);
const aNote = (p, str) => aTx(p, str, 1570, 884, .4, { size: 22, fill: COL.dim, anchor: 'end', font: UI });
const aHue = v => v > 0 ? HUE.pos : HUE.neg;                                       // etiqueta +1 = salmón, etiqueta −1 = azul
const aTitle = (p, str) => text(p, str, 100, 130, .3, { size: 30, fill: COL.task, weight: 600 });
const aSet = (e, str, t) => prog(() => { e.textContent = str; }, t, 0);            // cambia un texto simple en el instante t
const aArrow = (p, x1, y1, x2, y2, col = COL.dim) => {
  const a = Math.atan2(y2 - y1, x2 - x1), hd = d => `M${x2} ${y2}L${x2 - 18 * Math.cos(a + d)} ${y2 - 18 * Math.sin(a + d)}`;
  return path(p, `M${x1} ${y1}L${x2} ${y2}${hd(.45)}${hd(-.45)}`, { stroke: col, 'stroke-width': 4 }, { d: 0 });
};

/* aMATH:begin — cuentas del capítulo, sin dibujo (se prueban aparte con Node) */
const aDp = (a, b) => a[0] * b[0] + a[1] * b[1];
const aFn = (s, x) => aDp(s.w, x) + s.b;                                           // w · x + b
// SVM exacta en el plano (caso separable). El hiperplano de margen máximo queda fijado por 2 vectores de soporte (uno de cada
// clase: la mediatriz) o por 3 (dos de una clase y uno de la otra). Se prueban todos los candidatos, se descartan los que violan
// alguna restricción y_i(w · x_i + b) ≥ 1 y se conserva el de menor ‖w‖. Cada punto es [x1, x2, etiqueta].
const aSvm = pts => {
  let best = null;
  const tryc = (w, b) => { const n = Math.hypot(w[0], w[1]); if (!isFinite(n + b) || !pts.every(p => p[2] * (aDp(w, p) + b) >= 1 - 1e-9)) return; if (!best || n < best.n - 1e-12) best = { w, b, n }; };
  pts.forEach((P, i) => pts.forEach(N => {
    if (N[2] === P[2]) return;
    if (P[2] > 0) { const d = [P[0] - N[0], P[1] - N[1]], s = 2 / aDp(d, d), w = [d[0] * s, d[1] * s]; tryc(w, 1 - aDp(w, P)); }
    pts.forEach((Q, j) => { if (j <= i || Q[2] !== P[2]) return; const n = [Q[1] - P[1], P[0] - Q[0]], den = aDp(n, [P[0] - N[0], P[1] - N[1]]); if (Math.abs(den) < 1e-12) return; const c = 2 * P[2] / den, w = [n[0] * c, n[1] * c]; tryc(w, P[2] - aDp(w, P)); });
  }));
  if (!best) return null;
  best.rho = 1 / best.n;                                                           // margen geométrico ρ = 1/‖w‖
  best.sv = pts.map((p, i) => i).filter(i => Math.abs(pts[i][2] * aFn(best, pts[i]) - 1) < 1e-7);   // puntos sobre los hiperplanos marginales
  return best;
};
// Una recta como [θ, c, mitad de la franja]: normal unitaria n = (cos θ, sen θ) y n · x = c.
const aDeg = d => d * Math.PI / 180, aN2 = th => [Math.cos(th), Math.sin(th)];
const aSt = s => [Math.atan2(s.w[1], s.w[0]), -s.b / s.n, s.rho];
const aRngOf = (pts, th) => { const n = aN2(th); return [Math.max(...pts.filter(p => p[2] < 0).map(p => aDp(n, p))), Math.min(...pts.filter(p => p[2] > 0).map(p => aDp(n, p)))]; };
const aSep = (pts, th, f) => { const [lo, hi] = aRngOf(pts, th); return lo + f * (hi - lo); };   // c de la recta de dirección θ, a la fracción f del hueco entre las clases
const aDist = (pts, th, c) => { const n = aN2(th); return pts.map(p => p[2] * (aDp(n, p) - c)); };   // distancia con signo: positiva si el punto queda del lado correcto
const aMg = (pts, th, c) => Math.min(...aDist(pts, th, c));                        // margen geométrico de la recta (5.4)
const aNear = (pts, th, c) => { const d = aDist(pts, th, c); return d.indexOf(Math.min(...d)); };
const aErrs = (pts, th, c) => aDist(pts, th, c).filter(v => v <= 0).length;
// Coeficientes α de las condiciones KKT: w = Σ α_i y_i x_i (5.9) y Σ α_i y_i = 0 (5.10), con α_i = 0 fuera de los vectores de soporte (5.11).
const aAlpha = (pts, s) => {
  const al = pts.map(() => 0), v = s.sv;
  if (v.length === 2) v.forEach(i => { al[i] = s.n * s.n / 2; });
  else if (v.length === 3) {
    const A = [0, 1].map(r => v.map(i => pts[i][2] * pts[i][r])).concat([v.map(i => pts[i][2])]), b = [s.w[0], s.w[1], 0];
    const det = M => M[0][0] * (M[1][1] * M[2][2] - M[1][2] * M[2][1]) - M[0][1] * (M[1][0] * M[2][2] - M[1][2] * M[2][0]) + M[0][2] * (M[1][0] * M[2][1] - M[1][1] * M[2][0]), D = det(A);
    v.forEach((i, k) => { al[i] = det(A.map((row, r) => row.map((x, c) => c === k ? b[r] : x))) / D; });
  } else return null;
  return al;
};
const aDual = (pts, al) => al.reduce((s, a) => s + a, 0) - .5 * pts.reduce((s, p, i) => s + pts.reduce((t, q, j) => t + al[i] * al[j] * p[2] * q[2] * aDp(p, q), 0), 0);   // objetivo de (5.14)
// Dejar uno fuera: por cada punto, la solución sin él, si lo clasifica bien y si es la misma recta.
const aLoo = (pts, s) => pts.map((p, i) => { const q = aSvm(pts.filter((_, j) => j !== i)); return { q, ok: Math.sign(aFn(q, p)) === p[2], same: Math.abs(q.w[0] - s.w[0]) + Math.abs(q.w[1] - s.w[1]) + Math.abs(q.b - s.b) < 1e-9 }; });
// La muestra del capítulo: 12 puntos ilustrativos, 6 por clase, linealmente separables.
const aP = [[5, 6, 1], [9.5, 5.5, 1], [3, 6.5, 1], [9.5, 2.5, 1], [6.5, 7, 1], [6.5, 5.5, 1], [1, 4.5, -1], [1.5, 2.5, -1], [7.5, .5, -1], [2.5, 4.5, -1], [4, 3, -1], [6.5, 1.5, -1]];
const aM = aP.length, aSol = aSvm(aP), aStar = aSt(aSol), aNsv = aSol.sv.length, aAl = aAlpha(aP, aSol), aVals = aP.map(p => p[2] * aFn(aSol, p));
const aLo = aLoo(aP, aSol), aLerr = aLo.filter(o => !o.ok).length;
const aNon = aP.map((p, i) => i).filter(i => !aSol.sv.includes(i));               // los que no son vectores de soporte
const aSvOrd = [...aSol.sv].sort((i, j) => aLo[j].ok - aLo[i].ok);                 // vectores de soporte: primero los que siguen bien clasificados al quitarlos
const aRem1 = aNon.reduce((a, i) => aVals[i] < aVals[a] ? i : a), aRem2 = aSvOrd[0];   // los dos puntos que se quitan en el beat «soporte»
// Rectas separadoras que no son la de SVM: [θ, fracción del hueco].
const aA0 = [aDeg(46), .35], aTour = [[aDeg(40.5), .5], [aDeg(71), .6], [aDeg(52), .78]], aPoor = [aDeg(71), .5];
const aQ1 = [[aDeg(46), .5], [aDeg(67), .5]].map(([th, f]) => { const c = aSep(aP, th, f); return [th, c, aMg(aP, th, c)]; }).concat([aStar]), aQ1r = 2;   // comprobación 1
// Comprobación 2: otra muestra (10 puntos) y tres puntos marcados; solo uno es vector de soporte.
const aQ = [[1, 2.5, 1], [2, 5.5, 1], [4, 6.5, 1], [5.5, 6.5, 1], [5.5, 5, 1], [6.5, 2.5, -1], [8, 1.5, -1], [8.5, 4, -1], [8.5, 5.5, -1], [6.5, 1, -1]];
const aQs = aSvm(aQ), aQlo = aLoo(aQ, aQs), aQm = [3, 8, 6], aQr = aQm.findIndex(i => !aQlo[i].same);
const aGram = aP.map(p => aP.map(q => aDp(p, q))), aGmax = Math.max(...aGram.flat());   // tabla de productos internos x_i · x_j
/* aMATH:end */

// Plano de características con una recta, su franja y los hiperplanos marginales. Lo que depende de la recta se recorta al marco.
// pl.set(θ, c, mitad) mueve la recta; pl.lg es el grupo de la recta (empieza oculto) y pl.tg el de los dos semiplanos teñidos.
const aPlane = (p, ox, oy, sc, pts, id, { t0 = .4, W = 10.5, H = 8 } = {}) => {
  const X = x => ox + x * sc, Y = y => oy - y * sc, pl = { X, Y, sc, pts, W, H };
  mk('rect', { x: ox, y: oy - H * sc, width: W * sc, height: H * sc }, mk('clipPath', { id }, mk('defs', {}, p)));
  const fr = put(mk('rect', { x: ox, y: oy - H * sc, width: W * sc, height: H * sc, fill: 'none', stroke: COL.faint, 'stroke-width': 2 }, p), { o: t0 == null ? 1 : 0 });
  if (t0 != null) show(fr, t0);
  const cg = mk('g', { 'clip-path': `url(#${id})` }, p);
  pl.tg = G(cg, { o: 0 }); pl.tp = mk('polygon', { fill: HUE.pos, 'fill-opacity': .13 }, pl.tg); pl.tn = mk('polygon', { fill: HUE.neg, 'fill-opacity': .13 }, pl.tg);
  pl.under = G(cg);
  pl.lg = G(cg, { o: 0 });
  pl.band = mk('polygon', { fill: HUE.hyp, 'fill-opacity': .17 }, pl.lg);
  pl.m1 = mk('path', { stroke: HUE.hyp, 'stroke-width': 2.5, 'stroke-dasharray': '10 8', fill: 'none' }, pl.lg); pl.m2 = mk('path', { stroke: HUE.hyp, 'stroke-width': 2.5, 'stroke-dasharray': '10 8', fill: 'none' }, pl.lg);
  pl.ln = mk('path', { stroke: HUE.hyp, 'stroke-width': 4, fill: 'none' }, pl.lg);
  pl.dg = G(p);
  pl.dots = pts.map((q, i) => { const e = put(mk('circle', { r: sc > 50 ? 10 : 7, fill: aHue(q[2]) }, pl.dg), { x: X(q[0]), y: Y(q[1]), o: t0 == null ? 1 : 0 }); if (t0 != null) show(e, t0 + i * .03, .3); return e; });
  pl.set = (th, c, half = 0) => {
    const n = aN2(th), L = 30, P = (k, d) => X(n[0] * (c + d) - n[1] * k).toFixed(1) + ' ' + Y(n[1] * (c + d) + n[0] * k).toFixed(1);
    const ln = d => `M${P(-L, d)}L${P(L, d)}`, pg = (a, b) => [P(-L, a), P(L, a), P(L, b), P(-L, b)].join(' ');
    pl.ln.setAttribute('d', ln(0)); pl.m1.setAttribute('d', ln(half)); pl.m2.setAttribute('d', ln(-half));
    pl.band.setAttribute('points', pg(-half, half)); pl.tp.setAttribute('points', pg(0, L)); pl.tn.setAttribute('points', pg(0, -L));
    [pl.m1, pl.m2, pl.band].forEach(e => { e.style.display = half > 1e-6 ? '' : 'none'; });
  };
  return pl;
};
// Mueve la recta de un estado [θ, c, mitad] a otro.
const aGo = (pl, a, b, t0, dur) => prog(q => pl.set(...a.map((v, i) => v + (b[i] - v) * q)), t0, dur);
// Anillo alrededor del punto i del plano.
const aRing = (pl, i, col, t0, r = 19) => { const e = put(mk('circle', { r, fill: 'none', stroke: col, 'stroke-width': 4 }, pl.dg), { x: pl.X(pl.pts[i][0]), y: pl.Y(pl.pts[i][1]), o: 0 }); if (t0 != null) show(e, t0, .3); return e; };
// Marca de acierto (✓ verde) o de error (✗ roja) junto a un punto.
const aMark = (g, x, y, ok, t0) => { const e = put(mk('path', { d: ok ? 'M-9 0L-3 8L10 -9' : 'M-8 -8L8 8M8 -8L-8 8', fill: 'none', stroke: ok ? COL.good : COL.bad, 'stroke-width': 5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g), { x, y, o: 0 }); show(e, t0, .25); return e; };
// Posición del rótulo de la recta n · x = c donde sale del marco (por el borde derecho o por el inferior).
const aEdge = (pl, th, c) => { const n = aN2(th), y = (c - n[0] * pl.W) / n[1]; return y >= 0 && y <= pl.H ? { x: pl.X(pl.W) + 12, y: pl.Y(y) + 8, anchor: 'start' } : { x: pl.X(c / n[0]) + 36, y: pl.Y(0) + 30, anchor: 'end' }; };
const aMain = (p, id) => aPlane(p, 100, 686, 62, aP, id);
const NOTE = 'puntos ilustrativos · salmón = +1, azul = −1 · la recta y los valores se calculan en la página';

/* ---------- beats: [id, título, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Inicio', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Unidad 2 · Capítulo 9', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'SVM: el caso separable', { x: 800, y: 420, size: 64, weight: 600, anchor: 'middle' });
    T(g, 'máquinas de vectores de soporte', { x: 800, y: 500, size: 48, weight: 600, anchor: 'middle', fill: COL.task });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'Entre todas las rectas que separan una muestra, la de margen máximo.', 800, 620, m('sub'), { size: 32, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],

  ['lineal', 'Clasificación lineal', (m) => {
    const p = panel(0), tl = m('line'), tn = m('w'), ts = m('sign'), tm = m('move'), tv = m('vc'), RX = 830;
    aNote(p, NOTE);
    aTitle(p, 'Clasificación lineal');
    const pl = aMain(p, 'aClipLineal'), th = aA0[0], c = aSep(aP, ...aA0), n = aN2(th);
    text(p, 'cada punto: un ejemplo con etiqueta +1 o −1', RX, 230, 1.5, { size: 26, fill: COL.dim });
    pl.set(th, c); show(pl.lg, tl, .6);
    show(put(mk('path', { d: `M${RX} 300h44`, stroke: HUE.hyp, 'stroke-width': 4 }, p), { o: 0 }), tl);
    aTx(p, 'w · x + b = 0', RX + 60, 310, tl, { size: 32, fill: HUE.hyp, weight: 600 });
    text(p, 'hiperplano (aquí, una recta)', RX + 290, 308, tl + .6, { size: 24, fill: COL.dim });
    // el vector normal w
    const a0 = [n[0] * c + n[1] * 2, n[1] * c - n[0] * 2], a1 = [a0[0] + n[0] * 1.3, a0[1] + n[1] * 1.3];
    draw(aArrow(pl.dg, pl.X(a0[0]), pl.Y(a0[1]), pl.X(a1[0]), pl.Y(a1[1]), HUE.hyp), tn, .6);
    text(pl.dg, 'w', pl.X(a1[0]) + 10, pl.Y(a1[1]) - 6, tn + .4, { size: 30, fill: HUE.hyp, weight: 700, font: MATH });
    aTx(p, 'w: vector normal a la recta  ·  b: un número', RX, 370, tn, { size: 26, font: UI });
    show(pl.tg, ts, .8);
    aTx(p, 'w · x + b > 0:  se predice +1', RX, 450, ts, { size: 30, fill: HUE.pos, weight: 600 });
    aTx(p, 'w · x + b < 0:  se predice −1', RX, 498, ts + 5, { size: 30, fill: HUE.neg, weight: 600 });
    // un punto nuevo cruza la recta
    const A = [8.2, 4.3], B = [5.3, 2], nd = put(mk('circle', { r: 11, stroke: COL.chalk, 'stroke-width': 3 }, pl.dg), { o: 0 }), ro = text(p, '', RX, 580, tm, { size: 28, weight: 600 });
    const at = q => { const x = [A[0] + (B[0] - A[0]) * q, A[1] + (B[1] - A[1]) * q], v = aDp(n, x) - c; put(nd, { x: pl.X(x[0]), y: pl.Y(x[1]) }); nd.setAttribute('fill', aHue(v)); ro.textContent = `punto nuevo:  w · x + b = ${aSg(v)}   →   ${v > 0 ? '+1' : '−1'}`; ro.setAttribute('fill', aHue(v)); };
    at(0); show(nd, tm, .3); prog(at, tm + .5, 1.6); prog(q => at(1 - q), tm + 2.5, 1.4);
    aTx(p, 'H = { x ↦ sign(w · x + b) :  w ∈ ℝ^{N}, b ∈ ℝ }', RX, 680, tv, { size: 30, weight: 600 });
    aTx(p, '(5.2) · complejidad pequeña: VCdim(H) = N + 1 (cap. 5)', RX, 724, tv + 2.5, { size: 24, fill: COL.dim, font: UI });
  }],

  ['muchas', 'El caso separable', (m) => {
    const p = panel(0), tm = m('many'), tg = m('geo'), tn = m('min'), ts = m('swing'), RX = 830;
    aNote(p, NOTE);
    aTitle(p, 'El caso separable: ¿qué recta elegir?');
    const pl = aMain(p, 'aClipMuchas'), sg = G(pl.under, { o: 0 }), segs = aP.map(() => mk('path', { fill: 'none' }, sg)), ring = aRing(pl, 0, HUE.hyp, tn);
    const er = text(p, '', RX, 230, .6, { size: 28 }), rv = text(p, '', RX + 110, 640, tn + 1, { size: 40, fill: HUE.hyp, weight: 700, font: MATH });
    let hot = false, cur = aA0;
    const upd = (th, f) => {
      const c = aSep(aP, th, f), nn = aN2(th), k = aNear(aP, th, c);
      pl.set(th, c); cur = [th, f];
      segs.forEach((e, i) => { const q = aP[i], d = aDp(nn, q) - c, on = hot && i === k; e.setAttribute('d', `M${pl.X(q[0]).toFixed(1)} ${pl.Y(q[1]).toFixed(1)}L${pl.X(q[0] - d * nn[0]).toFixed(1)} ${pl.Y(q[1] - d * nn[1]).toFixed(1)}`); e.setAttribute('stroke', on ? HUE.hyp : COL.dim); e.setAttribute('stroke-width', on ? 5 : 2); });
      put(ring, { x: pl.X(aP[k][0]), y: pl.Y(aP[k][1]) });
      er.textContent = `errores en la muestra: ${aErrs(aP, th, c)} de ${aM}`; rv.textContent = aF2(aMg(aP, th, c));
    };
    const go = (a, b, t0, dur) => prog(q => upd(a[0] + (b[0] - a[0]) * q, a[1] + (b[1] - a[1]) * q), t0, dur);
    upd(...aA0); show(pl.lg, .5);
    go(aA0, aTour[0], tm, 1.5); go(aTour[0], aTour[1], tm + 2, 2); go(aTour[1], aTour[2], tm + 4.6, 1.8);
    text(p, 'hay infinitas rectas que separan la muestra', RX, 274, tm + .6, { size: 26, fill: COL.dim });
    show(sg, tg, .5);
    aTx(p, 'ρ_{h}(x) = |w · x + b| / ‖w‖', RX, 380, tg, { size: 36, weight: 600 });
    text(p, '(5.4) · margen geométrico de un punto: su distancia a la recta', RX, 422, tg + .6, { size: 22, fill: COL.dim });
    prog(() => { hot = true; upd(...cur); }, tn, 0);
    aTx(p, 'ρ_{h} = min_{i ∈ [m]} ρ_{h}(x_{i})', RX, 520, tn, { size: 36, weight: 600 });
    text(p, 'margen de la recta: la distancia al punto más cercano', RX, 562, tn + .6, { size: 22, fill: COL.dim });
    aTx(p, 'ρ_{h}  =', RX, 640, tn + 1, { size: 40, fill: HUE.hyp, weight: 700 });
