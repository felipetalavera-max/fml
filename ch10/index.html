<script>
'use strict';
const CHAPTER = { number: 10, title: 'SVM no separable y teoría del margen', minutes: 6, language: 'es', next: '../ch11/' };

/* ---------- helpers de dibujo del capítulo (copiados del cap. 9) ---------- */
// salmón = +1 · azul = −1 · ámbar = la recta, su franja y lo elegido · rosa (local) = holgura y pérdida bisagra · violeta = complejidad
const HUE = { pos: COL.nat, neg: COL.whole, hyp: COL.task, slk: COL.rat, cx: COL.real };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500, font = UI } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, font, o: 0 }); show(e, t0); return e; };
// Texto con subíndices y superíndices: 'R_{D}(h_{S})'. Con t0 = null queda visible desde el inicio.
const aTx = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500, font = MATH } = {}) => {
  const e = T(p, '', { x, y, size, fill, anchor, weight, font, o: t0 == null ? 1 : 0 });
  let prev = 0;
  str.split(/([_^]\{[^}]*\})/).forEach(s => {
    if (!s) return;
    const k = /^[_^]\{/.test(s) ? (s[0] === '_' ? 1 : -1) : 0, dy = k > 0 ? size * .22 : k < 0 ? -size * .38 : 0;
    // las letras griegas y ‖ se confunden en la fuente de interfaz: van siempre en la fuente matemática
    (k ? s.slice(2, -1) : s).split(/([αρξΦΛδ‖])/).filter(q => q).forEach((q, n) => { mk('tspan', { dy: n ? 0 : dy - prev, ...(k ? { 'font-size': size * .68 } : {}), ...(/[αρξΦΛδ‖]/.test(q) && font !== MATH ? { 'font-family': MATH } : {}) }, e).textContent = q; });
    prev = dy;
  });
  if (t0 != null) show(e, t0);
  return e;
};
// Varias piezas de aTx en una línea, cada una con su color; t0 puede ser una lista con un instante por pieza.
const aRow = (p, parts, x, y, t0, opts = {}) => { const xs = [], els = parts.map(([str, fill], k) => { xs.push(x); const e = aTx(p, str, x, y, Array.isArray(t0) ? t0[k] : t0, { ...opts, fill: fill || COL.chalk }); x += e.getComputedTextLength(); return e; }); els.xs = xs; els.end = x; return els; };
const aF2 = v => v.toFixed(2);
const aInt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+$)/g, ' ');           // entero con separador de miles
const aCf = C => C < .995 ? C.toFixed(2) : C < 9.95 ? C.toFixed(1) : String(Math.round(C));
const aNote = (p, str) => aTx(p, str, 1570, 884, .4, { size: 22, fill: COL.dim, anchor: 'end', font: UI });
const aHue = v => v > 0 ? HUE.pos : HUE.neg;                                       // etiqueta +1 = salmón, etiqueta −1 = azul
const aTitle = (p, str) => text(p, str, 100, 130, .3, { size: 30, fill: COL.task, weight: 600 });
const aHalo = e => { [['stroke', COL.board], ['stroke-width', 7], ['paint-order', 'stroke'], ['stroke-linejoin', 'round']].forEach(([k, v]) => e.setAttribute(k, v)); return e; };   // borde del color de la pizarra: el texto se lee sobre líneas
const aSet = (e, str, t) => prog(() => { e.textContent = str; }, t, 0);            // cambia un texto simple en el instante t
const aArrow = (p, x1, y1, x2, y2, col = COL.dim) => {
  const a = Math.atan2(y2 - y1, x2 - x1), hd = d => `M${x2} ${y2}L${x2 - 18 * Math.cos(a + d)} ${y2 - 18 * Math.sin(a + d)}`;
  return path(p, `M${x1} ${y1}L${x2} ${y2}${hd(.45)}${hd(-.45)}`, { stroke: col, 'stroke-width': 4 }, { d: 0 });
};

/* aMATH:begin — cuentas del capítulo, sin dibujo (se prueban aparte con Node) */
const aDp = (a, b) => a[0] * b[0] + a[1] * b[1];
const aFn = (s, x) => aDp(s.w, x) + s.b;                                           // w · x + b
// SVM de margen duro en el plano (cap. 9): devuelve null si la muestra no es separable.
const aSvm = pts => {
  let best = null;
  const tryc = (w, b) => { const n = Math.hypot(w[0], w[1]); if (!isFinite(n + b) || !pts.every(p => p[2] * (aDp(w, p) + b) >= 1 - 1e-9)) return; if (!best || n < best.n - 1e-12) best = { w, b, n }; };
  pts.forEach((P, i) => pts.forEach(N => {
    if (N[2] === P[2]) return;
    if (P[2] > 0) { const d = [P[0] - N[0], P[1] - N[1]], s = 2 / aDp(d, d), w = [d[0] * s, d[1] * s]; tryc(w, 1 - aDp(w, P)); }
    pts.forEach((Q, j) => { if (j <= i || Q[2] !== P[2]) return; const n = [Q[1] - P[1], P[0] - Q[0]], den = aDp(n, [P[0] - N[0], P[1] - N[1]]); if (Math.abs(den) < 1e-12) return; const c = 2 * P[2] / den, w = [n[0] * c, n[1] * c]; tryc(w, P[2] - aDp(w, P)); });
  }));
  if (!best) return null;
  best.rho = 1 / best.n;
  return best;
};
// SVM de margen blando: resuelve el dual (5.33) por pares (el par que más viola las condiciones de optimalidad, hasta que ninguno
// las viola en más de 1e-11). Devuelve w (5.26), b (5.35, promedio sobre los vectores con 0 < α < C), ρ = 1/‖w‖, α, los valores
// y_i(w · x_i + b), las holguras ξ_i = max(0, 1 − valor) y los dos objetivos: primal (5.24) y dual (5.33), que deben coincidir.
const aSoft = (pts, C) => {
  const al = pts.map(() => 0), g = pts.map(() => 1), K = pts.map(p => pts.map(q => aDp(p, q)));
  let it = 0, up = 0, lo = 0;
  for (; it < 400000; it++) {
    let i = -1, j = -1; up = -Infinity; lo = Infinity;
    pts.forEach((p, k) => { const y = p[2], v = y * g[k]; if ((y > 0 ? al[k] < C - 1e-13 : al[k] > 1e-13) && v > up) { up = v; i = k; } if ((y > 0 ? al[k] > 1e-13 : al[k] < C - 1e-13) && v < lo) { lo = v; j = k; } });
    if (up - lo < 1e-11) break;
    const yi = pts[i][2], yj = pts[j][2];
    const t = Math.min((up - lo) / (K[i][i] + K[j][j] - 2 * K[i][j]), yi > 0 ? C - al[i] : al[i], yj > 0 ? al[j] : C - al[j]);
    al[i] += yi * t; al[j] -= yj * t;
    pts.forEach((p, k) => { g[k] -= p[2] * t * (K[i][k] - K[j][k]); });
  }
  const idx = pts.map((p, k) => k), w = [0, 1].map(r => pts.reduce((s, p, k) => s + al[k] * p[2] * p[r], 0)), n = Math.hypot(w[0], w[1]);
  const free = idx.filter(k => al[k] > 1e-9 && al[k] < C - 1e-9), b = free.length ? free.reduce((s, k) => s + pts[k][2] * g[k], 0) / free.length : (up + lo) / 2;
  const val = pts.map(p => p[2] * (aDp(w, p) + b)), xi = val.map(v => Math.max(0, 1 - v)), slack = xi.reduce((s, v) => s + v, 0);
  return { C, w, b, n, rho: 1 / n, al, val, xi, slack, it, free, sv: idx.filter(k => al[k] > 1e-9), out: idx.filter(k => xi[k] > 1e-7), err: val.filter(v => v <= 0).length,
    primal: .5 * n * n + C * slack, dual: al.reduce((s, v) => s + v, 0) - .5 * n * n };
};
// Una recta como [θ, c, mitad de la franja]: normal unitaria n = (cos θ, sen θ) y n · x = c.
const aDeg = d => d * Math.PI / 180, aN2 = th => [Math.cos(th), Math.sin(th)];
const aStW = (w, b) => { const n = Math.hypot(w[0], w[1]); return [Math.atan2(w[1], w[0]), -b / n, 1 / n]; };
const aErrs = (pts, th, c) => { const n = aN2(th); return pts.filter(p => p[2] * (aDp(n, p) - c) <= 0).length; };   // errores de la recta n · x = c
// La mejor recta de dirección θ: el corrimiento c con menos errores (se prueban los puntos medios entre proyecciones vecinas).
const aBestC = (pts, th) => { const n = aN2(th), pr = pts.map(p => aDp(n, p)).sort((a, b) => a - b); let best = null; pr.slice(1).forEach((v, k) => { const c = (v + pr[k]) / 2, e = aErrs(pts, th, c); if (!best || e < best[1]) best = [c, e]; }); return best[0]; };
const aSlackOf = (pts, w, b) => pts.reduce((s, p) => s + Math.max(0, 1 - p[2] * (aDp(w, p) + b)), 0);   // holgura total de una recta cualquiera
// La muestra: los 12 puntos del cap. 9 más dos puntos nuevos, cada uno en la zona de la otra clase. Ya no es separable.
const aP0 = [[5, 6, 1], [9.5, 5.5, 1], [3, 6.5, 1], [9.5, 2.5, 1], [6.5, 7, 1], [6.5, 5.5, 1], [1, 4.5, -1], [1.5, 2.5, -1], [7.5, .5, -1], [2.5, 4.5, -1], [4, 3, -1], [6.5, 1.5, -1]];
const aNew = [[1, 5.5, 1], [7.5, 3.5, -1]], aP = aP0.concat(aNew), aM = aP.length;
const aOld = aSvm(aP0), aHard = aSvm(aP);                                          // la recta del cap. 9 · null: ninguna recta separa la muestra nueva
const aCs = [.1, .5, 100], aSols = aCs.map(C => aSoft(aP, C)), [aLo, aMid, aHi] = aSols;   // las tres paradas del dial de C
// El dial: soluciones sobre una rejilla de C (71 valores entre 10^−1.5 y 10^2); entre dos valores vecinos se interpola (w, b).
const aE0 = -1.5, aE1 = 2, aGn = 70, aGrid = Array.from({ length: aGn + 1 }, (_, k) => aSoft(aP, Math.pow(10, aE0 + (aE1 - aE0) * k / aGn)));
const aAtC = C => { const u = Math.min(aGn, Math.max(0, (Math.log10(C) - aE0) / (aE1 - aE0) * aGn)), k = Math.min(aGn - 1, Math.floor(u)), q = u - k, A = aGrid[k], B = aGrid[k + 1]; return { w: [0, 1].map(r => A.w[r] + (B.w[r] - A.w[r]) * q), b: A.b + (B.b - A.b) * q }; };
const aLogMix = (a, b, q) => q >= 1 ? b : q <= 0 ? a : Math.pow(10, Math.log10(a) + (Math.log10(b) - Math.log10(a)) * q);
const aStk = vals => vals.map((v, i) => vals.slice(0, i).filter(u => Math.abs(u - v) < .02).length);   // cuántos valores iguales hay antes de cada uno
// Rectas del beat «holgura»: la del cap. 9, dos direcciones más (cada una con su mejor corrimiento) y la solución con C = 0.5.
const aTour = [aStW(aOld.w, aOld.b).slice(0, 2), ...[76, 42].map(d => [aDeg(d), aBestC(aP, aDeg(d))]), aStW(aMid.w, aMid.b).slice(0, 2)];
const aQ1 = [1, 2, 0], aQ1r = aQ1.indexOf(2);                                      // comprobación 1: orden de los tres dibujos; el de C más grande
const aQ2 = [1, 3, 11], aQ2r = aQ2.findIndex(i => aLo.xi[i] > 1e-7);               // comprobación 2 (solución con C = 0.1): fuera de la franja, atípico, sobre el margen
// Cota por dimensión VC (5.36): su término de complejidad, con m fijo.
const aMm = 10000, aVcT = (N, m) => Math.sqrt(2 * (N + 1) * Math.log(Math.E * m / (N + 1)) / m);
const aNx = (() => { let N = 1; while (aVcT(N, aMm) <= 1) N++; return N; })();     // la menor dimensión con término mayor que 1
// Pérdida de margen (definición 5.5) y pérdida de margen empírica (5.37) de h(x) = (w · x + b)/‖w‖, con (w, b) de la solución con C = 0.5.
const aPhiR = (u, rho) => Math.min(1, Math.max(0, 1 - u / rho));
const aD = aP.map(p => p[2] * aFn(aMid, p) / aMid.n);                              // y_i h(x_i): distancia a la recta, con signo
const aRm = rho => aD.reduce((s, d) => s + aPhiR(d, rho), 0) / aM, aCnt = rho => aD.filter(d => d <= rho).length;   // (5.37) y el conteo de (5.38)
const aCorT = (ratio, m, L = 1) => 2 * Math.sqrt(ratio * ratio * L * L / m);       // segundo término de (5.44), con ratio = r/ρ
/* aMATH:end */

// Plano de características con una recta, su franja, los hiperplanos marginales y las holguras. Lo que depende de la recta se recorta al marco.
// pl.set(θ, c, mitad) mueve la recta; pl.lg es el grupo de la recta y pl.sg el de las holguras (los dos empiezan ocultos). at(i) da el instante en que aparece el punto i.
const aPlane = (p, ox, oy, sc, pts, id, { t0 = .4, W = 10.5, H = 8, at = () => null } = {}) => {
  const X = x => ox + x * sc, Y = y => oy - y * sc, pl = { X, Y, sc, pts, W, H };
  mk('rect', { x: ox, y: oy - H * sc, width: W * sc, height: H * sc }, mk('clipPath', { id }, mk('defs', {}, p)));
  const fr = put(mk('rect', { x: ox, y: oy - H * sc, width: W * sc, height: H * sc, fill: 'none', stroke: COL.faint, 'stroke-width': 2 }, p), { o: t0 == null ? 1 : 0 });
  if (t0 != null) show(fr, t0);
  const cg = mk('g', { 'clip-path': `url(#${id})` }, p);
  pl.lg = G(cg, { o: 0 });
  pl.band = mk('polygon', { fill: HUE.hyp, 'fill-opacity': .17 }, pl.lg);
  pl.m1 = mk('path', { stroke: HUE.hyp, 'stroke-width': 2.5, 'stroke-dasharray': '10 8', fill: 'none' }, pl.lg); pl.m2 = mk('path', { stroke: HUE.hyp, 'stroke-width': 2.5, 'stroke-dasharray': '10 8', fill: 'none' }, pl.lg);
  pl.ln = mk('path', { stroke: HUE.hyp, 'stroke-width': 4, fill: 'none' }, pl.lg);
  pl.sg = G(cg, { o: 0 });
  pl.dg = G(p);
  pl.dots = pts.map((q, i) => { const e = put(mk('circle', { r: sc > 50 ? 10 : 7, fill: aHue(q[2]) }, pl.dg), { x: X(q[0]), y: Y(q[1]), o: t0 == null ? 1 : 0 }); if (t0 != null) show(e, at(i) == null ? t0 + i * .03 : at(i), .3); return e; });
  pl.set = (th, c, half = 0) => {
    const n = aN2(th), L = 30, P = (k, d) => X(n[0] * (c + d) - n[1] * k).toFixed(1) + ' ' + Y(n[1] * (c + d) + n[0] * k).toFixed(1);
    const ln = d => `M${P(-L, d)}L${P(L, d)}`, pg = (a, b) => [P(-L, a), P(L, a), P(L, b), P(-L, b)].join(' ');
    pl.ln.setAttribute('d', ln(0)); pl.m1.setAttribute('d', ln(half)); pl.m2.setAttribute('d', ln(-half));
    pl.band.setAttribute('points', pg(-half, half));
    [pl.m1, pl.m2, pl.band].forEach(e => { e.style.display = half > 1e-6 ? '' : 'none'; });
  };
  return pl;
};
// Holguras: un segmento rosa por punto, desde el punto hasta su hiperplano marginal (largo ξ_i/‖w‖). Devuelve la función que lo actualiza para (w, b).
const aSlack = pl => {
  const segs = pl.pts.map(() => mk('path', { stroke: HUE.slk, 'stroke-width': pl.sc > 50 ? 5 : 3.5, 'stroke-linecap': 'round', fill: 'none' }, pl.sg));
  return (w, b) => { const n = Math.hypot(w[0], w[1]); pl.pts.forEach((q, i) => { const L = Math.max(0, 1 - q[2] * (aDp(w, q) + b)) / n, e = segs[i]; e.style.display = L > 1e-9 ? '' : 'none'; e.setAttribute('d', `M${pl.X(q[0]).toFixed(1)} ${pl.Y(q[1]).toFixed(1)}L${pl.X(q[0] + q[2] * w[0] / n * L).toFixed(1)} ${pl.Y(q[1] + q[2] * w[1] / n * L).toFixed(1)}`); }); };
};
// Pone en el plano la recta w · x + b = 0 con su franja de margen blando y sus holguras.
const aSetW = (pl, slk, w, b) => { pl.set(...aStW(w, b)); if (slk) slk(w, b); };
// Anillo alrededor del punto i del plano.
const aRing = (pl, i, col, t0, r = 19) => { const e = put(mk('circle', { r, fill: 'none', stroke: col, 'stroke-width': 4 }, pl.dg), { x: pl.X(pl.pts[i][0]), y: pl.Y(pl.pts[i][1]), o: 0 }); if (t0 != null) show(e, t0, .3); return e; };
const aMain = (p, id, at) => aPlane(p, 100, 686, 62, aP, id, { at });
// Dial de C en escala logarítmica: riel, marcas en las décadas, perilla y rótulo. dial.set(C) lo mueve.
const aDial = (p, x, y, W, t0) => {
  const g = G(p, { o: 0 }), DX = C => x + (Math.log10(C) - aE0) / (aE1 - aE0) * W;
  mk('path', { d: `M${x} ${y}H${x + W}`, stroke: COL.faint, 'stroke-width': 6, 'stroke-linecap': 'round', fill: 'none' }, g);
  [.1, 1, 10, 100].forEach(C => { mk('path', { d: `M${DX(C)} ${y - 10}v20`, stroke: COL.dim, 'stroke-width': 2 }, g); T(g, String(C), { x: DX(C), y: y + 44, size: 22, fill: COL.dim, anchor: 'middle', font: MATH }); });
  const kn = put(mk('circle', { r: 15, fill: HUE.hyp }, g), { y }), lab = T(g, '', { y: y - 32, size: 30, fill: HUE.hyp, weight: 700, anchor: 'middle', font: MATH });
  show(g, t0);
  return { g, set: C => { put(kn, { x: DX(C) }); put(lab, { x: DX(C) }); lab.textContent = 'C = ' + aCf(C); } };
};
// Ejes de una pérdida en función de u = y · h(x): eje horizontal con marcas enteras y eje vertical con la marca del 1.
const aAxes = (p, UX, UY, U0, U1, top, label) => {
  const ax = G(p, { o: 0 });
  mk('path', { d: `M${UX(U0)} ${UY(0)}H${UX(U1)}M${UX(0)} ${UY(0)}V${UY(top)}`, fill: 'none', stroke: COL.dim, 'stroke-width': 2 }, ax);
  for (let u = Math.ceil(U0); u <= U1; u++) { mk('path', { d: `M${UX(u)} ${UY(0)}v8`, stroke: COL.dim, 'stroke-width': 2 }, ax); T(ax, (u < 0 ? '−' : '') + Math.abs(u), { x: UX(u), y: UY(0) + 34, size: 22, fill: COL.dim, anchor: 'middle', font: MATH }); }
  mk('path', { d: `M${UX(0) - 6} ${UY(1)}h12`, stroke: COL.dim, 'stroke-width': 2 }, ax); T(ax, '1', { x: UX(0) + 12, y: UY(1) - 10, size: 22, fill: COL.dim, font: MATH });
  aTx(ax, label, UX(U1) + 4, UY(0) + 72, null, { size: 26, anchor: 'end' });
  show(ax, .4);
  return ax;
};
// Los puntos de la muestra sobre una gráfica: disco de su color; los que repiten un valor van como anillos concéntricos.
const aPlotDots = (g, vals) => { const k = aStk(vals); return aP.map((q, i) => put(mk('circle', k[i] ? { r: 8 + 5 * k[i], fill: 'none', stroke: aHue(q[2]), 'stroke-width': 3 } : { r: 8, fill: aHue(q[2]) }, g), { o: 0 })); };
const aStep = (u0, u1, UX, UY) => `M${UX(u0)} ${UY(1)}H${UX(0)}V${UY(0)}H${UX(u1)}`;     // la pérdida 0-1 como función de y · h(x)
const NOTE = 'puntos ilustrativos · salmón = +1, azul = −1 · rosa = holgura · todo se calcula en la página';
const aLab = { 3: [-18, 36, 'end'], 9: [18, 38, 'start'], 12: [18, 38, 'start'], 13: [18, -18, 'start'] };   // dónde rotular ξ junto a cada atípico de la solución con C = 0.5

/* ---------- beats: [id, título, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Inicio', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Unidad 2 · Capítulo 10', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'SVM no separable', { x: 800, y: 420, size: 64, weight: 600, anchor: 'middle' });
    T(g, 'y teoría del margen', { x: 800, y: 500, size: 48, weight: 600, anchor: 'middle', fill: COL.task });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'Cuando ninguna recta separa la muestra, y por qué conviene un margen grande.', 800, 620, m('sub'), { size: 32, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],

  ['holgura', 'El caso no separable', (m) => {
    const p = panel(0), tn = m('new'), tsw = m('swing'), tr = m('relax'), tsg = m('seg'), ti = m('in'), tb = m('bad'), tf = m('soft'), RX = 830, n0 = aP0.length;
    aNote(p, NOTE);
    aTitle(p, 'El caso no separable');
    const pl = aMain(p, 'aClipHolgura', i => i < n0 ? null : tn + (i - n0) * .5), slk = aSlack(pl), g0 = G(p);
    text(g0, 'cap. 9: muestra separable, recta de margen máximo', RX, 230, .5, { size: 24, fill: COL.dim });
    text(g0, 'dos puntos nuevos, cada uno en la zona de la otra clase', RX, 280, tn + .8, { size: 24 });

  ['cota', 'La cota por margen', (m) => {
    const p = panel(0), tt = m('thm'), t1 = m('t1'), t2 = m('t2'), t3 = m('t3'), tr = m('rad'), tc = m('cor'), td = m('dim'), tw0 = m('wide'), tg = m('good'), ts = m('svm'), FX = 640, CX = 330, CY = 450, RR = 210, Q0 = 20, Q1 = 2.5, BW = 900;

    aTx(gA, 'S ⊆ { x : ‖x‖ ≤ r },    H = { x ↦ w · x : ‖w‖ ≤ Λ }', FX, 524, tr + 1.5, { size: 28 });

    text(p, 'los datos caben en una bola de radio r', CX, CY + RR + 46, tr + 2, { size: 22, fill: COL.dim, anchor: 'middle' });
    const bg = G(mk('g', { 'clip-path': 'url(#aClipBola)' }, p), { o: 0 }), bd = mk('polygon', { fill: HUE.hyp, 'fill-opacity': .22 }, bg);
