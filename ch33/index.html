<script>
'use strict';
const CHAPTER = { number: 33, title: 'Procesos de decisión de Markov y políticas', minutes: 7, language: 'es', next: '../ch34/' };

/* ---------- helpers de dibujo del capítulo (los genéricos, copiados del cap. 32) ---------- */
// Sin clases en este capítulo. Ámbar = el agente, la acción elegida y la política · verde = recompensa (rojo si es negativa) ·
// violeta = el valor (V y Q) · rosa = probabilidades de transición y descuento · tiza = estados y lo demás.
const HUE = { act: COL.task, rew: COL.good, neg: COL.bad, val: COL.real, pr: COL.rat };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500, font = UI } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, font, o: 0 }); show(e, t0); return e; };
// Texto con subíndices y superíndices: 'x_{j}', 'a^{*}'. Con t0 = null queda visible desde el inicio. No anida llaves.
const aSYM = /([αβεγδηθφρσλμξχΦΨΓΠΛΩΣΔ‖ℜℝ√∑∏⟹⟺⟷≈∼∞⊤†∈∃∀→←↦′″⌊⌋½∇∝≫≪⟨⟩⋯≠π⊆])/;                        // símbolos que van siempre en la fuente matemática
const aFill = (e, str, size, font) => {
  e.replaceChildren();
  let prev = 0;
  str.split(/([_^]\{[^}]*\})/).forEach(s => {
    if (!s) return;
    const k = /^[_^]\{/.test(s) ? (s[0] === '_' ? 1 : -1) : 0, dy = k > 0 ? size * .22 : k < 0 ? -size * .38 : 0;
    (k ? s.slice(2, -1) : s).split(aSYM).filter(q => q).forEach((q, n) => { mk('tspan', { dy: n ? 0 : dy - prev, ...(k ? { 'font-size': size * .68 } : {}), ...(aSYM.test(q) && font !== MATH ? { 'font-family': MATH } : {}) }, e).textContent = q; });
    prev = dy;
  });
};
const aTx = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500, font = MATH } = {}) => {
  const e = T(p, '', { x, y, size, fill, anchor, weight, font, o: t0 == null ? 1 : 0 });
  aFill(e, str, size, font); e._set = s => aFill(e, s, size, font);
  if (t0 != null) show(e, t0);
  return e;
};
// Varias piezas de aTx en una línea: [texto, color, fuente, tamaño]; t0 puede ser una lista con un instante por pieza.
const aRow = (p, parts, x, y, t0, opts = {}) => { const xs = [], els = parts.map(([str, fill, font, size], k) => { xs.push(x); const e = aTx(p, str, x, y, Array.isArray(t0) ? t0[k] : t0, { ...opts, fill: fill || COL.chalk, ...(font ? { font } : {}), ...(size ? { size } : {}) }); x += e.getComputedTextLength(); return e; }); els.xs = xs; els.end = x; return els; };
const aNote = (p, str) => aTx(p, str, 1570, 884, .4, { size: 22, fill: COL.dim, anchor: 'end', font: UI });
const aTitle = (p, str) => text(p, str, 100, 130, .3, { size: 30, fill: COL.task, weight: 600 });
const aAt = (fn, t) => prog(() => fn(), t, 0);                                      // un cambio instantáneo en el instante t
const aHideAll = (els, t) => els.forEach(e => hide(e, t, .3));

/* aMATH:begin — cuentas del capítulo, sin dibujo (se prueban aparte con Node) */
// Sistema lineal A·z = c por eliminación de Gauss con pivoteo parcial (el del cap. 24).
const aSolve = (A, c) => {
  const n = c.length, a = A.map((r, i) => [...r, c[i]]);
  for (let k = 0; k < n; k++) {
    let pv = k; for (let i = k + 1; i < n; i++) if (Math.abs(a[i][k]) > Math.abs(a[pv][k])) pv = i;
    [a[k], a[pv]] = [a[pv], a[k]];
    for (let i = k + 1; i < n; i++) { const f = a[i][k] / a[k][k]; for (let j = k; j <= n; j++) a[i][j] -= f * a[k][j]; }
  }
  const z = Array(n).fill(0);
  for (let i = n - 1; i >= 0; i--) z[i] = (a[i][n] - a[i].slice(i + 1, n).reduce((s, v, j) => s + v * z[i + 1 + j], 0)) / a[i][i];
  return z;
};
const aRng = seed => () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
// --- El MDP de la figura 17.3 del libro (start, other · search, carry, pickup). El libro deja R1, R2 y R3 sin valor: aquí 0, 1 y 3 (ilustrativos), y γ = 0.8.
const aST = ['inicio', 'otro'], aAC = ['buscar', 'llevar', 'recoger'], aGAM = .8, aR1 = 0, aR2 = 1, aR3 = 3, aHOR = 60;
// Una transición por flecha de la figura: desde s, con la acción a, se llega a «to» con probabilidad p y recompensa r. loop / bend: solo para dibujarla.
const aED = [{ s: 0, a: 0, to: 0, p: .1, r: aR1, loop: -90 }, { s: 0, a: 0, to: 1, p: .9, r: aR1, bend: -.2 }, { s: 1, a: 1, to: 0, p: .5, r: aR3, bend: -.2 },
  { s: 1, a: 1, to: 1, p: .5, r: -1, loop: -90 }, { s: 1, a: 2, to: 1, p: 1, r: aR2, loop: 90 }];
const aMDP = { ini: 0, lab: aST, act: aAC, ed: aED };
const aOut = (s, a) => aED.map((e, k) => ({ ...e, k })).filter(e => e.s === s && e.a === a);
const aEr = (s, a) => aOut(s, a).reduce((v, e) => v + e.p * e.r, 0);                                   // E[r(s, a)]
const aPm = pi => aST.map((_, s) => aST.map((_, t) => aOut(s, pi[s]).filter(e => e.to === t).reduce((v, e) => v + e.p, 0)));   // P de (17.6)
const aRv = pi => aST.map((_, s) => aEr(s, pi[s]));                                                    // R de (17.6)
const aV = (pi, gam = aGAM) => aSolve(aPm(pi).map((r, i) => r.map((v, j) => (i === j ? 1 : 0) - gam * v)), aRv(pi));   // (17.7): (I − γP) V = R
const aQ = (V, s, a, gam = aGAM) => aOut(s, a).reduce((v, e) => v + e.p * (e.r + gam * V[e.to]), 0);       // (17.1), segunda forma
// Trayectoria simulada de n pasos con la política determinista pi desde s0: por paso, { t, s, a, k: flecha, r, to }.
const aTraj = (pi, s0, rnd, n = aHOR) => { const o = []; let s = s0; for (let t = 0; t < n; t++) { const es = aOut(s, pi[s]); let u = rnd(), e = es[es.length - 1]; for (const c of es) { if (u < c.p) { e = c; break; } u -= c.p; } o.push({ t, s, a: e.a, k: e.k, r: e.r, to: e.to }); s = e.to; } return o; };
const aRet = (tr, gam = aGAM) => tr.reduce((v, x) => v + gam ** x.t * x.r, 0);                          // retorno descontado (truncado a los pasos simulados)
// n trayectorias desde s0: retornos, promedio acumulado y promedio final.
const aMC = (pi, s0, seed, n) => { const rnd = aRng(seed), rs = [], avg = []; let sum = 0; for (let i = 0; i < n; i++) { const g = aRet(aTraj(pi, s0, rnd)); rs.push(g); sum += g; avg.push(sum / (i + 1)); } return { rs, avg, mean: sum / n }; };
// --- Datos: π lleva en «otro»; π′ recoge en «otro» (en «inicio» solo existe buscar).
const aPI = [0, 1], aPI2 = [0, 2], aNMC = 5000;
const aV1 = aV(aPI), aV2 = aV(aPI2);
const aTR1 = aTraj(aPI, 0, aRng(12)), aG1 = aRet(aTR1);                                              // la trayectoria que camina el agente
const aTR2 = aTraj(aPI, 0, aRng(5));                                                                // la de la comprobación 1
const aMC0 = aMC(aPI, 0, 3, aNMC), aMC1 = aMC(aPI, 1, 103, aNMC);
const aQ1 = [aQ(aV1, 1, 1), aQ(aV1, 1, 2)], aQ2 = [aQ(aV2, 1, 2), aQ(aV2, 1, 1)];                     // Q_π(otro, ·) y Q_π′(otro, ·)
const aImp = aST.every((_, s) => aQ(aV1, s, aPI2[s]) >= aQ(aV1, s, aPI[s]) - 1e-12);                  // hipótesis del teorema 17.6 para π → π′
const aOpt = pi => { const V = aV(pi); return aST.every((_, s) => { const as = [...new Set(aED.filter(e => e.s === s).map(e => e.a))]; return aQ(V, s, pi[s]) >= Math.max(...as.map(a => aQ(V, s, a))) - 1e-12; }); };   // (17.2)
const aF = (v, n = 2) => (Math.abs(v) < 5e-7 ? 0 : v).toFixed(n).replace('-', '−'), aN = v => String(v).replace('-', '−');
/* aMATH:end */

// MDP como grafo (generaliza el aGraph de los caps. 13, 31 y 32): estados en cualquier lugar; una flecha por transición, rotulada «acción / [probabilidad, recompensa]»
// como en la figura 17.3. M = { ini, lab, act, ed: [{ s, a, to, p, r, loop: ángulo en grados | bend }] }. Estado inicial = círculo grueso.
// tl = [instante de las flechas y la acción, de la probabilidad, de la recompensa] (null: todo visible). vals: deja lugar para un número dentro del estado.
// gr.pol(pi, t) tiñe de ámbar las flechas de la política y apaga las otras · gr.hot engrosa una flecha un momento · gr.setV escribe el valor de un estado ·
// gr.tok / gr.go: ficha del agente que recorre una flecha · gr.ed[k].box = caja del rótulo.
const aGraph = (p, M, pos, { t0 = .4, tS = null, tl = null, rad = 62, size = 24, vals = false } = {}) => {
  const g = G(p, { o: t0 == null ? 1 : 0 }), ge = G(g), gs = G(g, { o: tS == null ? 1 : 0 }), gr = { g, pos, M, rad, ed: [], ring: [], val: [], sg: [] };
  const f = Q => Q.map(v => v.toFixed(1)).join(' '), ext = rad * 1.8, ap = ((2 * rad + 13) * Math.cos(.42) + 6 * (rad + ext) * Math.cos(.6)) / 8;
  const off = (U, V, r) => { const l = Math.hypot(V[0] - U[0], V[1] - U[1]); return [U[0] + (V[0] - U[0]) * r / l, U[1] + (V[1] - U[1]) * r / l]; };
  const head = (Q, C) => { const ha = Math.atan2(Q[1] - C[1], Q[0] - C[0]), u = [Math.cos(ha), Math.sin(ha)]; return `M${f([Q[0] + 12 * u[0], Q[1] + 12 * u[1]])}L${f([Q[0] - 4 * u[0] - 8 * u[1], Q[1] - 4 * u[1] + 8 * u[0]])}L${f([Q[0] - 4 * u[0] + 8 * u[1], Q[1] - 4 * u[1] - 8 * u[0]])}Z`; };
  M.ed.forEach((e, k) => {
    const [x1, y1] = pos[e.s], [x2, y2] = pos[e.to], eg = G(ge), ea = G(eg, { o: tl ? 0 : 1 });
    let d, Q2, C, lx, ly;
    if (e.s === e.to) {
      const th = (e.loop ?? -90) * Math.PI / 180, pt = (ang, r) => [x1 + r * Math.cos(ang), y1 + r * Math.sin(ang)];
      C = pt(th + .6, rad + ext); Q2 = pt(th + .42, rad + 13); d = `M${f(pt(th - .42, rad))}C${f(pt(th - .6, rad + ext))} ${f(C)} ${f(Q2)}`;
      [lx, ly] = pt(th, ap + 18); if (Math.sin(th) > 0) ly += size * .75;
    } else {
      const len = Math.hypot(x2 - x1, y2 - y1), nx = -(y2 - y1) / len, ny = (x2 - x1) / len, bd = (e.bend ?? 0) * len, sd = bd < 0 ? -1 : 1;
      C = [(x1 + x2) / 2 + nx * bd, (y1 + y2) / 2 + ny * bd]; Q2 = off([x2, y2], C, rad + 13); const Q0 = off([x1, y1], C, rad);
      const mid = [(Q0[0] + 2 * C[0] + Q2[0]) / 4, (Q0[1] + 2 * C[1] + Q2[1]) / 4];
      d = `M${f(Q0)}Q${f(C)} ${f(Q2)}`; lx = mid[0] + nx * sd * 22; ly = mid[1] + ny * sd * 22 + (ny * sd > 0 ? size * .75 : 0);
    }
    const pe = mk('path', { d, fill: 'none', stroke: COL.dim, 'stroke-width': 3, 'stroke-linecap': 'round' }, ea), hd = mk('path', { d: head(Q2, C), fill: COL.dim }, ea);
    const lg = G(eg), ls = aRow(lg, [[M.act[e.a], COL.chalk, UI], [' / [', COL.dim], [aN(e.p), HUE.pr], [', ', COL.dim], [aN(e.r), e.r < 0 ? HUE.neg : HUE.rew], [']', COL.dim]], 0, 0, null, { size, weight: 600 });
    put(lg, { x: lx - ls.end / 2, y: ly });
    if (tl) { ls.forEach((el, i) => { put(el, { o: 0 }); show(el, tl[[0, 1, 1, 2, 2, 1][i]] + k * .15, .4); }); show(ea, tl[0] + k * .15, .4); }
    gr.ed.push({ g: eg, pe, hd, act: ls[0], ls, box: [lx - ls.end / 2 - 10, ly - size - 6, ls.end + 20, size + 18] });
  });
  M.lab.forEach((lab, id) => {
    const [x, y] = pos[id], sg = G(gs);
    gr.ring[id] = mk('circle', { cx: x, cy: y, r: rad, fill: COL.board, stroke: COL.chalk, 'stroke-width': id === M.ini ? 7 : 3 }, sg);
    T(sg, lab, { x, y: y + (vals ? -8 : 9), size: 26, anchor: 'middle', weight: 600 });
    gr.val[id] = aTx(sg, '', x, y + 30, null, { size: 28, fill: HUE.val, anchor: 'middle', weight: 700 });
    gr.sg[id] = sg;
  });
  if (t0 != null) show(g, t0);
  if (tS != null) show(gs, tS);
  gr.pol = (pi, t) => M.ed.forEach((e, k) => {
    const on = pi[e.s] === e.a, E = gr.ed[k], c = on ? HUE.act : COL.dim;
    if (t == null) { E.pe.setAttribute('stroke', c); E.hd.setAttribute('fill', c); E.act.setAttribute('fill', on ? HUE.act : COL.chalk); put(E.g, { o: on ? 1 : .3 }); return; }
    tw(E.pe, { c_stroke: c }, t, .35); tw(E.hd, { c_fill: c }, t, .35); tw(E.act, { c_fill: on ? HUE.act : COL.chalk }, t, .35); tw(E.g, { o: on ? 1 : .3 }, t, .35);
  });
  gr.hot = (k, ta, tb) => { const e = gr.ed[k].pe; tw(e, { 'a_stroke-width': 8 }, ta, .15); tw(e, { 'a_stroke-width': 3 }, tb, .3); };
  gr.setV = (id, str, t, c = HUE.val) => { const e = gr.val[id]; if (t == null) { e._set(str); e.setAttribute('fill', c); return; } aAt(() => e._set(str), t); tw(e, { c_fill: COL.chalk }, t, .1); tw(e, { c_fill: c }, t + .5, .5); };
  const rest = s => [pos[s][0], pos[s][1] + rad * .55];
  gr.tok = s => put(mk('circle', { r: 13, fill: HUE.act, stroke: COL.board, 'stroke-width': 3 }, g), { x: rest(s)[0], y: rest(s)[1], o: 0 });
  gr.go = (tok, k, t, dt) => {
    const e = gr.ed[k].pe, to = M.ed[k].to, L = e.getTotalLength(), P0 = e.getPointAtLength(0);
    gr.hot(k, t, t + dt * .85); tw(tok, { x: P0.x, y: P0.y }, t, dt * .15);
    prog(v => { const Q = e.getPointAtLength(v * L); put(tok, { x: Q.x, y: Q.y }); }, t + dt * .15, dt * .55);
    tw(tok, { x: rest(to)[0], y: rest(to)[1] }, t + dt * .7, dt * .15);
  };
  return gr;
};
const aPOS = [[240, 430], [700, 430]];
// Recompensas de una trayectoria como barras: marco = recompensa r, relleno = γ^t · r (bs.disc encoge el relleno). Verde hacia arriba, rojo hacia abajo.
// Debajo, filas t, r y γ^t. bs.show(k, t) muestra el paso k; bs.col[k] = grupo del paso; bs.cx(k) = su centro.
const aBars = (p, tr, x0, yb, { n = 10, dx = 62, sc = 46, bw = 40, rows = [96, 134, 172], gam = aGAM, dots = true, heads = true, t0 = .4 } = {}) => {
  const bs = { col: [], fill: [], gk: [], cx: k => x0 + k * dx }, g0 = G(p, { o: 0 }); show(g0, t0);
  mk('path', { d: `M${x0 - 34} ${yb}H${x0 + (n - 1) * dx + 34}`, stroke: COL.faint, 'stroke-width': 2 }, g0);
  if (heads) [['t', COL.dim], ['r', HUE.rew]].forEach(([s, c], i) => aTx(g0, s, x0 - 50, yb + rows[i], null, { size: 24, fill: c, anchor: 'end', weight: 600 }));
  bs.gh = aTx(p, 'γ^{t}', x0 - 50, yb + rows[2], null, { size: 24, fill: HUE.pr, anchor: 'end', weight: 600 }); put(bs.gh, { o: 0 });
  if (dots) T(g0, '…', { x: x0 + n * dx - 14, y: yb + rows[0], size: 26, fill: COL.dim, anchor: 'middle' });
  tr.slice(0, n).forEach((x, k) => {
    const g = G(p, { o: 0 }), cx = bs.cx(k), h = Math.abs(x.r) * sc, y = x.r > 0 ? yb - h : yb, c = x.r < 0 ? HUE.neg : HUE.rew;
    if (x.r) { bs.fill[k] = mk('rect', { x: cx - bw / 2, y, width: bw, height: h, fill: c }, g); mk('rect', { x: cx - bw / 2, y, width: bw, height: h, fill: 'none', stroke: c, 'stroke-width': 2 }, g); }
    else mk('path', { d: `M${cx - bw / 2} ${yb}h${bw}`, stroke: HUE.rew, 'stroke-width': 4 }, g);
    T(g, String(k), { x: cx, y: yb + rows[0], size: 24, fill: COL.dim, anchor: 'middle', font: MATH });
    T(g, aN(x.r), { x: cx, y: yb + rows[1], size: 26, fill: c, anchor: 'middle', font: MATH, weight: 700 });
    bs.gk[k] = T(p, aF(gam ** k).replace(/\.?0+$/, ''), { x: cx, y: yb + rows[2], size: 22, fill: HUE.pr, anchor: 'middle', font: MATH, weight: 600, o: 0 });
    bs.col[k] = g;
  });
  bs.show = (k, t) => show(bs.col[k], t, .3);
  bs.disc = t => { show(bs.gh, t, .4); tr.slice(0, n).forEach((x, k) => { const h = Math.abs(x.r) * sc * gam ** k; show(bs.gk[k], t + k * .1, .3); if (x.r) tw(bs.fill[k], { a_height: h, ...(x.r > 0 ? { a_y: yb - h } : {}) }, t + .3 + k * .1, .7); }); };
  return bs;
};
// Gráfica de un promedio acumulado (variante del aPlot del cap. 16): eje horizontal = número de trayectorias. ch.live(avg, col) devuelve n => traza hasta la trayectoria n.
const aPlot = (p, x0, y0, w, h, { t0 = .4, nmax, v0, v1, yt = [], xt = [] } = {}) => {
  const CX = n => x0 + n / nmax * w, VY = v => y0 - (Math.min(v1, Math.max(v0, v)) - v0) / (v1 - v0) * h, g = G(p, { o: 0 }), ch = { CX, VY, g };
  mk('path', { d: `M${x0} ${y0 - h - 12}V${y0}H${x0 + w + 10}`, stroke: COL.faint, 'stroke-width': 2, fill: 'none' }, g);
  yt.forEach(v => { mk('path', { d: `M${x0 - 8} ${VY(v)}h8`, stroke: COL.faint, 'stroke-width': 2 }, g); T(g, String(v), { x: x0 - 16, y: VY(v) + 8, size: 22, fill: COL.dim, anchor: 'end', font: MATH }); });
  xt.forEach(n => { mk('path', { d: `M${CX(n)} ${y0}v8`, stroke: COL.faint, 'stroke-width': 2 }, g); T(g, String(n), { x: CX(n), y: y0 + 32, size: 22, fill: COL.dim, anchor: 'middle', font: MATH }); });
  T(g, 'trayectorias', { x: x0 + w, y: y0 + 64, size: 22, fill: COL.dim, anchor: 'end' });
  const idx = []; for (let n = 1; n <= nmax; n += n < 40 ? 1 : n < 400 ? 4 : 20) idx.push(n);
  ch.live = (avg, col) => { const e = mk('path', { fill: 'none', stroke: col, 'stroke-width': 4, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, g); return n => e.setAttribute('d', idx.filter(i => i <= n).map((i, j) => `${j ? 'L' : 'M'}${CX(i).toFixed(1)} ${VY(avg[i - 1]).toFixed(1)}`).join('')); };
  show(g, t0);
  return ch;
};
// Matriz chica entre corchetes: filas de números. Devuelve el ancho.
const aMat = (p, rows, x, y, col, { cw = 62, rh = 40, size = 26 } = {}) => {
  const w = rows[0].length * cw, h = rows.length * rh;
  mk('path', { d: `M${x + 8} ${y}h-8v${h}h8M${x + w + 8} ${y}h8v${h}h-8`, stroke: COL.chalk, 'stroke-width': 2, fill: 'none' }, p);
  rows.forEach((r, i) => r.forEach((v, j) => T(p, aN(v), { x: x + 8 + j * cw + cw / 2, y: y + i * rh + rh * .72, size, fill: col, anchor: 'middle', font: MATH, weight: 600 })));
  return w + 16;
};
// Barra horizontal de un valor Q: rótulo, barra violeta y número. parts = piezas del rótulo (aRow).
const aHBar = (p, parts, x, xb, y, v, t0, { sc = 62, col = HUE.val } = {}) => {
  const g = G(p, { o: 0 }); aRow(g, parts, x, y, null, { size: 26, weight: 600 });
  const r = mk('rect', { x: xb, y: y - 22, width: 0, height: 28, fill: col }, g);
  aTx(g, aF(v), xb + v * sc + 14, y, null, { size: 26, fill: col, weight: 700 });
  show(g, t0, .4); tw(r, { a_width: v * sc }, t0 + .2, .7, out);

      if (i) aTx(gt, '≤', RX + 280, 530 + i * 46, null, { size: 26, fill: COL.dim, anchor: 'middle' });
      aTx(gt, r[2], RX + 370, 530 + i * 46, null, { size: i ? 28 : 26, fill: HUE.val, anchor: 'middle', weight: 700 });
    });
    aST.forEach((_, s) => gr.setV(s, aF(aV2[s]), tn + 3 + s * 1.6));
  }],

  ['opt', 'Política óptima', (m) => {
    const p = panel(0), td = m('def'), tc = m('cond'), tk = m('chk'), te = m('ex'), ts = m('star'), tnl = m('nl'), XB = 1200, ok = aOpt(aPI2);
    aNote(p, 'condición (17.2) comprobada en la página para π′ · ecuaciones (17.4) del libro · cómo resolverlas: capítulo 34');
    aTitle(p, 'Política óptima: la condición de Bellman');
    const gr = aGraph(p, aMDP, aPOS, { t0: .3, vals: true }); gr.pol(aPI2, null);
    aST.forEach((_, s) => gr.setV(s, aF(aV2[s]), null));
    aRow(p, [['Definición 17.4', COL.dim, UI, 22], [':  ', COL.chalk, UI, 22], ['π^{*}', HUE.act], [' óptima si  ', COL.chalk, UI, 24], ['V_{π*}(s) ≥ V_{π}(s)', HUE.val]], RX, 214, td, { size: 28, weight: 600 });
    aTx(p, 'para toda política π y todo estado s', RX, 254, td + 2, { size: 24, fill: COL.dim, font: UI });
    aHBar(p, [['Q_{π′}', HUE.val, MATH, 28], ['(otro, ', COL.chalk, UI], ['recoger', HUE.act, UI], [')', COL.chalk, UI]], RX, XB, 340, aQ2[0], tk + 2);
    aHBar(p, [['Q_{π′}', HUE.val, MATH, 28], ['(otro, ', COL.chalk, UI], ['llevar', COL.chalk, UI], [')', COL.chalk, UI]], RX, XB, 396, aQ2[1], tk + 4.5);
    aRow(p, [['π′', HUE.act, MATH, 30], [ok ? '  cumple la condición:  es óptima' : '  no cumple la condición', ok ? COL.good : COL.bad, UI]], RX, 470, tk + 8, { size: 26, weight: 700 });
    aST.forEach((_, s) => { tw(gr.ring[s], { c_stroke: ok ? COL.good : COL.bad }, tk + 8.2, .3); tw(gr.ring[s], { c_stroke: COL.chalk }, tk + 10, .6); });
    aRow(p, [['Teorema 17.7', HUE.act, UI], [':   π es óptima  ⟺  toda acción a que elige en s está en  ', COL.chalk, UI], ['argmax_{a′} Q_{π}(s, a′)', HUE.val, MATH, 28]], 100, 700, tc, { size: 24, weight: 600 });
    aRow(p, [['Teorema 17.8', HUE.act, UI], [':   todo MDP finito admite una política óptima determinista', COL.chalk, UI]], 100, 750, te, { size: 24, weight: 600 });
    aRow(p, [['V^{*}(s)', HUE.val], ['  =  max_{a} { ', COL.chalk], ['E[r(s, a)]', HUE.rew], ['  +  ', COL.chalk], ['γ', HUE.pr], [' ∑_{s′} ', COL.chalk], ['P[s′ | s, a]', HUE.pr], [' V^{*}(s′)', HUE.val], [' }', COL.chalk], ['      (17.4)', COL.dim, UI, 22]], 100, 808, ts, { size: 30, weight: 600 });
    aRow(p, [['no lineal', COL.bad, UI], [':  por el máximo', COL.chalk, UI]], 1180, 808, tnl, { size: 24, weight: 600 });
  }],

  ['wrap', 'Resumen', (m) => {
    const p = panel(0);
    [['Un MDP:  estados, acciones, probabilidades de transición y recompensas.', 'w1'], ['Una política elige la acción en cada estado;  su valor es el retorno descontado esperado.', 'w2'],
      ['Ecuaciones de Bellman:  ese valor es la solución única de un sistema lineal.', 'w3'], ['Una política es óptima si y solo si cada acción que elige maximiza su función Q.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 240 + i * 130, o: 0 });
      mk('circle', { cx: 160, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 160, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      aTx(g, str, 220, 0, null, { size: 26, weight: 600, font: UI });
      tw(g, { o: 1, x: 0 }, m(mark), .6);

  }],

  ['final1', 'Práctica del capítulo', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-vf', prompt: ['Sobre este capítulo: ¿verdadero o falso?'],
    build: grid([
      { parts: ['En el aprendizaje por refuerzo, el agente recibe una muestra etiquetada antes de actuar.'], ans: ['f'], why: 'No recibe un conjunto etiquetado: reúne información al actuar.' },
      { parts: ['En un MDP, la probabilidad de transición depende solo del estado actual y de la acción, no de la historia.'], ans: ['v'], why: 'Por eso el modelo es de Markov.' },
      { parts: ['Con descuento menor que 1, una recompensa tardía pesa menos que la misma recompensa recibida antes.'], ans: ['v'], why: 'La recompensa del paso t se multiplica por el descuento elevado a t.' },
      { parts: ['El valor de una política dada se obtiene resolviendo un sistema de ecuaciones lineales.'], ans: ['v'], why: 'Son las ecuaciones de Bellman de la proposición 17.9, con solución única (teorema 17.10).' },
      { parts: ['Las ecuaciones de Bellman para los valores de la política óptima también son lineales.'], ans: ['f'], why: 'Las ecuaciones (17.4) llevan un máximo sobre las acciones: no son lineales.' },
    ], [['v', 'verdadero', COL.real], ['f', 'falso', COL.task]], { multi: false, text: true }),
  }], done, 'Práctica del capítulo   1 de 2') }],

  ['final2', 'Práctica del capítulo', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-descuento', prompt: ['Una política recibe recompensa 1 en cada paso, sin fin, con factor de descuento 0.5. ¿Cuál es su valor?'],
    build: choice([['1'], ['1.5'], ['2'], ['no está definido: la suma es infinita']], 2,
      'El valor V cumple V = 1 + 0.5 · V, así que V = 2. Es la suma 1 + 0.5 + 0.25 + …',
      ['Esa es solo la primera recompensa. Faltan las siguientes, cada una multiplicada por su potencia de 0.5.', 'Son solo los dos primeros términos: 1 + 0.5. La suma sigue con 0.25, 0.125, …', null, 'Con descuento menor que 1 la suma converge: los términos se achican como una progresión geométrica.']),
  }], done, 'Práctica del capítulo   2 de 2') }],

  ['finish', 'Fin', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));
