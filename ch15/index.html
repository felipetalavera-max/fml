/* aMATH:begin — cuentas del capítulo, sin dibujo (se prueban aparte con Node) */
// --- La muestra del cap. 14: 10 puntos ilustrativos en un marco de 10 × 8. [x1, x2, etiqueta].
const aW = 10, aH = 8;
const aP = [[1.2, 6.8, 1], [1.4, 2.6, 1], [3.2, 4.4, 1], [4.6, 3.4, 1], [6.6, 4.2, 1], [5.2, 1.4, 1], [2.6, 6, -1], [4.2, 7, -1], [9.2, 2.8, -1], [8.6, 1.2, -1]];

// --- Stumps y AdaBoost, tal como en el cap. 14 (figura 7.1): h(x) = s si x_c < th, y −s si no.

const aDst = aP.map((q, i) => { const k = aTypes.findIndex(t => t.idx.includes(i)); return aRowG.q[k] / aTypes[k].idx.length; });   // D*(i): la masa de cada fila distinta, repartida por igual entre sus puntos
const aColSum = aBase.map((h, t) => aP.reduce((s, q, i) => s + aDst[i] * aMat[i][t], 0));   // ∑_i D*(i) M_it = 2 γ_t(D*) (7.20)

// Gráfica del margen mínimo por ronda (de la ronda aT a la aTmax, eje vertical de 0 a vmax). mc.upTo(r) dibuja la línea hasta la ronda r.
