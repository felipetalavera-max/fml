// Varias piezas de aTx en una línea, cada una con su color; t0 puede ser una lista con un instante por pieza.
const aRow = (p, parts, x, y, t0, opts = {}) => { const xs = [], els = parts.map(([str, fill], k) => { xs.push(x); const e = aTx(p, str, x, y, Array.isArray(t0) ? t0[k] : t0, { ...opts, fill: fill || COL.chalk }); x += e.getComputedTextLength(); return e; }); els.xs = xs; els.end = x; return els; };
const aNum = v => (v < 0 ? '−' : '') + Math.abs(v);
const aF2 = v => { const s = v.toFixed(2); return /^-0\.00$/.test(s) ? '0.00' : s.replace('-', '−'); };

const aHue = v => v > 0 ? HUE.pos : v < 0 ? HUE.neg : HUE.un;                      // etiqueta +1 = salmón, −1 = azul, sin etiqueta = gris
const aTitle = (p, str) => text(p, str, 100, 130, .3, { size: 30, fill: COL.task, weight: 600 });
const aHalo = e => { [['stroke', COL.board], ['stroke-width', 7], ['paint-order', 'stroke'], ['stroke-linejoin', 'round']].forEach(([k, v]) => e.setAttribute(k, v)); return e; };   // borde del color de la pizarra: el texto se lee sobre líneas
const aArrow = (p, x1, y1, x2, y2, col = COL.dim, w = 4) => {

/* aMATH:begin — cuentas del capítulo, sin dibujo (se prueban aparte con Node) */
const aDp = (a, b) => a[0] * b[0] + a[1] * b[1];

const aGauss = (x, y, s = 1) => Math.exp(-(Math.pow(x[0] - y[0], 2) + Math.pow(x[1] - y[1], 2)) / (2 * s * s));
const aGc = 7, aGt = 8;                                                            // beat «ejemplos»: el punto x y el punto x′ que se sigue
const aDist = aC.map(p => Math.hypot(p[0] - aC[aGc][0], p[1] - aC[aGc][1]));

const aCsP = [[0, 1], [1, 4], [2, 3]];                                             // pares del beat «props» (Cauchy-Schwarz)

const aM0 = [[aG[1][1], aG[1][4]], [aG[4][1], aG[4][4]]], aOff = Math.ceil(Math.sqrt(aM0[0][0] * aM0[1][1])) + 4;

const aQ2 = [aM1, aM0, aM2], aQ2r = 1, aM0e = aEig(aM0).val, aM1q = aQuad(aM1, [1, -1]);

const aK1 = (u, v, s = 1) => Math.exp(-(u - v) * (u - v) / (2 * s * s));
const aU = 3.5, aV = 5, aHx = [2, 5, 7.5], aHa = [.9, .5, .7];
const aHf = u => aHx.reduce((s, x, i) => s + aHa[i] * aK1(x, u), 0);                // h = Σ a_i K(x_i, ·)

const aL = 3.2;                                                                    // medio lado del piso de la muestra «círculo»

  const n = aN2(th); let k0 = -Infinity, k1 = Infinity;

// Vista del plano con una tercera coordenada (proyección paralela): psi gira el piso, phi lo inclina (0 = visto desde arriba), lift ∈ [0, 1] sube los puntos.
const aView = (cx, cy, sc, zs = .42) => {
  const v = { psi: 0, phi: 0, lift: 0, sc };
  v.pt = (x, y, z = 0) => { const c = Math.cos(v.psi), s = Math.sin(v.psi); return [cx + sc * (x * c - y * s), cy - sc * ((x * s + y * c) * Math.cos(v.phi) + z * zs * Math.sin(v.phi))]; };
  v.s = (x, y, z) => v.pt(x, y, z).map(n => n.toFixed(1)).join(' ');
  return v;
};
const aTilt = v => { v.psi = aDeg(28); v.phi = aDeg(62); };
// La muestra «círculo» en esa vista: piso, curvas de nivel de la altura x1² + x2² (c3.gh), recta en el piso (c3.lg), círculo en el piso (c3.cg),
// plano de altura aZ0 (c3.pg) y un tallo por punto. c3.redraw() vuelve a proyectar todo; los puntos de clase −1 se dibujan bajo el plano y los de +1 sobre él.
const aCloud3 = (p, v, pts, { t0 = .4 } = {}) => {

// Plano visto desde arriba, centrado en el origen: marco, ejes con rótulo (opcional), una recta recortada al marco (f.lg, oculta) y puntos.
const aFlat = (p, cx, cy, sc, L, { t0 = .4, ax = null } = {}) => {

// Tabla de celdas con su número: el brillo de cada celda sigue al valor absoluto (rosa si es negativo). gr.set(A) la rellena; gr.box(i, j, …) enmarca una celda.
