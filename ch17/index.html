// ch.line(vals, col, t, dur, { dash, from, dots }) traza vals[from … ]; ch.fn(f, col, t, dur, { dash }) traza y = f(k); ch.live(vals, col) devuelve r => dibuja hasta r.
const aPlot = (p, x0, y0, w, h, { t0 = .4, tmax = 10, v0 = 0, v1 = 1, yt = [], xt = [], xlab = 'ronda' } = {}) => {
  const CX = t => x0 + t / tmax * w, VY = v => y0 - (v - v0) / (v1 - v0) * h, g = G(p, { o: t0 == null ? 1 : 0 }), ch = { CX, VY, g };
  mk('path', { d: `M${x0} ${y0 - h - 12}V${y0}H${x0 + w + 10}`, stroke: COL.faint, 'stroke-width': 2, fill: 'none' }, g);
  yt.forEach(([v, s]) => { mk('path', { d: `M${x0 - 8} ${VY(v)}h8`, stroke: COL.faint, 'stroke-width': 2 }, g); T(g, s, { x: x0 - 16, y: VY(v) + 8, size: 22, fill: COL.dim, anchor: 'end', font: MATH }); });
  xt.forEach(t => { mk('path', { d: `M${CX(t)} ${y0}v8`, stroke: COL.faint, 'stroke-width': 2 }, g); T(g, String(t), { x: CX(t), y: y0 + 32, size: 22, fill: COL.dim, anchor: 'middle', font: MATH }); });
  T(g, xlab, { x: x0 + w + 10, y: y0 + 62, size: 22, fill: COL.dim, anchor: 'end' });
  const dOf = (vals, from, upto) => { let d = ''; const n = Math.min(vals.length - 1, Math.floor(upto + 1e-9)); for (let t = from; t <= n; t++) d += (t > from ? 'L' : 'M') + CX(t).toFixed(1) + ' ' + VY(vals[t]).toFixed(1); return d; };
  ch.line = (vals, col, tt, dur, { dash = null, from = 0, sw = 4, dots = false } = {}) => {
    const d = dOf(vals, from, vals.length - 1);
    let e;
    if (dash) { e = put(mk('path', { d, fill: 'none', stroke: col, 'stroke-width': sw, 'stroke-dasharray': dash }, p), { o: 0 }); show(e, tt, dur); }
    else { e = path(p, d, { stroke: col, 'stroke-width': sw, 'stroke-linejoin': 'round' }, { d: 0 }); draw(e, tt, dur); }
    if (dots) vals.forEach((v, t) => { if (t >= from) show(put(mk('circle', { cx: CX(t), cy: VY(v), r: 6, fill: col }, p), { o: 0 }), tt + dur * (t - from) / Math.max(1, vals.length - 1 - from), .25); });
    return e;
  };
  ch.fn = (f, col, tt, dur, { dash = '10 8', sw = 3 } = {}) => { let d = ''; for (let k = 0; k <= tmax * 8; k++) d += (k ? 'L' : 'M') + CX(k / 8).toFixed(1) + ' ' + VY(f(k / 8)).toFixed(1); const e = put(mk('path', { d, fill: 'none', stroke: col, 'stroke-width': sw, 'stroke-dasharray': dash }, p), { o: 0 }); show(e, tt, dur); return e; };
  if (t0 != null) show(g, t0);

};

  ['nosep', 'El caso no separable', (m) => {

  ['dual', 'Forma dual y kernels', (m) => {

  ['winnow', 'El algoritmo Winnow', (m) => {
    const p = panel(0), tw_ = m('w'), tp = m('pred'), tu = m('upd'), tr = m('run'), tc = m('cnt'), tt = m('thm'), tx = m('cmp'), BX = 150, CW = 26, BY = 500, HS = 800, RX = 1030, TY = 760;
    aNote(p, `datos ilustrativos: ${aWT} rondas sorteadas con semilla fija; y = signo de la suma de las 3 relevantes · figura 8.10 con η = ρ_{∞}/r_{∞}^{2} = ${aF2(aEta)} · logaritmo natural`);
    aTitle(p, 'Winnow: actualización multiplicativa');
    const gb = G(p, { o: 0 }); show(gb, .4);
    aTx(gb, 'pesos w_{t,i} (positivos, suman 1)', BX, 196, null, { size: 22, fill: COL.dim, font: UI });
    mk('path', { d: `M${BX - 6} ${BY}H${BX + aWN * CW + 2}`, stroke: COL.faint, 'stroke-width': 2 }, gb);

      bars.forEach((b, i) => { const v = q.w[i] + (q.wn[i] - q.w[i]) * u, h = Math.min(300, v * HS); b.setAttribute('height', h.toFixed(1)); b.setAttribute('y', (BY - h).toFixed(1)); });
      aRel.forEach((i, j) => { const v = q.w[i] + (q.wn[i] - q.w[i]) * u; nums[j].textContent = aF2(v); nums[j].setAttribute('y', (BY - Math.min(300, v * HS) - 10).toFixed(1)); });
      cells.forEach((c, i) => { c.tx.textContent = x[i] > 0 ? '+' : '−'; c.bg.setAttribute('fill', x[i] * y > 0 ? COL.good : COL.bad); c.bg.setAttribute('fill-opacity', seen ? (x[i] * y > 0 ? .2 : .42) : 0); });
      info._set(`ronda ${k + 1} de ${aWT}      y_{t} = ${y > 0 ? '+1' : '−1'}      ${seen ? (q.upd ? 'falla' : 'acierta') : '…'}      actualizaciones: ${rr >= aWT ? q.M : q.M - (q.upd && u < 1 ? 1 : 0)}`);
    };
    setR(0);
    prog(q => setR(.5 * q), tp + .4, 2.4, lin);                    // ronda 1: llega x, falla
    prog(q => setR(.5 + .5 * q), tu + 2.6, 3.4, lin);              // los pesos se multiplican
    prog(q => setR(1 + 7 * q), tu + 7, tr - tu - 7.6, lin);

    aTx(gA, 'ŷ_{t}  =  sgn(w_{t} · x_{t})', RX, 334, tp, { size: 28, weight: 600 });
    aTx(gA, 'si falla, cada peso:', RX, 410, tu, { size: 24, fill: COL.dim, font: UI });
    aTx(gA, 'w_{t+1,i}  =  w_{t,i} exp(η y_{t} x_{t,i}) / Z_{t}', RX, 462, tu + .6, { size: 28, weight: 600, fill: HUE.w });
    aTx(gA, 'Z_{t}: normaliza, para que sumen 1', RX, 506, tu + 9, { size: 22, fill: COL.dim, font: UI });
    hide(gA, tt - .5, .4);
    text(p, 'Teorema 8.13', RX, 262, tt, { size: 26, fill: HUE.hyp, weight: 600 });
    aTx(p, 'M   ≤   2 (r_{∞}^{2}/ρ_{∞}^{2}) log N', RX, 326, tt + .6, { size: 34, weight: 600 });
    aTx(p, 'r_{∞}: radio en norma ∞   ·   ρ_{∞}: margen en norma 1', RX, 378, tt + 3, { size: 22, fill: COL.dim, font: UI });
    aTx(p, 'solución rala (pocas relevantes):  Winnow', RX, 470, tx + 4.4, { size: 26, font: UI, weight: 600 });
    aTx(p, 'solución no rala:  Perceptron', RX, 520, tx + 9, { size: 26, font: UI, weight: 600 });
    // la comparación sobre la misma secuencia
    const C = [BX, BX + 330, BX + 560, BX + 700];
    const gh = G(p, { o: 0 }); show(gh, tc, .4);
    T(gh, `actualizaciones en ${aWT} rondas`, { x: C[1] + 30, y: TY - 46, size: 22, fill: COL.dim, anchor: 'middle' }); T(gh, 'cota', { x: C[2] + 30, y: TY - 46, size: 22, fill: COL.dim, anchor: 'middle' });
    [['Winnow', aWinM, aBw, `2 (r_{∞}^{2}/ρ_{∞}^{2}) log N        r_{∞} = ${aNum(aRinf)},   ρ_{∞} = ${aF2(aRhoInf)}`, HUE.w, tc, tx], ['Perceptron', aPwM, aBp, `r^{2}/ρ^{2}        r^{2} = N = ${aNum(aRw2 * aRw2)},   ρ^{2} = ${aF2(aRhoW2 * aRhoW2)}        (teorema 8.8)`, HUE.hyp, tc + 2.6, tx + 1.6]].forEach(([nm, mm, bb, fm, col, ta, tb], j) => {
      const y = TY + j * 48;
      text(p, nm, C[0], y, ta, { size: 28, fill: col, weight: 600 });
      aTx(p, String(mm), C[1] + 30, y, ta, { size: 30, weight: 700, anchor: 'middle', fill: col });

    });
  }],
