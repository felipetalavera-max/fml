      show(br, tsv + .2 * r); tw(br, { a_width: L * U, c_fill: HUE.loss }, tbr + .2 * r, .8); hide(n1, tbr + .2 * r, .2);
      aTx(p, String(L), BX + L * U + 12, RY(r), tbr + .7 + .2 * r, { size: 26, weight: 700, fill: HUE.loss });
    });
    aTx(p, 'L(y_{i}, y):  etiquetas en que y difiere de la correcta', LX, RY(3) + 6, tm3, { size: 22, fill: COL.dim, font: UI });
    aTx(p, 'salidas en cadena o en árbol, y pérdida que se', LX, 690, tpl, { size: 24, font: UI, weight: 600 }); aTx(p, 'descompone igual:  M^{3}N, en tiempo polinomial', LX, 726, tpl, { size: 24, font: UI, weight: 600 });
    // derecha: el mismo problema, con cuatro términos distintos
    aTx(p, 'min_{w}    ½ ‖w‖^{2}   +   C ∑_{i} ( término del ejemplo i )', RX, 268, .5, { size: 28, weight: 600 });
    aTx(p, 'Δ_{i}(y)   =   w · [ Φ(x_{i}, y_{i})  −  Φ(x_{i}, y) ]', RX, 322, tsv - 1.6, { size: 24, fill: COL.dim });
    [['SVM multiclase', '(9.21)', [['max_{y}  max( 0,   '], ['1', COL.chalk], ['  −  Δ_{i}(y) )']], tsv, 'el punto de partida (cap. 19)'],
      ['M^{3}N', '(9.22)', [['max_{y}  max( 0,   '], ['L(y_{i}, y)', HUE.loss], ['  −  Δ_{i}(y) )']], tm3, 'redes de Markov de margen máximo'],
      ['SVMStruct', '(9.23)', [['max_{y}  '], ['L(y_{i}, y)', HUE.loss], ['  max( 0,   1  −  Δ_{i}(y) )']], tst, 'SVM estructural'],
      ['CRF', '(9.24)', [['log ∑_{y}  exp( '], ['L(y_{i}, y)', HUE.loss], ['  −  Δ_{i}(y) )']], tcr, 'campos aleatorios condicionales']].forEach(([nm, eq, parts, t0, full], r) => {
      const y = 410 + r * 98, g = G(p, { o: 0 }); show(g, t0);
      aTx(g, nm, RX, y, null, { size: 26, font: UI, weight: 700, fill: r ? HUE.hyp : COL.chalk });
      aTx(g, full, RX, y + 32, null, { size: 22, fill: COL.dim, font: UI });
      aRow(g, parts, RX + 230, y, null, { size: 28, weight: 600 }); aTx(g, eq, 1570, y, null, { size: 22, fill: COL.dim, font: UI, anchor: 'end' });
    });
  }],

  ['wrap', 'Resumen', (m) => {
    const p = panel(0);
    [['OVA:  k clasificadores; gana la mayor puntuación, sin garantía de calibración.', 'w1'], ['OVO:  k(k − 1)/2 clasificadores, uno por par de clases; se decide por votos.', 'w2'],
      ['ECOC:  una palabra de código por clase; gana la más cercana en Hamming.', 'w3'], ['Predicción estructurada:  factores locales y programación dinámica.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 240 + i * 130, o: 0 });
      mk('circle', { cx: 160, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 160, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      aTx(g, str, 220, 0, null, { size: 30, weight: 600, font: UI });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Práctica del capítulo', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-vf', prompt: ['Sobre este capítulo: ¿verdadero o falso?'],
    build: grid([
      { parts: ['Con k clases, OVA entrena k clasificadores binarios; OVO, k(k\u00a0−\u00a01)/2.'], ans: ['v'], why: 'Uno por clase, frente a uno por cada par de clases.' },
      { parts: ['Las puntuaciones de los clasificadores de OVA son siempre comparables entre sí.'], ans: ['f'], why: 'Se aprenden por separado: es el problema de calibración.' },
      { parts: ['Con ECOC se predice la clase cuya palabra queda a menor distancia de Hamming.'], ans: ['v'], why: 'Es la regla (9.18): la fila más cercana a la palabra recibida.' },
      { parts: ['Un código con distancia mínima 4 entre sus palabras corrige hasta 2 errores binarios.'], ans: ['f'], why: `La parte entera de (4 − 1)/2 es ${aCorr(4)}: corrige un solo error.` },
      { parts: [`Con ${aNt} etiquetas y ${aN} palabras, Viterbi puntúa las ${aNseq(aN)} secuencias una por una.`], ans: ['f'], why: `Avanza columna por columna: le bastan ${aVit.ops} sumas.` },
    ], [['v', 'verdadero', COL.real], ['f', 'falso', COL.task]], { multi: false, text: true }),
  }], done, 'Práctica del capítulo   1 de 1') }],

  ['finish', 'Fin', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
