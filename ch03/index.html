<script src="audio/es/timings.js"></script>
<script>
'use strict';
const CHAPTER = { number: 3, title: 'Garantías con hipótesis finitas', minutes: 7, language: 'es', next: '../ch04/' };

/* ---------- helpers de dibujo del capítulo ---------- */
const HUE = { pos: COL.nat, neg: COL.whole, hyp: COL.task, err: COL.bad, band: COL.real };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500, font = UI } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, font, o: 0 }); show(e, t0); return e; };
// Texto con subíndices y superíndices: 'R(h_{S}) ≤ 4e^{−mε/4}'. Con t0 = null queda visible desde el inicio.
const aTx = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500, font = MATH } = {}) => {
  const e = T(p, '', { x, y, size, fill, anchor, weight, font, o: t0 == null ? 1 : 0 });
  let prev = 0;
  str.split(/([_^]\{[^}]*\})/).forEach(s => {
    if (!s) return;
    const k = /^[_^]\{/.test(s) ? (s[0] === '_' ? 1 : -1) : 0, dy = k > 0 ? size * .22 : k < 0 ? -size * .38 : 0;
    mk('tspan', { dy: dy - prev, ...(k ? { 'font-size': size * .68 } : {}) }, e).textContent = k ? s.slice(2, -1) : s;
    prev = dy;
  });
  if (t0 != null) show(e, t0);
  return e;
};
const aRng = seed => () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const aFmt = v => v.toFixed(2);
const aNum = v => v < 1e9 ? String(v).replace(/\B(?=(\d{3})+$)/g, ' ') : `≈ ${(v / 10 ** Math.floor(Math.log10(v))).toFixed(1)} × 10^{${Math.floor(Math.log10(v))}}`;
const aSwatch = (p, x, y, fill, t0) => show(put(mk('rect', { x, y: y - 20, width: 26, height: 22, fill, 'fill-opacity': .6 }, p), { o: 0 }), t0);
const aFall = (d, t0) => { const y = st(d).y; put(d, { y: y - 46 }); tw(d, { o: 1, y }, t0, .45, out); };   // un punto de la muestra que cae
const aBar = (p, x, y, w, t0, fill = COL.chalk) => { const e = put(mk('rect', { x, y: y - 20, width: 0, height: 22, fill, 'fill-opacity': .8 }, p), {}); tw(e, { a_width: w }, t0, .7, out); return e; };
const aNote = (p, str = 'datos ilustrativos · D uniforme sobre [0, 1]') => text(p, str, 1570, 884, .4, { size: 22, fill: COL.dim, anchor: 'end' });

// Segmento X = [0, 1] con D uniforme (ilustrativa). H: 50 umbrales t = k/50; h_k(x) = 1 si x ≥ k/50.
// Todo se cuenta en cincuentavos para que los errores sean exactos.
const aK = 50, aKC = 23, aEK = 5, aEPS = aEK / aK, aDELTA = .05;                 // el concepto c es el umbral 23/50; ε = 0.1
const aX0 = 100, aXW = 760, aPX = t => aX0 + t * aXW;
const aAY = 250, aAT = 170, aAB = 330, aBY = 640, aBS = 380;                    // eje, extremos de las líneas de umbral, base y escala de las barras
const aKs = Array.from({ length: aK }, (_, i) => i + 1);
const aPred = (k, x) => x >= k / aK ? 1 : 0;
const aLab = x => aPred(aKC, x);
const aSamp = (seed, m, lab) => { const r = aRng(seed); return Array.from({ length: m }, () => { const x = r(); return [x, lab(x)]; }); };
const aCons = pts => aKs.filter(k => pts.every(([x, l]) => aPred(k, x) === l));    // umbrales consistentes con la muestra
const aRk = k => Math.abs(k - aKC) / aK;                                        // R(h_k) exacto con D uniforme
const aBadK = k => Math.abs(k - aKC) > aEK;                                     // R(h_k) > ε
const aNeedC = (logH, e, d) => Math.ceil((logH + Math.log(1 / d)) / e);         // m ≥ (1/ε)(log|H| + log(1/δ)), ecuación (2.8)
const aS = aSamp(12, 70, aLab), aS10 = aS.slice(0, 10);
const aC10 = aCons(aS10), aC70 = aCons(aS), aBad10 = aC10.filter(aBadK), aBad70 = aC70.filter(aBadK);
const aMC = aNeedC(Math.log(aK), aEPS, aDELTA);                                 // tamaño que da la cota: 70, el de la muestra aS
const aKB = aBad10[0], aKill = aS.findIndex(([x, l]) => aPred(aKB, x) !== l);   // una hipótesis mala que sobrevive a 10 puntos y el punto que la delata

const aDot = (p, x, lab, r = 9, y = aAY, o = 0) => put(mk('circle', { r, fill: lab ? HUE.pos : HUE.neg }, p), { x: aPX(x), y, o });
const aAxis = (p, y, t0) => {
  const g = G(p, { o: 0 });
  mk('path', { d: `M${aPX(0)} ${y}H${aPX(1)}`, stroke: COL.dim, 'stroke-width': 3 }, g);
  T(g, '0', { x: aPX(0) - 14, y: y + 9, size: 24, fill: COL.dim, anchor: 'end', font: MATH }); T(g, '1', { x: aPX(1) + 14, y: y + 9, size: 24, fill: COL.dim, font: MATH });
  show(g, t0); return g;
};
const aHyp = (p, k, o = 0, y0 = aAT, y1 = aAB) => put(mk('path', { d: `M${aPX(k / aK)} ${y0}V${y1}`, stroke: HUE.hyp, 'stroke-width': 3 }, p), { o });
const aBarV = (p, k, t0, o, fill = COL.dim) => { const hh = aRk(k) * aBS, e = put(mk('rect', { x: aPX(k / aK) - 4, y: aBY, width: 8, height: 0, fill }, p), { o }); tw(e, { a_y: aBY - hh, a_height: hh }, t0, .6, out); return e; };
const aEpsLine = (p, t0) => show(put(mk('path', { d: `M${aPX(0) - 10} ${aBY - aEPS * aBS}H${aPX(1) + 10}`, stroke: COL.chalk, 'stroke-width': 2, 'stroke-dasharray': '10 8' }, p), { o: 0 }), t0);
const aDim = .13;                                                                // opacidad de un umbral descartado

// Caso inconsistente: el concepto vale 1 en [0.46, 0.7) y en [0.8, 1]; ningún umbral lo reproduce.
const aUnit = u => (u >= 23 && u < 35) || u >= 40 ? 1 : 0;                      // etiqueta en el cincuentavo u
const aLab2 = x => aUnit(Math.floor(x * aK));
const aR2 = k => { let e = 0; for (let u = 0; u < aK; u++) if ((u >= k ? 1 : 0) !== aUnit(u)) e++; return e / aK; };   // R(h_k) exacto
const aT = aSamp(8, 800, aLab2), aMs = [50, 200, 800];
const aEmp = (k, m) => aT.slice(0, m).filter(([x, l]) => aPred(k, x) !== l).length / m;                     // error empírico
const aGap = m => Math.sqrt((Math.log(aK) + Math.log(2 / aDELTA)) / (2 * m));                              // término del teorema 2.13
const aCY = v => aBY - 400 * v;                                                 // escala vertical de la gráfica de errores
const aInBand = aMs.map(m => aKs.filter(k => Math.abs(aEmp(k, m) - aR2(k)) <= aGap(m)).length);
const aPick = [12, 23, 40];                                                     // hipótesis marcadas en la comprobación 2

// Conjunciones de literales: muestra de la figura 2.4 del libro (n = 6).
const aEx = [['011011', 1], ['011111', 1], ['001101', 0], ['011111', 1], ['100110', 0], ['010011', 1]], aN = 6;
const aConj = (() => {
  const alive = Array.from({ length: aN }, () => [true, true]), steps = [];        // por variable: [x_i, negación de x_i]
  aEx.forEach(([bits, lab], r) => {
    if (!lab) return;
    const kills = [];
    [...bits].forEach((b, i) => { const j = b === '1' ? 1 : 0; if (alive[i][j]) { alive[i][j] = false; kills.push([i, j]); } });   // bit 1 descarta la negación; bit 0, la variable
    steps.push({ r, kills });
  });
  const lits = []; alive.forEach((a, i) => a.forEach((on, j) => { if (on) lits.push([i, j]); }));
  return { steps, lits };
})();
const aSat = (bits, lits) => lits.every(([i, neg]) => (bits[i] === '1') !== !!neg);
const aConjOK = aEx.filter(([bits, lab]) => aSat(bits, aConj.lits) === !!lab).length;                          // ejemplos bien clasificados por h_S
const aCX = i => 150 + i * 84, aRY = r => 215 + r * 52;
const aLit = (p, i, neg, x, y, { size = 30, fill = COL.chalk, o = 1 } = {}) => {   // literal x_i, con barra si está negado
  const g = G(p, { x, y, o });
  aTx(g, `x_{${i + 1}}`, 0, 0, null, { size, fill, anchor: 'middle' });
  if (neg) mk('path', { d: `M${-size * .52} ${-size * .68}h${size * .52}`, stroke: fill, 'stroke-width': 2.5 }, g);
  return g;
};
const aChip = (p, i, neg, x, y, o = 1) => { const g = G(p, { x, y, o }); mk('rect', { x: -34, y: -36, width: 68, height: 52, fill: 'none', stroke: COL.faint, 'stroke-width': 2 }, g); aLit(g, i, neg, 0, 0); return g; };
const aNewEx = '010101';                                                        // ejemplo positivo de la comprobación 1 (inventado)

// Escenario estocástico (ilustrativo): P[1|x] sube de a a 1 − a entre x1 y x2. Con a = 0 y x1 = x2 es determinista.
const aPY = v => 560 - 300 * v;
const aDet = [0, aKC / aK, aKC / aK], aSto = [.1, .26, .66];
const aP1 = (x, [a, x1, x2]) => x < x1 ? a : x >= x2 ? 1 - a : a + (1 - 2 * a) * (x - x1) / (x2 - x1);
const aCurve = ([a, x1, x2], flip) => { const v = u => aPY(flip ? 1 - u : u); return `M${aPX(0)} ${v(a)}L${aPX(x1)} ${v(a)}L${aPX(x2)} ${v(1 - a)}L${aPX(1)} ${v(1 - a)}`; };
const aBayes = (() => { let s = 0; const n = 20000; for (let i = 0; i < n; i++) { const q = aP1((i + .5) / n, aSto); s += Math.min(q, 1 - q); } return s / n; })();   // R* = E[ruido(x)] con D uniforme
const aU = (() => { const r = aRng(31); return Array.from({ length: 40 }, () => { const x = r(), u = r(); return [x, aLab(x), u < aP1(x, aSto) ? 1 : 0]; }); })();   // puntos con etiqueta determinista y estocástica

/* ---------- beats: [id, título, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Inicio', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Unidad 1 · Capítulo 3', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Garantías con hipótesis finitas', { x: 800, y: 430, size: 80, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'Cuando las hipótesis se pueden contar, contarlas basta para obtener una garantía.', 800, 600, m('sub'), { size: 34, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],

  ['consistente', 'Cincuenta umbrales', (m) => {
    const p = panel(0), th = m('hyps'), tc = m('c'), tm = m('more'), kd = 32;
    aNote(p);
    const sh = G(p, { o: 0 });                                                 // un umbral de muestra: 0 a su izquierda, 1 a su derecha
    mk('rect', { x: aPX(0), y: aAT, width: aPX(kd / aK) - aPX(0), height: aAB - aAT, fill: HUE.neg, 'fill-opacity': .22 }, sh);
    mk('rect', { x: aPX(kd / aK), y: aAT, width: aPX(1) - aPX(kd / aK), height: aAB - aAT, fill: HUE.pos, 'fill-opacity': .22 }, sh);
    T(sh, '0', { x: (aPX(0) + aPX(kd / aK)) / 2, y: aAT - 16, size: 44, fill: HUE.neg, anchor: 'middle', weight: 700 });
    T(sh, '1', { x: (aPX(kd / aK) + aPX(1)) / 2, y: aAT - 16, size: 44, fill: HUE.pos, anchor: 'middle', weight: 700 });
    show(sh, th + 3.4); hide(sh, tc - .5, .4);
    aAxis(p, aAY, .2);
    text(p, 'X: el segmento [0, 1]', aX0, 110, m('line'), { size: 26, fill: COL.dim });
    const lines = {}, bars = {};
    aKs.forEach((k, i) => { lines[k] = aHyp(p, k); tw(lines[k], { o: .6 }, th + i * .03, .3); });
    tw(lines[kd], { o: 1, 'a_stroke-width': 6 }, th + 3.4, .3); tw(lines[kd], { o: .6, 'a_stroke-width': 3 }, tc - .5, .4);
    tw(lines[aKC], { o: 1, 'a_stroke-width': 6, c_stroke: COL.chalk }, tc, .5);
    text(p, 'c', aPX(aKC / aK), aAT - 14, tc, { size: 34, font: MATH, weight: 600, anchor: 'middle' });
    const dots = aS.map(([x, l], i) => aDot(p, x, l, i < 10 ? 9 : 5));
    dots.slice(0, 10).forEach((d, i) => aFall(d, m('sample') + i * .12));
    aKs.filter(k => !aC10.includes(k)).forEach(k => tw(lines[k], { o: aDim }, m('cross') + Math.abs(k - aKC) * .03, .4));
    aC10.filter(k => k !== aKC).forEach(k => { tw(lines[k], { o: 1, 'a_stroke-width': 6 }, m('left'), .25, out); tw(lines[k], { 'a_stroke-width': 3 }, m('left', .3), .5); });
    aKs.forEach((k, i) => { bars[k] = aBarV(p, k, m('bars') + i * .015, aC10.includes(k) ? 1 : .25); tw(bars[k], { c_fill: aBadK(k) ? COL.bad : COL.good }, m('eps'), .4); });
    text(p, 'error de generalización R(h) de cada umbral', aX0, 404, m('bars'), { size: 22, fill: COL.dim });
    aEpsLine(p, m('eps')); aTx(p, 'ε', aPX(1) + 18, aBY - aEPS * aBS + 8, m('eps'), { size: 28 });
    aBad10.forEach(k => tw(lines[k], { c_stroke: COL.bad, 'a_stroke-width': 6 }, m('bad'), .3));
    dots.slice(10).forEach((d, i) => aFall(d, tm + i * .012));
    aC10.filter(k => !aC70.includes(k)).forEach(k => { tw(lines[k], { o: aDim }, tm + 1, .5); tw(bars[k], { o: .25 }, tm + 1, .5); });
    text(p, `H: ${aK} umbrales`, 940, 150, th, { size: 32, fill: COL.task, weight: 600 });
    text(p, 'cada uno: 1 a su derecha, 0 a su izquierda', 940, 188, th + 3.4, { size: 22, fill: COL.dim });
    aTx(p, 'c ∈ H: el concepto es uno de ellos', 940, 250, tc, { size: 26 });
    aTx(p, 'Consistente con S:  R̂_{S}(h) = 0', 940, 320, m('cross'), { size: 26 });
    text(p, `m = ${aS10.length}:  ${aC10.length} umbrales consistentes`, 940, 366, m('left'), { size: 26, weight: 600 });
    aTx(p, 'el algoritmo devuelve uno de ellos: h_{S}', 940, 402, m('left', 5), { size: 24, fill: COL.dim });
    aTx(p, `ε = ${aEPS}`, 940, 480, m('eps'), { size: 36, fill: COL.task, weight: 600 });
    aSwatch(p, 1110, 478, COL.bad, m('eps')); aTx(p, 'malo: R(h) > ε', 1146, 478, m('eps'), { size: 24 });
    aSwatch(p, 1350, 478, COL.good, m('eps')); aTx(p, 'bueno: R(h) ≤ ε', 1386, 478, m('eps'), { size: 24 });
    text(p, `m = ${aS10.length}:  sobreviven ${aBad10.length} umbrales malos`, 940, 550, m('bad'), { size: 26, fill: COL.bad, weight: 600 });
    text(p, `m = ${aS.length}:  ${aC70.length} consistentes, ${aBad70.length} malos`, 940, 600, tm + 1.2, { size: 26, fill: COL.good, weight: 600 });
    text(p, 'Con suficientes puntos, toda hipótesis consistente es buena. ¿Cuántos bastan?', 800, 790, tm + 2, { size: 30, fill: COL.task, anchor: 'middle', weight: 600 });
  }],

  ['cota', 'La cota de la unión', (m) => {
    const p = panel(0), ts = m('surv'), tn = m('num'), mid = aCons(aS.slice(0, aKill + 1)), tk = ts + .3 + (aKill - 10) * .6 + .5;
    aNote(p);
    const gap = put(mk('rect', { x: aPX(Math.min(aKB, aKC) / aK), y: aAT, width: Math.abs(aKC - aKB) / aK * aXW, height: aAB - aAT, fill: COL.bad, 'fill-opacity': .35 }, p), { o: 0 });
    show(gap, m('gap')); hide(gap, tk + .3);
    aAxis(p, aAY, .2);
    const lines = {}, bars = {};
    aKs.forEach(k => {
      lines[k] = aHyp(p, k); tw(lines[k], { o: k === aKC ? 1 : aC10.includes(k) ? .6 : aDim }, .2, .3);
      bars[k] = aBarV(p, k, .2, aC10.includes(k) ? 1 : .25, aBadK(k) ? COL.bad : COL.good);
    });
    lines[aKC].setAttribute('stroke', COL.chalk); lines[aKC].setAttribute('stroke-width', 6);
    text(p, 'c', aPX(aKC / aK), aAT - 14, .2, { size: 34, font: MATH, weight: 600, anchor: 'middle' });
    aEpsLine(p, .3); aTx(p, 'ε', aPX(1) + 18, aBY - aEPS * aBS + 8, .3, { size: 28 });
    text(p, 'error de generalización R(h) de cada umbral', aX0, 404, .3, { size: 22, fill: COL.dim });
    tw(lines[aKB], { o: 1, c_stroke: COL.bad, 'a_stroke-width': 6 }, m('one'), .4);
    const hl = text(p, 'h', aPX(aKB / aK), aAT - 14, m('one'), { size: 34, font: MATH, weight: 600, anchor: 'middle', fill: COL.bad });
    const dots = aS.map(([x, l], i) => aDot(p, x, l, i < 10 ? 9 : i <= aKill ? 8 : 5));
    dots.slice(0, 10).forEach((d, i) => show(d, .2 + i * .02, .25));
    dots.slice(10, aKill + 1).forEach((d, i) => aFall(d, ts + .3 + i * .6));
    show(put(mk('circle', { r: 19, fill: 'none', stroke: COL.bad, 'stroke-width': 4 }, p), { x: aPX(aS[aKill][0]), y: aAY, o: 0 }), tk, .25);
    aC10.filter(k => !mid.includes(k)).forEach(k => { tw(lines[k], { o: aDim, 'a_stroke-width': 3 }, tk + .3, .5); tw(bars[k], { o: .25 }, tk + .3, .5); });
    tw(hl, { o: .3 }, tk + .3, .5);
    dots.slice(aKill + 1).forEach((d, i) => aFall(d, tn + i * .012));
    mid.filter(k => !aC70.includes(k)).forEach(k => { tw(lines[k], { o: aDim }, tn + 1, .5); tw(bars[k], { o: .25 }, tn + 1, .5); });
    [text(p, 'Una hipótesis mala h', 940, 150, m('one'), { size: 32, fill: COL.task, weight: 600 }),
      aTx(p, `R(h) = ${aFmt(aRk(aKB))} > ε = ${aEPS}`, 940, 190, m('one', .6), { size: 26, fill: COL.bad }),
      text(p, 'cada punto cae en el tramo rojo con probabilidad R(h)', 940, 244, m('gap'), { size: 22 }),
      text(p, `esquivó ${aKill} puntos; el punto ${aKill + 1} la delata`, 940, 280, tk, { size: 22, fill: COL.dim })].forEach(e => tw(e, { o: .4 }, m('union', 5), .5));
    aTx(p, 'P[ R̂_{S}(h) = 0 ] ≤ (1 − ε)^{m}', 940, 340, m('pow'), { size: 32 });
    text(p, 'Para todas las malas a la vez (cota de la unión):', 940, 410, m('union'), { size: 22, fill: COL.dim });
    aTx(p, 'P[ alguna h mala es consistente ]', 940, 452, m('union', 5.5), { size: 28 });
    aTx(p, '≤ |H|(1 − ε)^{m} ≤ |H|e^{−mε}', 980, 496, m('union', 9), { size: 28 });
    aTx(p, '|H|e^{−mε} ≤ δ', 940, 560, m('delta'), { size: 28 });
    aTx(p, 'm ≥ (1/ε)( log|H| + log(1/δ) )', 940, 630, m('bound'), { size: 38, fill: COL.task, weight: 600 });
    text(p, 'teorema 2.5 del libro · log: logaritmo natural', 940, 664, m('bound', .6), { size: 22, fill: COL.dim });
    aTx(p, `|H| = ${aK},  ε = ${aEPS},  δ = ${aDELTA}   →   m ≥ ${aMC}`, 940, 724, tn, { size: 30, weight: 600 });
    text(p, 'El argumento solo usa que H es finito: no importa la forma de las hipótesis.', 800, 800, m('free'), { size: 30, fill: COL.task, anchor: 'middle', weight: 600 });
  }],

  ['conj', 'Conjunciones de literales', (m) => {
    const p = panel(0), tr = m('result'), s0 = aConj.steps[0];
    aNote(p, 'muestra de la figura 2.4 del libro');
    const hi = put(mk('rect', { x: 100, y: -36, width: 600, height: 50, fill: COL.task, 'fill-opacity': .18 }, p), { y: aRY(s0.r), o: 0 });
    show(hi, m('pos'), .3); hide(hi, m('neg'), .3);
    for (let i = 0; i < aN; i++) aTx(p, `x_{${i + 1}}`, aCX(i), 158, .3, { size: 26, fill: COL.dim, anchor: 'middle' });
    const bit = aEx.map(([bits, lab], r) => {
      const g = G(p, { o: 0 }), cells = [...bits].map((b, i) => T(g, b, { x: aCX(i), y: aRY(r), size: 34, font: MATH, anchor: 'middle' }));
      T(g, lab ? '+' : '−', { x: 660, y: aRY(r), size: 38, fill: lab ? HUE.pos : HUE.neg, anchor: 'middle', weight: 700 });
      show(g, .3 + r * .08, .3);
      if (!lab) { tw(g, { o: .35 }, m('neg'), .4); tw(g, { o: 1 }, tr + 6.3, .4); cells.forEach((c, i) => { if (aConj.lits.some(([j, neg]) => j === i && (bits[i] === '1') === !!neg)) tw(c, { c_fill: COL.bad }, tr + 6.5, .4); }); }
      return cells;

      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 260, size: 32, weight: 600 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Práctica del capítulo', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-casos', prompt: ['H es finito. ¿De qué garantía se habla en cada frase: la del caso consistente, la del inconsistente, o de ambas?'],
    build: grid([
      { parts: ['La cota del error baja como ', $m('1/m'), '.'], ans: ['con'], why: 'En el caso consistente, el error es a lo sumo (1/m)(log|H| + log(1/δ)).' },
      { parts: ['La cota suma al error empírico un término que baja como ', $m('1/√m'), '.'], ans: ['inc'], why: 'Es el teorema 2.13: para la misma garantía hace falta una muestra cuadráticamente mayor.' },
      { parts: ['El tamaño de H entra como ', $m('log|H|'), '.'], ans: ['amb'], why: 'En los dos casos la cota de la unión aporta un factor |H|, que al despejar queda dentro de un logaritmo.' },
      { parts: ['Supone que el algoritmo devuelve una hipótesis sin errores en la muestra.'], ans: ['con'], why: 'Eso es ser consistente; la cota del caso inconsistente vale para toda hipótesis de H.' },
    ], [['con', 'consistente', COL.good], ['inc', 'inconsistente', COL.task], ['amb', 'ambas', COL.real]], { multi: false, text: true }),
  }], done, 'Práctica del capítulo   1 de 2') }],

  ['final2', 'Práctica del capítulo', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-bayes', prompt: ['En un problema estocástico el error de Bayes es ', $m('R* = 0.18'), '. Con una muestra tan grande como se quiera, ¿qué error de generalización puede alcanzar la mejor hipótesis posible?'],
    build: choice([['0: con suficientes datos, el error desaparece.'], ['0.18: ninguna hipótesis baja del error de Bayes.'], ['0.09: el ruido se reparte entre las dos etiquetas.']], 1,
      'El error de Bayes es el ínfimo del error sobre todas las hipótesis. Lo alcanza el clasificador de Bayes, que predice la etiqueta más probable en cada punto.',
      ['Eso solo pasa en el escenario determinista, donde R* = 0. Aquí la etiqueta es aleatoria y más datos no quitan el ruido.', null, 'El error de Bayes ya es el mínimo posible: el promedio de min{P[1|x], P[0|x]}.']),
  }], done, 'Práctica del capítulo   2 de 2') }],

  ['finish', 'Fin', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
