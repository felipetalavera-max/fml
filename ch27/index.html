/* ---------- helpers de dibujo del capítulo (los genéricos, copiados del cap. 26) ---------- */
// salmón = clase 1 o +1 · azul = clase 2 o −1 · verde menta = clase 3 · ámbar = el modelo: p_w, sus pesos, la frontera y lo que se elige ·
// violeta = la restricción (λ), la regularización y los términos de complejidad · rojo = error o restricción que no se cumple. No se usa verde para aciertos.
const HUE = { c: [COL.nat, COL.whole, COL.irr], pos: COL.nat, neg: COL.whole, hyp: COL.task, cx: COL.real, bad: COL.bad };
const aHue = y => HUE.c[y], aHue2 = v => v > 0 ? HUE.pos : HUE.neg;
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500, font = UI } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, font, o: 0 }); show(e, t0); return e; };
// Texto con subíndices y superíndices: 'p_{w}', 'D^{m}'. Con t0 = null queda visible desde el inicio. e._set(str) lo reescribe. No anida llaves.
const aSYM = /([αβεγδηθφρσλμξΦΨΓΠΛΩΣΔ‖ℜℝ√∑∏⟹⟺⟷≈∼∞⊤†∈∃→←↦′″⌊⌋½∇∝])/;                                // símbolos que van siempre en la fuente matemática
const aFill = (e, str, size, font) => {

    if (!s) return;

    prev = dy;
  });
};
const aTx = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500, font = MATH } = {}) => {
  const e = T(p, '', { x, y, size, fill, anchor, weight, font, o: t0 == null ? 1 : 0 });
  aFill(e, str, size, font); e._set = s => aFill(e, s, size, font);
  if (t0 != null) show(e, t0);

};
// Varias piezas de aTx en una línea: [texto, color, fuente, tamaño]; t0 puede ser una lista con un instante por pieza.
const aRow = (p, parts, x, y, t0, opts = {}) => { const xs = [], els = parts.map(([str, fill, font, size], k) => { xs.push(x); const e = aTx(p, str, x, y, Array.isArray(t0) ? t0[k] : t0, { ...opts, fill: fill || COL.chalk, ...(font ? { font } : {}), ...(size ? { size } : {}) }); x += e.getComputedTextLength(); return e; }); els.xs = xs; els.end = x; return els; };
const aNote = (p, str) => aTx(p, str, 1570, 884, .4, { size: 22, fill: COL.dim, anchor: 'end', font: UI });
const aTitle = (p, str) => text(p, str, 100, 130, .3, { size: 30, fill: COL.task, weight: 600 });
const aSq = (p, x, y, col, lab, { line = false, dash = null, dot = false } = {}) => { mk(line ? 'path' : dot ? 'circle' : 'rect', line ? { d: `M${x} ${y - 8}h30`, stroke: col, 'stroke-width': 4, fill: 'none', ...(dash ? { 'stroke-dasharray': dash } : {}) } : dot ? { cx: x + 15, cy: y - 8, r: 9, fill: col } : { x: x + 6, y: y - 17, width: 18, height: 18, fill: col }, p); return aTx(p, lab, x + 42, y, null, { size: 22, fill: COL.dim, font: UI }); };   // entrada de leyenda
const aSetA = (e, o) => { Object.entries(o).forEach(([k, v]) => e.setAttribute(k, typeof v === 'number' ? v.toFixed(1) : v)); return e; };
const aHalo = e => { [['stroke', COL.board], ['stroke-width', 7], ['paint-order', 'stroke'], ['stroke-linejoin', 'round']].forEach(([k, v]) => e.setAttribute(k, v)); return e; };   // borde del color de la pizarra: el texto se lee sobre líneas

/* aMATH:begin — cuentas del capítulo, sin dibujo (se prueban aparte con Node) */
const aSum = v => v.reduce((s, u) => s + u, 0);
const aDot = (u, v) => u.reduce((s, a, i) => s + a * v[i], 0);
const aArg = v => v.reduce((b, u, i) => u > v[b] ? i : b, 0);
const aN1 = w => aSum(w.map(Math.abs)), aN2q = w => aSum(w.map(v => v * v)), aNul = w => w.filter(v => v === 0).length;
const aSoft = s => { const mx = Math.max(...s), e = s.map(v => Math.exp(v - mx)), z = aSum(e); return e.map(v => v / z); };   // exponencial y normalización
const aLam = .05;                                                                        // el λ de todo el capítulo
// Residuo de optimalidad de min_w λ‖w‖₁ + L(w) (o λ‖w‖₂² + L(w)), con g = ∇L(w): el subgradiente de menor norma, coordenada por coordenada.
// L1: g_j + λ sgn(w_j) si w_j ≠ 0; lo que |g_j| sobresale de λ si w_j = 0. L2: g_j + 2λ w_j.
const aRes = (w, g, lam, l2) => Math.max(...w.map((v, j) => Math.abs(l2 ? g[j] + 2 * lam * v : v !== 0 ? g[j] + lam * Math.sign(v) : Math.max(0, Math.abs(g[j]) - lam))));
// Descenso de gradiente con paso fijo eta desde w = 0, hasta que el residuo baja de tol. Con L1, cada paso termina con el umbral suave (gradiente proximal).
// path guarda algunos iterados [t, w] (índices en progresión geométrica) y el último.
const aProx = (gf, n, lam, eta, { l2 = false, tol = 1e-11, max = 400000 } = {}) => {
  let w = Array(n).fill(0), it = 0, res = Infinity, next = 1; const path = [[0, w]];
  for (; it < max; it++) {
    const g = gf(w);
    res = aRes(w, g, lam, l2);
    if (res < tol) break;
    w = l2 ? w.map((v, j) => v - eta * (g[j] + 2 * lam * v)) : w.map((v, j) => { const u = v - eta * g[j]; return Math.abs(u) <= eta * lam ? 0 : u - Math.sign(u) * eta * lam; });
    if (it + 1 === next) { path.push([it + 1, w]); next = Math.max(next + 1, Math.ceil(next * 1.15)); }
  }
  if (path[path.length - 1][0] !== it) path.push([it, w]);
  return { w, it, res, path };
};
// Estado en la fracción q (0 a 1) de un recorrido guardado: interpola entre iterados vecinos.
const aAtQ = (path, q) => { const u = Math.max(0, Math.min(1, q)) * (path.length - 1), k = Math.min(path.length - 2, Math.floor(u)), f = u - k, a = path[k], b = path[k + 1]; return { t: Math.round(a[0] + (b[0] - a[0]) * f), w: a[1].map((v, j) => v + (b[1][j] - v) * f) }; };

// --- Tres clases: la muestra del cap. 19, 18 puntos ilustrativos en un marco de 10 × 8. [x1, x2, clase], con las clases 0, 1, 2 (en pantalla: 1, 2, 3).
const aW = 10, aH = 8, aKc = 3;
const aP = [[1, 1.6, 0], [1.8, 3.4, 0], [2.6, .9, 0], [3.2, 2.4, 0], [4.2, 3.6, 0], [3.9, 1.3, 0], [7.6, 2.3, 0],
  [6.2, 1, 1], [6.6, 3.3, 1], [8.6, 1.2, 1], [9, 3, 1], [8.3, 3.9, 1], [6.9, .8, 1],
  [1.6, 6.6, 2], [3.4, 5.6, 2], [4.8, 7, 2], [6.2, 6, 2], [8.2, 6.8, 2]];
const aM = aP.length;
// Características por clase (§13.5.2): Φ(x, y) tiene c bloques y solo el de la clase y es no nulo e igual a Γ(x). Aquí Γ(x) = (x1 − 5, x2 − 4, 1): N = 9.
// w se guarda como un vector de 9 pesos, w = (w_1, w_2, w_3); aBlk lo parte en sus tres bloques. w · Φ(x, y) = w_y · Γ(x).
const aNw = 9, aGam = q => [q[0] - aW / 2, q[1] - aH / 2, 1];
const aBlk = w => [0, 1, 2].map(y => w.slice(3 * y, 3 * y + 3));
const aSc = (w, q) => { const f = aGam(q); return aBlk(w).map(b => aDot(b, f)); };       // las tres puntuaciones w · Φ(x, y)
const aPr = (w, q) => aSoft(aSc(w, q));                                                  // p_w[·|x] (13.9)
// Pérdida logarítmica media: −(1/m) Σ log p_w[y_i|x_i] = (1/m) Σ log Σ_y exp(w·Φ(x_i, y) − w·Φ(x_i, y_i)), el segundo término de (13.10).
const aNll = (w, pts = aP) => -aSum(pts.map(q => Math.log(aPr(w, q)[q[2]]))) / pts.length;
// Su gradiente es la diferencia de promedios de la restricción (13.2): E_{x∼D̂₁, y∼p_w[·|x]}[Φ(x, y)] − E_{(x,y)∼D̂}[Φ(x, y)], coordenada por coordenada.
const aDev = (w, pts = aP) => { const g = Array(aNw).fill(0); pts.forEach(q => { const pr = aPr(w, q), f = aGam(q); for (let y = 0; y < aKc; y++) for (let j = 0; j < 3; j++) g[3 * y + j] += (pr[y] - (q[2] === y ? 1 : 0)) * f[j] / pts.length; }); return g; };
const aDevMax = w => Math.max(...aDev(w).map(Math.abs));                                // la norma infinito de esa diferencia
const aEntC = w => aSum(aP.map(q => -aSum(aPr(w, q).map(v => v > 0 ? v * Math.log(v) : 0)))) / aM;   // entropía condicional respecto de D̂₁
const aJ3 = (w, lam = aLam) => lam * aN1(w) + aNll(w);                                   // el objetivo (13.10)
const aErr3 = w => aP.filter(q => aArg(aSc(w, q)) !== q[2]).length;                      // errores de la predicción (13.13) en la muestra
// Paso: 1/L con L ≥ ½ max‖Γ(x)‖² en el marco (la hessiana de log Σ exp tiene valores propios ≤ ½).
const aL3 = (aW * aW / 4 + aH * aH / 4 + 1) / 2;
const aRun = aProx(aDev, aNw, aLam, 1 / aL3), aWs = aRun.w;                               // solución L1 de (13.10)
const aRun2 = aProx(aDev, aNw, aLam, 1 / (aL3 + 2 * aLam), { l2: true }), aW2s = aRun2.w; // solución con λ‖w‖₂² (§13.8)
const aZ0 = Array(aNw).fill(0), aDev0 = aDevMax(aZ0), aDevS = aDevMax(aWs), aEnt0 = aEntC(aZ0), aEntS = aEntC(aWs);
const aGap = aEntS - aJ3(aWs);                                                           // dualidad (teorema 13.1): con previa uniforme, H̄(p*) = λ‖ŵ‖₁ + pérdida
// Punto de prueba que se pasea por el plano (beat del problema) y dos puntos de la muestra para ver exponencial y normalización.
const aTour = [[2, 1.5], [5.4, 2], [4.9, 3.9]], aShowI = [3, 16];
// Comprobación 1: tres puntos y sus puntuaciones; la mayor probabilidad de la clase 1 no está donde su puntuación es mayor.
const aQ1 = [[0, 4.5], [5, 2], [2, 1]], aQ1s = aQ1.map(q => aSc(aWs, q)), aQ1p = aQ1.map(q => aPr(aWs, q)[0]), aQ1r = aArg(aQ1p), aQ1top = aArg(aQ1s.map(s => s[0]));
// Cotas (§13.6): de qué depende el término de complejidad. Teorema 13.2: factor c. Teorema 13.3: c √(2 log(2cN)).
const aCs = [3, 6, 12], aNs = [9, 900, 90000], aLogT = (c, n) => Math.sqrt(2 * Math.log(2 * c * n));
const aRatC = aCs.map(c => c / aCs[0]), aRatN = aNs.map(n => aLogT(aKc, n) / aLogT(aKc, aNs[0]));

// --- Dos clases: la muestra no separable del cap. 10, 14 puntos ilustrativos en un marco de 10.5 × 8. [x1, x2, etiqueta ±1].
const aBW = 10.5, aBH = 8;
const aB = [[5, 6, 1], [9.5, 5.5, 1], [3, 6.5, 1], [9.5, 2.5, 1], [6.5, 7, 1], [6.5, 5.5, 1], [1, 4.5, -1], [1.5, 2.5, -1], [7.5, .5, -1], [2.5, 4.5, -1], [4, 3, -1], [6.5, 1.5, -1], [1, 5.5, 1], [7.5, 3.5, -1]];
const aMb = aB.length;
// Ψ(x) = Φ(x, +1) − Φ(x, −1) (§13.7.1). Aquí Ψ(x) = (x1 − 5.25, x2 − 4, 1).
const aPsi = q => [q[0] - aBW / 2, q[1] - aBH / 2, 1];
const aU = (w, q) => aDot(w, aPsi(q));                                                   // la puntuación w · Ψ(x)
const aSig = u => 1 / (1 + Math.exp(-u));                                                // función logística (figura 13.1)
const aLg = u => Math.log(1 + Math.exp(-u)), aLg2 = u => Math.log2(1 + Math.exp(-u));    // pérdida logística, natural y en base 2
const aLossB = w => aSum(aB.map(q => aLg(q[2] * aU(w, q)))) / aMb;                       // el segundo término de (13.16)
const aGrB = w => { const g = [0, 0, 0]; aB.forEach(q => { const f = aPsi(q), s = aSig(-q[2] * aU(w, q)); f.forEach((v, j) => g[j] -= q[2] * v * s / aMb); }); return g; };
const aJB = (w, lam = aLam) => lam * aN1(w) + aLossB(w);                                 // el objetivo (13.16)
const aErrB = w => aB.filter(q => q[2] * aU(w, q) <= 0).length;
const aLB = (aBW * aBW / 4 + aBH * aBH / 4 + 1) / 4;                                     // L ≥ ¼ max‖Ψ(x)‖²
const aRunB = aProx(aGrB, 3, aLam, 1 / aLB), aWb = aRunB.w;                              // regresión logística con L1 (13.16)
const aUs = aB.map(q => q[2] * aU(aWb, q));                                              // y_i · w · Ψ(x_i) en la solución
const aLossB0 = aLossB([0, 0, 0]), aLossBs = aLossB(aWb);
// Comprobación 2: tres puntos de la muestra: uno bien clasificado y cerca de la recta, el de peor puntuación, y el más lejano bien clasificado.
const aIdxB = aB.map((_, i) => i);
const aQ2 = [aIdxB.filter(i => aUs[i] >= .5).reduce((b, i) => aUs[i] < aUs[b] ? i : b), aIdxB.reduce((b, i) => aUs[i] < aUs[b] ? i : b), aIdxB.reduce((b, i) => aUs[i] > aUs[b] ? i : b)];
const aQ2l = aQ2.map(i => aLg(aUs[i])), aQ2r = aArg(aQ2l);
const aF1 = v => String(Math.round(v * 10) / 10).replace('-', '−');
const aF2 = v => (Math.abs(v) < .005 ? 0 : v).toFixed(2).replace('-', '−');
const aF3 = v => (Math.abs(v) < .0005 ? 0 : v).toFixed(3).replace('-', '−');
const aVec = w => '( ' + w.map(v => v === 0 ? '0' : aF2(v)).join(',  ') + ' )';
const aInt = n => String(n).replace(/\B(?=(\d{3})+$)/g, ' ');
/* aMATH:end */

// Región del argmax de la clase y (cap. 19): el marco recortado por los semiplanos w_y · Γ(x) ≥ w_l · Γ(x). Devuelve el polígono; aInner, sus lados interiores.
const aClip = (poly, a, b, c) => { const res = [], v = q => a * q[0] + b * q[1] + c; poly.forEach((p0, i) => { const q = poly[(i + 1) % poly.length], vp = v(p0), vq = v(q); if (vp >= 0) res.push(p0); if ((vp >= 0) !== (vq >= 0)) { const t = vp / (vp - vq); res.push([p0[0] + t * (q[0] - p0[0]), p0[1] + t * (q[1] - p0[1])]); } }); return res; };
const aRegion = (Wb, y) => Wb.reduce((poly, w, l) => l === y ? poly : aClip(poly, Wb[y][0] - w[0], Wb[y][1] - w[1], (Wb[y][2] - w[2]) - (Wb[y][0] - w[0]) * aW / 2 - (Wb[y][1] - w[1]) * aH / 2), [[0, 0], [aW, 0], [aW, aH], [0, aH]]);
const aInner = poly => poly.map((p0, i) => [p0, poly[(i + 1) % poly.length]]).filter(([a, b]) => !((Math.abs(a[0] - b[0]) < 1e-9 && (a[0] < 1e-9 || a[0] > aW - 1e-9)) || (Math.abs(a[1] - b[1]) < 1e-9 && (a[1] < 1e-9 || a[1] > aH - 1e-9))));

let aClipN = 0;
// Plano de tres clases (cap. 19), en un marco de aW × aH. pl.bg = regiones, pl.lg = fronteras, pl.dg = puntos, pl.tg = marcas sobre los puntos.
const aPl3 = (p, ox, oy, sc, { t0 = .4, ax = true, r = sc > 50 ? 11 : 6 } = {}) => {
  const X = x => ox + x * sc, Y = y => oy - y * sc, g = G(p, { o: t0 == null ? 1 : 0 }), pl = { X, Y, sc, g };
  pl.bg = G(g);
  mk('rect', { x: ox, y: oy - aH * sc, width: aW * sc, height: aH * sc, fill: 'none', stroke: COL.faint, 'stroke-width': 2 }, g);
  if (ax) { aTx(g, 'x_{1}', X(aW), Y(0) + 28, null, { size: 22, fill: COL.dim, anchor: 'end' }); aTx(g, 'x_{2}', X(0) - 12, Y(aH) + 20, null, { size: 22, fill: COL.dim, anchor: 'end' }); }
  pl.lg = G(g); pl.dg = G(g); pl.tg = G(g);
  pl.dots = aP.map(q => put(mk('circle', { r, fill: aHue(q[2]), stroke: COL.board, 'stroke-width': 2 }, pl.dg), { x: X(q[0]), y: Y(q[1]) }));
  if (t0 != null) show(g, t0);
  return pl;
};
const aLeg = (p, x, y, t0 = .5) => { const g = G(p, { o: 0 }); [0, 1, 2].forEach(l => aSq(g, x + l * 150, y, aHue(l), `clase ${l + 1}`, { dot: true })); show(g, t0); return g; };   // leyenda de las tres clases
// Regiones de la predicción argmax_y w_y · Γ(x), redibujables: rg.set(bloques). Cada región con el color de su clase; las fronteras, en ámbar. Con w = 0 no dibuja nada.
const aRegs = (pl, { tint = .2, sw = 4 } = {}) => {
  const fs = [0, 1, 2].map(y => mk('path', { fill: aHue(y), 'fill-opacity': tint }, pl.bg)), bd = mk('path', { stroke: HUE.hyp, 'stroke-width': sw, 'stroke-linecap': 'round', fill: 'none' }, pl.lg);
  const pt = q => pl.X(q[0]).toFixed(1) + ' ' + pl.Y(q[1]).toFixed(1);
  const set = Wb => { const zero = Wb.every(w => w.every(v => v === 0)); let d = ''; Wb.forEach((_, y) => { const poly = zero ? [] : aRegion(Wb, y); fs[y].setAttribute('d', poly.length < 3 ? '' : 'M' + poly.map(pt).join('L') + 'Z'); if (poly.length >= 3) aInner(poly).forEach(([a, b]) => { d += `M${pt(a)}L${pt(b)}`; }); }); bd.setAttribute('d', d); };
  return { fs, bd, set };
};
// Tres barras, una por clase, sobre una línea de base: hacia arriba si el valor es positivo y hacia abajo si es negativo, con su número.
// bs.set(v, u): fija los valores, con u pixeles por unidad · labs: rótulo de cada barra, a labY bajo la base.
const aBarsV = (p, x0, y0, { bw = 60, gap = 24, u = 100, size = 24, labs = null, labY = 36, t0 = null } = {}) => {
  const g = G(p, { o: t0 == null ? 1 : 0 }), bx = l => x0 + l * (bw + gap), xe = bx(aKc - 1) + bw;
  mk('path', { d: `M${x0 - 12} ${y0}H${xe + 12}`, stroke: COL.dim, 'stroke-width': 2 }, g);
  const rs = [0, 1, 2].map(l => mk('rect', { x: bx(l), y: y0, width: bw, height: 0, fill: aHue(l) }, g));
  const ns = [0, 1, 2].map(l => aTx(g, '', bx(l) + bw / 2, y0, null, { size, anchor: 'middle', weight: 600 }));
  if (labs) labs.forEach((s, l) => aTx(g, s, bx(l) + bw / 2, y0 + labY, null, { size: 22, fill: aHue(l), anchor: 'middle' }));
  if (t0 != null) show(g, t0);
  return { g, bx, xe, set: (v, uu = u, fmt = aF2) => v.forEach((s, l) => { const hh = Math.abs(s) * uu; aSetA(rs[l], { y: s >= 0 ? y0 - hh : y0, height: hh }); ns[l]._set(fmt(s)); put(ns[l], { y: s >= 0 ? y0 - hh - 10 : y0 + hh + size + 2 }); }) };
};
// Una distribución chica por punto de la muestra: tres barras angostas y, arriba, un punto del color de la clase verdadera. Una fila por clase.
// mn.dots = los puntos (visibles desde el inicio), mn.cells = los recuadros con sus barras (ocultos). mn.set(lista de distribuciones).
const aMinis = (p, x0, y0, { dx = 80, dy = 150, u = 100, bw = 16 } = {}) => {
  const seen = [0, 0, 0], mn = { dots: [], cells: [], bars: [] };
  aP.forEach(q => {
    const k = q[2], x = x0 + (seen[k]++) * dx, y = y0 + k * dy, g = G(p, { o: 0 });
    mn.dots.push(mk('circle', { cx: x + 28, cy: y - u - 18, r: 8, fill: aHue(k) }, p));
    mk('rect', { x: x - 6, y: y - u - 4, width: 68, height: u + 4, fill: 'none', stroke: COL.faint, 'stroke-width': 2 }, g);
    mn.bars.push([0, 1, 2].map(l => mk('rect', { x: x + l * (bw + 4), width: bw, fill: aHue(l) }, g)));
