<script>
'use strict';
const CHAPTER = { number: 6, title: 'Cotas inferiores', minutes: 6, language: 'es', next: '../ch07/' };

/* ---------- helpers de dibujo del capítulo (copiados del cap. 5) ---------- */
const HUE = { pos: COL.nat, neg: COL.whole, hyp: COL.task, rad: COL.real, low: COL.bad };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500, font = UI } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, font, o: 0 }); show(e, t0); return e; };
// Texto con subíndices y superíndices: 'R_{D}(h_{S})'. Con t0 = null queda visible desde el inicio.
const aTx = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500, font = MATH } = {}) => {
  const e = T(p, '', { x, y, size, fill, anchor, weight, font, o: t0 == null ? 1 : 0 });
  let prev = 0;
  str.split(/([_^]\{[^}]*\})/).forEach(s => {
    if (!s) return;
    const k = /^[_^]\{/.test(s) ? (s[0] === '_' ? 1 : -1) : 0, dy = k > 0 ? size * .22 : k < 0 ? -size * .38 : 0;
    mk('tspan', { dy: dy - prev, ...(k ? { 'font-size': size * .68 } : {}) }, e).textContent = k ? s.slice(2, -1) : s;
    prev = dy;
  });
  if (t0 != null) show(e, t0);
  return e;
};
const aFmt = v => v.toFixed(2).replace('-', '−');
const aN = v => String(+v.toFixed(4));                                             // número sin ceros de más
const aBar = (p, x, y, w, t0, fill = COL.chalk) => { const e = put(mk('rect', { x, y: y - 20, width: 0, height: 22, fill, 'fill-opacity': .8 }, p), {}); tw(e, { a_width: w }, t0, .7, out); return e; };
const aNote = (p, str) => text(p, str, 1570, 884, .4, { size: 22, fill: COL.dim, anchor: 'end' });
const aHue = v => v > 0 ? HUE.pos : HUE.neg;                                       // etiqueta 1 = salmón, etiqueta 0 = azul

/* aMATH:begin — cuentas del capítulo, sin dibujo (se prueban aparte con Node) */
const aRng = seed => () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const aSum = l => l.reduce((s, v) => s + v, 0);
// Cotas del capítulo.
const aLow = (d, m) => (d - 1) / (32 * m);                                         // (d − 1)/(32m), teorema 3.20
const aLowN = (d, m) => Math.sqrt(d / (320 * m));                                  // √(d/(320m)), teorema 3.23
const aVC = (m, d) => Math.sqrt(2 * d * Math.log(Math.E * m / d) / m);             // √(2d log(em/d)/m), corolario 3.19
// Caso realizable: la distribución (3.32) sobre d puntos fragmentados, con ε = (d − 1)/(32m) como en la demostración.
const aD = 9, aM = 20, aEps = aLow(aD, aM), aP0 = 1 - 8 * aEps, aPi = 8 * aEps / (aD - 1), aIdx = Array.from({ length: aD }, (_, i) => i);
const aS = (() => { const r = aRng(114); return Array.from({ length: aM }, () => { const u = r(); return u < aP0 ? 0 : Math.min(aD - 1, 1 + Math.floor((u - aP0) / aPi)); }); })();   // la muestra: índices de los puntos
const aF = (() => { const r = aRng(1114); return aIdx.map(() => r() < .5 ? 1 : 0); })();     // la función objetivo: un etiquetado cualquiera (todos están en H)
const aCnt = aIdx.map(i => aS.filter(v => v === i).length);                        // cuántas veces aparece cada punto
const aSeen = aIdx.filter(i => i && aCnt[i]), aUn = aIdx.filter(i => i && !aCnt[i]);   // puntos raros vistos y sin ver
const aExp = .5 * aUn.length * aPi;                                                // error esperado sobre los no vistos, como en (3.33)
// Dos monedas con P[1] = ½ ± α/2: distribución del número de unos y error de la mejor regla para decidir cuál se tiró.
const aAl = .2;
const aBinom = (n, q) => { const o = []; let lc = 0; for (let k = 0; k <= n; k++) { o.push(Math.exp(lc + k * Math.log(q) + (n - k) * Math.log(1 - q))); lc += Math.log(n - k) - Math.log(k + 1); } return o; };
const aBay = n => { const u = aBinom(n, .5 + aAl / 2), v = aBinom(n, .5 - aAl / 2); return aSum(u.map((x, k) => Math.min(x, v[k]))) / 2; };
const aNs = [10, 40, 160];
const aToss = (() => { const r = aRng(22); return [.5 + aAl / 2, .5 - aAl / 2].map(q => Array.from({ length: 10 }, () => r() < q ? 1 : 0)); })();
// Caso no realizable: la distribución (3.43) sobre d puntos; el voto por mayoría es un algoritmo de ejemplo.
const aD2 = 8, aM2 = 80, aI2 = Array.from({ length: aD2 }, (_, i) => i);
const aNR = (() => {
  const r = aRng(46), sg = aI2.map(() => r() < .5 ? 1 : -1), seq = [];
  for (let j = 0; j < aM2; j++) { const i = Math.floor(r() * aD2); seq.push([i, r() < .5 + sg[i] * aAl / 2 ? 1 : 0]); }
  const labs = aI2.map(i => seq.filter(e => e[0] === i).map(e => e[1])), pred = labs.map(l => 2 * aSum(l) > l.length ? 1 : 0), best = sg.map(v => v > 0 ? 1 : 0);
  return { sg, seq, labs, pred, best, wrong: aI2.filter(i => pred[i] !== best[i]) };
})();
const aExc = aAl / aD2 * aNR.wrong.length;                                         // exceso de error, (3.44)
/* aMATH:end */

const aRX = i => i ? 300 + (i - 1) * 95 : 160, aRY = 520;
// Punto que puede quedar como «moneda»: círculo con una mitad de otro color (oculta al inicio).
const aCoinPt = (p, x, y, r, fill = COL.dim) => {
  const g = G(p, { x, y }), c = mk('circle', { r, fill }, g), h = put(mk('path', { d: `M0 ${-r}A${r} ${r} 0 0 1 0 ${r}Z`, fill: HUE.neg }, g), { o: 0 });
  return { g, c, h };
};
const aCross = (p, x, y, k = 12, o = 0) => put(mk('path', { d: `M${-k} ${-k}L${k} ${k}M${k} ${-k}L${-k} ${k}`, fill: 'none', stroke: COL.bad, 'stroke-width': 5, 'stroke-linecap': 'round' }, p), { x, y, o });
// Histograma en escalones del número de unos en n tiradas, sobre el eje «fracción de unos».
const aHist = (g, pmf, x, w, base, h, max, fill) => {
  const n = pmf.length, bw = w / n; let d = `M${x} ${base}`;
  pmf.forEach((v, k) => { const y = (base - h * v / max).toFixed(1); d += `L${(x + k * bw).toFixed(1)} ${y}L${(x + (k + 1) * bw).toFixed(1)} ${y}`; });
  return mk('path', { d: d + `L${x + w} ${base}Z`, fill, 'fill-opacity': .5, stroke: fill, 'stroke-width': 2 }, g);
};

/* ---------- beats: [id, título, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Inicio', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Unidad 1 · Capítulo 6', { x: 800, y: 330, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Cotas inferiores', { x: 800, y: 430, size: 72, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'El piso: lo que ningún algoritmo de aprendizaje puede evitar.', 800, 600, m('sub'), { size: 32, fill: COL.dim, anchor: 'middle' });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8);
  }],

  ['que', 'Qué afirma una cota inferior', (m) => {
    const p = panel(0), tu = m('up'), ta = m('all'), tl = m('low'), tg = m('alg'), te = m('exist'), tf = m('floor'), AX = 180, YB = 760, YT = 300, RISE = 170;
    text(p, 'error de generalización de la hipótesis que devuelve el algoritmo', 100, 130, .3, { size: 22, fill: COL.dim });
    const ax = G(p, { o: 0 });
    mk('path', { d: `M${AX} 180V${YB}H720`, fill: 'none', stroke: COL.dim, 'stroke-width': 3 }, ax);
    T(ax, '0', { x: AX - 16, y: YB + 8, size: 24, fill: COL.dim, anchor: 'end', font: MATH });
    aTx(ax, 'R(h_{S})', AX - 14, 204, null, { size: 26, fill: COL.dim, anchor: 'end' });
    show(ax, .2);
    // el piso (rojo) sube desde el eje; el techo (violeta) baja; la hipótesis queda entre los dos
    const sh = mk('rect', { x: AX, y: YB, width: 540, height: 0, fill: HUE.low, 'fill-opacity': .22 }, p);
    const fl = G(p, { y: YB, o: 0 });
    mk('path', { d: `M${AX} 0H720`, stroke: HUE.low, 'stroke-width': 5 }, fl);
    const ce = G(p, { y: YT - 70, o: 0 });
    mk('path', { d: `M${AX} 0H720`, stroke: HUE.rad, 'stroke-width': 5 }, ce);
    T(ce, 'techo: garantía para toda D', { x: AX + 20, y: -16, size: 24, fill: HUE.rad, weight: 600 });
    tw(ce, { o: 1, y: YT }, tu, .9, out);
    const dot = G(p, { x: 450, y: YB - 60, o: 0 });
    mk('circle', { r: 16, fill: HUE.hyp }, dot); aTx(dot, 'h_{S}', 28, 9, null, { size: 28, fill: HUE.hyp });
    show(dot, .5);
    show(fl, tl, .4);
    tw(fl, { y: YB - RISE }, te, 1.4); tw(dot, { y: YB - RISE - 40 }, te, 1.4);
    prog(q => { sh.setAttribute('y', YB - RISE * q); sh.setAttribute('height', RISE * q); }, te, 1.4);
    text(p, 'piso: ningún algoritmo lo evita', AX + 20, YB - RISE + 36, te + 1.4, { size: 24, fill: HUE.low, weight: 600 });
    text(p, 'Cota superior · corolario 3.19', 800, 160, tu, { size: 30, fill: HUE.rad, weight: 600 });
    aTx(p, 'R(h) ≤ R̂_{S}(h) + √[ 2d log(em/d) / m ] + √[ log(1/δ) / 2m ]', 800, 214, tu + .8, { size: 26 });
    text(p, 'con probabilidad ≥ 1 − δ, para toda h ∈ H y toda distribución D', 800, 256, ta, { size: 22, fill: COL.dim });
    text(p, '¿Se puede mejorar?', 800, 340, ta + 1.8, { size: 28, weight: 600 });
    text(p, 'Cota inferior', 800, 440, tl, { size: 30, fill: HUE.low, weight: 600 });
    text(p, 'para todo algoritmo de aprendizaje A', 800, 494, tg, { size: 26 });
    text(p, 'existen una distribución D y una función objetivo f ∈ H', 800, 536, te, { size: 26 });
    aTx(p, 'tales que  R_{D}(h_{S}, f) > piso,  con probabilidad ≥ constante', 800, 578, te + 3.2, { size: 26, font: UI });
    aTx(p, 'h_{S}: la hipótesis que A devuelve al recibir la muestra S', 800, 624, te + 3.8, { size: 22, fill: COL.dim, font: UI });
    text(p, 'No es el defecto de un algoritmo: es un límite de todos.', 800, 836, tf, { size: 30, fill: COL.task, anchor: 'middle', weight: 600 });
  }],

  ['trampa', 'La distribución difícil', (m) => {
    const p = panel(0), ts = m('set'), tm = m('mass'), td = m('draw'), tn = m('seen'), tu = m('unseen'), tc = m('coin'), th = m('half'), K = 170 / aP0, RX = 1090;
    aNote(p, `datos ilustrativos: d = ${aD}, m = ${aM} · muestra extraída en la página`);
    text(p, 'cómo se construye la distribución difícil (demostración del teorema 3.20)', 100, 120, .3, { size: 22, fill: COL.dim });
    text(p, `X: d = ${aD} puntos que H fragmenta`, 100, 168, ts, { size: 30, fill: COL.task, weight: 600 });
    const pts = aIdx.map(i => { const q = aCoinPt(p, aRX(i), aRY, i ? 15 : 22); put(q.g, { o: 0 }); show(q.g, .2 + i * .04, .3); return q; });
    aIdx.forEach(i => aTx(p, `x_{${i}}`, aRX(i), aRY + 54, ts + .4, { size: 24, fill: COL.dim, anchor: 'middle' }));
    // la masa de cada punto, a escala
    aIdx.forEach(i => { const e = put(mk('rect', { x: aRX(i) - 20, y: 594, width: 40, height: 0, fill: COL.chalk, 'fill-opacity': .8 }, p), {}); tw(e, { a_height: (i ? aPi : aP0) * K }, tm + (i ? 2.6 : .2), .8, out); });
    aTx(p, `P[x_{0}] = ${aFmt(aP0)}`, aRX(0), 804, tm + .8, { size: 24, anchor: 'middle', font: UI });
    aTx(p, `P[x_{i}] = ${aN(aPi)} cada uno · barras a escala`, aRX(1) - 20, 638, tm + 3.2, { size: 24, font: UI });
    text(p, 'D: casi toda la probabilidad en un punto', RX, 200, tm, { size: 24, weight: 600 });
    aTx(p, 'P[x_{0}] = 1 − 8ε', RX, 246, tm + .6, { size: 28 });
    aTx(p, 'P[x_{i}] = 8ε / (d − 1),   i ≥ 1', RX, 290, tm + 2.6, { size: 28 });
    text(p, `ecuación (3.32) · aquí ε = ${aN(aEps)}`, RX, 326, tm + 3.2, { size: 22, fill: COL.dim });
    // la muestra: cada ejemplo cae sobre su punto y muestra la etiqueta
    const stack = aIdx.map(() => 0);
    aS.forEach((i, j) => {
      const t = td + .3 + j * .12, e = put(mk('circle', { r: 7, fill: aHue(aF[i]) }, p), { x: aRX(i), y: 190, o: 0 });
      tw(e, { o: 1, y: aRY - (i ? 34 : 42) - stack[i]++ * 15 }, t, .35, out);
      if (stack[i] === 1) tw(pts[i].c, { c_fill: aHue(aF[i]) }, t + .3, .2);
    });
    text(p, `muestra S: m = ${aM} ejemplos`, RX, 400, td, { size: 26, weight: 600 });
    aTx(p, `${aCnt[0]} caen en x_{0}`, RX, 440, td + 2.9, { size: 26, font: UI });
    text(p, `puntos raros vistos: ${aSeen.length} de ${aD - 1}`, RX, 480, tn, { size: 26 });
    aSeen.forEach(i => pulse(pts[i].g, tn + .2, 1.6));
    text(p, `sin ver: ${aUn.length}`, RX, 520, tu, { size: 26, fill: HUE.low, weight: 600 });
    aUn.forEach((i, k) => {
      text(p, '?', aRX(i), aRY - 30, tu + k * .08, { size: 36, weight: 700, anchor: 'middle' });
      for (let n = 0; n < 6; n++) tw(pts[i].c, { c_fill: aHue((n + k) % 2) }, tc + .6 + n * .75, .3);
      tw(pts[i].c, { c_fill: HUE.pos }, th, .3); show(pts[i].h, th, .3);
    });
    aTx(p, `2^{${aUn.length}} = ${2 ** aUn.length} etiquetados de los no vistos:`, RX, 600, tc + 1.6, { size: 22, font: UI });
    text(p, 'todos en H y compatibles con S', RX, 630, tc + 4.6, { size: 22 });
    text(p, 'Sobre los puntos no vistos, cualquier algoritmo acierta en promedio la mitad.', 860, 850, th + 1, { size: 28, fill: COL.task, anchor: 'middle', weight: 600 });
  }],

  ['teo320', 'Cota inferior, caso realizable', (m) => {
    const p = panel(0), tc = m('cnt'), th = m('half'), te = m('exp'), tt = m('thm'), tg = m('grow'), tf = m('fall'), ti = m('inf'), X = i => 130 + i * 74, Y = 196, k = 75000;
    aNote(p, 'la muestra del dibujo anterior · valores calculados en la página');
    text(p, 'la misma muestra: puntos raros vistos y sin ver', 100, 130, .3, { size: 22, fill: COL.dim });
    const rings = [];
    aIdx.forEach(i => {
      const q = aCoinPt(p, X(i), Y, i ? 14 : 19, aCnt[i] ? aHue(aF[i]) : HUE.pos);
      if (!aCnt[i]) { put(q.h, { o: 1 }); rings.push(put(mk('circle', { r: 23, fill: 'none', stroke: HUE.low, 'stroke-width': 3 }, p), { x: X(i), y: Y, o: 0 })); }
      put(q.g, { o: 0 }); show(q.g, .2, .4);
      aTx(p, `x_{${i}}`, X(i), Y + 50, .3, { size: 22, fill: COL.dim, anchor: 'middle' });
    });
    text(p, 'ε se elige para que, casi siempre,', 800, 180, tc, { size: 24 });
    text(p, 'la muestra vea a lo sumo (d − 1)/2 puntos raros', 800, 214, tc + 1.6, { size: 24 });
    rings.forEach(e => show(e, th, .3));
    text(p, `aquí: ${aUn.length} sin ver de ${aD - 1} · en cada uno, el algoritmo falla con probabilidad ½`, 130, 300, th, { size: 24, fill: HUE.low, weight: 600 });
    aTx(p, 'E_{f} [ R_{D}(h_{S}, f) ]  ≥  ½ · (d − 1)/2 · 8ε/(d − 1)  =  2ε', 130, 372, te, { size: 34, weight: 600 });
    text(p, '½: moneda al aire · (d − 1)/2: puntos no vistos, como mínimo · 8ε/(d − 1): probabilidad de cada uno · (3.33)', 130, 412, te + 1.4, { size: 22, fill: COL.dim });
    text(p, `en el dibujo:  ½ · ${aUn.length} · ${aN(aPi)} = ${aN(aExp)}  ≥  2ε = ${aN(2 * aEps)}`, 130, 446, te + 2.6, { size: 22, fill: COL.dim });
    text(p, 'Teorema 3.20 · caso realizable', 130, 520, tt, { size: 30, fill: COL.task, weight: 600 });
    text(p, 'VCdim(H) = d > 1 · para todo algoritmo A y todo m ≥ 1 existen D y f ∈ H tales que', 610, 520, tt + 1.4, { size: 22, fill: COL.dim });
    aTx(p, 'S ∼ D^{m}:    P[ R_{D}(h_{S}, f) > (d − 1) / (32m) ]  ≥  1/100', 130, 582, tt + 5.4, { size: 38, fill: COL.task, weight: 600 });
    text(p, '(3.31)', 1180, 580, tt + 5.4, { size: 22, fill: COL.dim });
    const rows = (x, head, list, t) => {
      text(p, head, x, 654, t, { size: 24, weight: 600 });
      list.forEach(([lab, v], i) => { const y = 694 + i * 36, t1 = t + .4 + i * .35; aTx(p, lab, x, y, t1, { size: 24 }); aBar(p, x + 160, y, v * k, t1, HUE.low); text(p, v.toFixed(3), x + 174 + v * k, y, t1 + .3, { size: 24, weight: 600 }); });
    };
    rows(130, 'el piso (d − 1)/(32m) crece con d  ·  m = 1 000', [33, 65, 129].map(d => [`d = ${d}`, aLow(d, 1000)]), tg);
    rows(840, 'y baja con m  ·  d = 129', [[1000, '1 000'], [2000, '2 000'], [4000, '4 000']].map(([n, s]) => [`m = ${s}`, aLow(129, n)]), tf);
    text(p, 'VCdim(H) = +∞: el piso no baja con m. No hay aprendizaje PAC, ni en el caso realizable.', 800, 838, ti, { size: 28, fill: COL.task, anchor: 'middle', weight: 600 });
  }],

  ['q1', 'Comprobación', () => {
    const p = panel(0), Y = 430, pick = [0, aSeen[0], aUn.find(i => i > aSeen[0])];
    T(p, `La muestra del ejemplo: m = ${aM} ejemplos sobre ${aD} puntos fragmentados`, { x: 100, y: 130, size: 30, fill: COL.task, weight: 600 });
    T(p, 'sobre cada punto, cuántas veces apareció en la muestra · color: la etiqueta que mostró', { x: 100, y: 176, size: 22, fill: COL.dim });
    S.q1 = [];
    aIdx.forEach(i => {
      const g = G(p), n = pick.indexOf(i);
      mk('circle', { cx: aRX(i), cy: Y, r: i ? 17 : 24, fill: aCnt[i] ? aHue(aF[i]) : COL.dim }, g);
      T(g, String(aCnt[i]), { x: aRX(i), y: Y - 46, size: 28, anchor: 'middle', weight: 600, fill: aCnt[i] ? COL.chalk : COL.dim });
      if (n >= 0) { T(g, 'ABC'[n], { x: aRX(i), y: Y + 78, size: 34, weight: 700, fill: HUE.hyp, anchor: 'middle' }); S.q1[n] = g; }
    });
    T(p, 'gris: sin ver', { x: 1090, y: Y + 8, size: 22, fill: COL.dim });
    S.q1i = pick;
  }, { ask: done => quiz(BAND, [{
    id: 'c-novisto', prompt: ['¿En cuál de los puntos A, B o C el algoritmo solo puede adivinar la etiqueta?'],
    build: pickEls(S.q1i.map((i, n) => ({ el: S.q1[n], box: [aRX(i) - 45, 350, 90, 180], label: 'punto ' + 'ABC'[n] })), 2,
      'No apareció en la muestra y el conjunto está fragmentado: las dos etiquetas siguen siendo posibles.',
      n => `Ese punto apareció ${aCnt[S.q1i[n]] === 1 ? 'una vez' : aCnt[S.q1i[n]] + ' veces'} en la muestra: su etiqueta ya se conoce.`),
  }], done) }],

  ['ruido', 'Dos monedas casi iguales', (m) => {
    const p = panel(0), tn = m('noise'), t2 = m('two'), tl = m('look'), tf = m('few'), tm = m('more'), ty = m('many'), te = m('lem'), tx = m('exp'), ts = [tf, tm, ty];
    aNote(p, `curvas exactas (binomial) con α = ${aAl} · tiradas con semilla`);
    text(p, 'Caso no realizable: la etiqueta de un punto es una moneda', 100, 130, .3, { size: 30, fill: COL.task, weight: 600 });
    const one = put(mk('circle', { cx: 1040, cy: 120, r: 16, fill: COL.dim }, p), { o: 0 });
    show(one, tn, .3);
    for (let n = 0; n < 6; n++) tw(one, { c_fill: aHue(n % 2) }, tn + .5 + n * .6, .25);
    text(p, 'el mismo punto, con etiqueta 1 o 0', 1076, 128, tn + .4, { size: 22, fill: COL.dim });
    aToss.forEach((row, r) => {
      const y = 204 + r * 56, c = aHue(1 - r);
      aTx(p, `moneda ${r ? '−' : '+'}:   P[1] = ½ ${r ? '−' : '+'} α/2 = ${aFmt(.5 + (r ? -1 : 1) * aAl / 2)}`, 100, y + 9, t2 + (r ? 4.6 : 1.6), { size: 26, fill: c, weight: 600, font: UI });
