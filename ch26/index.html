<script>
'use strict';
const CHAPTER = { number: 26, title: 'Maxent: garantía, algoritmo y regularización', minutes: 7, language: 'es', next: '../ch27/' };

/* ---------- helpers de dibujo del capítulo (los genéricos, copiados del cap. 25) ---------- */
// Maxent: tiza = la muestra, la distribución empírica y lo que se mide sobre ella · ámbar = la distribución p, sus pesos w y lo que el algoritmo elige ·
// rosa = la previa p₀ · violeta = la restricción (λ, las franjas), la regularización y los términos de complejidad.
const HUE = { emp: COL.chalk, p: COL.task, pri: COL.rat, cx: COL.real, ok: COL.good, bad: COL.bad };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500, font = UI } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, font, o: 0 }); show(e, t0); return e; };
// Texto con subíndices y superíndices: 'p_{w}', 'D^{m}'. Con t0 = null queda visible desde el inicio. e._set(str) lo reescribe. No anida llaves.
const aSYM = /([αβεγδηθφρσλμξΦΨΠΛΩΣΔ‖ℜℝ√∑∏⟹⟺⟷≈∼∞⊤†∈∃→←↦′″⌊⌋½∇∝])/;                                 // símbolos que van siempre en la fuente matemática
const aFill = (e, str, size, font) => {
  e.replaceChildren();
  let prev = 0;
  str.split(/([_^]\{[^}]*\})/).forEach(s => {
    if (!s) return;
    const k = /^[_^]\{/.test(s) ? (s[0] === '_' ? 1 : -1) : 0, dy = k > 0 ? size * .22 : k < 0 ? -size * .38 : 0;
    (k ? s.slice(2, -1) : s).split(aSYM).filter(q => q).forEach((q, n) => { mk('tspan', { dy: n ? 0 : dy - prev, ...(k ? { 'font-size': size * .68 } : {}), ...(aSYM.test(q) && font !== MATH ? { 'font-family': MATH } : {}) }, e).textContent = q; });
    prev = dy;
  });
};
const aTx = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500, font = MATH } = {}) => {
  const e = T(p, '', { x, y, size, fill, anchor, weight, font, o: t0 == null ? 1 : 0 });
  aFill(e, str, size, font); e._set = s => aFill(e, s, size, font);
  if (t0 != null) show(e, t0);
  return e;
};
// Varias piezas de aTx en una línea: [texto, color, fuente, tamaño]; t0 puede ser una lista con un instante por pieza.
const aRow = (p, parts, x, y, t0, opts = {}) => { const xs = [], els = parts.map(([str, fill, font, size], k) => { xs.push(x); const e = aTx(p, str, x, y, Array.isArray(t0) ? t0[k] : t0, { ...opts, fill: fill || COL.chalk, ...(font ? { font } : {}), ...(size ? { size } : {}) }); x += e.getComputedTextLength(); return e; }); els.xs = xs; els.end = x; return els; };
const aNote = (p, str) => aTx(p, str, 1570, 884, .4, { size: 22, fill: COL.dim, anchor: 'end', font: UI });
const aTitle = (p, str) => text(p, str, 100, 130, .3, { size: 30, fill: COL.task, weight: 600 });
const aSq = (p, x, y, col, lab, { line = false, dash = null, dot = false } = {}) => { mk(line ? 'path' : dot ? 'circle' : 'rect', line ? { d: `M${x} ${y - 8}h30`, stroke: col, 'stroke-width': 4, fill: 'none', ...(dash ? { 'stroke-dasharray': dash } : {}) } : dot ? { cx: x + 15, cy: y - 8, r: 9, fill: col } : { x: x + 6, y: y - 17, width: 18, height: 18, fill: col }, p); return aTx(p, lab, x + 42, y, null, { size: 22, fill: COL.dim, font: UI }); };   // entrada de leyenda
const aSetA = (e, o) => { Object.entries(o).forEach(([k, v]) => e.setAttribute(k, typeof v === 'number' ? v.toFixed(1) : v)); return e; };
const aHalo = e => { [['stroke', COL.board], ['stroke-width', 7], ['paint-order', 'stroke'], ['stroke-linejoin', 'round']].forEach(([k, v]) => e.setAttribute(k, v)); return e; };   // borde del color de la pizarra: el texto se lee sobre líneas

/* aMATH:begin — cuentas del capítulo, sin dibujo (se prueban aparte con Node) */
const aSum = v => v.reduce((s, u) => s + u, 0);
const aRng = seed => () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
// --- Ejemplo ilustrativo, el del cap. 25: X = las seis caras de un dado cargado; aD es la distribución D, que el aprendiz no conoce; la misma muestra (semilla 43, m = 60).
const aK = 6, aD = [.07, .10, .13, .17, .23, .30], aU = Array(aK).fill(1 / aK);
const aDraw = (seed, n, d = aD) => { const r = aRng(seed); return Array.from({ length: n }, () => { let u = r(), j = 0; while (j < d.length - 1 && u >= d[j]) { u -= d[j]; j++; } return j; }); };
const aSeed = 43, aMs = 60, aS = aDraw(aSeed, aMs);
const aCnt = S0 => { const c = Array(aK).fill(0); S0.forEach(j => c[j]++); return c; };
const aEmp = S0 => aCnt(S0).map(c => c / S0.length);                                      // la distribución empírica
const aCn = aCnt(aS), aDh = aEmp(aS);
// --- Características nuevas de este capítulo: N = 6 indicadores, Φ_j(x) = 1 si x es la cara j y 0 si no. Valores en [0, 1]: r = 1.
const aN = 6, aR = 1, aPhiV = (j, x) => x === j ? 1 : 0;
const aFeat = d => Array.from({ length: aN }, (_, j) => aSum(d.map((v, x) => v * aPhiV(j, x))));   // E_d[Φ], un promedio por característica
const aMuH = aFeat(aDh), aMuT = aFeat(aD);
const aWx = (w, x) => aSum(w.map((v, j) => v * aPhiV(j, x)));                             // w · Φ(x)
// Distribuciones de Gibbs (12.9) con previa uniforme:  p_w[x] = p0[x] e^{w·Φ(x)} / Z(w).
const aZ = w => aSum(aU.map((v, x) => v * Math.exp(aWx(w, x))));
const aGibbs = w => { const e = aU.map((v, x) => v * Math.exp(aWx(w, x))), z = aSum(e); return e.map(v => v / z); };
const aN1 = w => aSum(w.map(Math.abs)), aN2 = w => Math.sqrt(aSum(w.map(v => v * v))), aNul = w => w.filter(v => v === 0).length;
const aDotV = (u, v) => aSum(u.map((a, j) => a * v[j]));
// §12.7:  J(w) = λ‖w‖₁ − w · E_D̂[Φ] + log Σ_x p0[x] e^{w·Φ(x)}: el objetivo de (12.12) sin su término constante.
const aJ = (w, lam, mu = aMuH) => lam * aN1(w) - aDotV(w, mu) + Math.log(aZ(w));
// Pérdida logarítmica L_d(w) = E_{x∼d}[−log p_w[x]]; con d = aD es la real, con d = aDh es la empírica.
const aLoss = (w, d = aD) => { const p = aGibbs(w); return -aSum(d.map((v, x) => v > 0 ? v * Math.log(p[x]) : 0)); };
const aEnt = p => -aSum(p.map(v => v > 0 ? v * Math.log(v) : 0));
// ε_j = E_{p_w}[Φ_j] − E_D̂[Φ_j]   y   δJ(w, e_j), con sus tres casos (§12.7).
const aEps = (w, mu = aMuH) => aFeat(aGibbs(w)).map((v, j) => v - mu[j]);
const aDJ = (w, eps, lam) => w.map((v, j) => v !== 0 ? lam * Math.sign(v) + eps[j] : Math.abs(eps[j]) <= lam ? 0 : -lam * Math.sign(eps[j]) + eps[j]);
// El paso en forma cerrada (líneas 9 a 13 de la figura 12.2).
const aEta = (wj, ej, lam, r = aR) => { const q = wj * r * r - ej; return Math.abs(q) <= lam ? -wj : q > lam ? (-lam - ej) / (r * r) : (lam - ej) / (r * r); };
// CDMaxent (figura 12.2) desde w = 0. Se detiene cuando la mayor |δJ| baja de tol. keep: guarda cada paso (coordenada, derivada, paso, w y J).
const aCD = (lam, { mu = aMuH, tol = 1e-10, max = 40000, keep = false } = {}) => {
  let w = Array(aN).fill(0), t = 0; const steps = [];
  for (; t < max; t++) {
    const eps = aEps(w, mu), d = aDJ(w, eps, lam); let j = 0; d.forEach((v, k) => { if (Math.abs(v) > Math.abs(d[j])) j = k; });
    if (Math.abs(d[j]) < tol) break;
    const eta = aEta(w[j], eps[j], lam); w = w.slice(); w[j] += eta;
    if (keep) steps.push({ t: t + 1, j, d: d[j], eta, w, J: aJ(w, lam, mu) });
  }
  return { lam, w, T: t, steps, p: aGibbs(w) };
};
// (12.16):  min_w λ‖w‖₂² − (1/m) Σ log p_w[x_i], por descenso de gradiente (objetivo suave y fuertemente convexo). Gradiente: 2λw + E_{p_w}[Φ] − E_D̂[Φ].
const aL2 = (lam, mu = aMuH) => { let w = Array(aN).fill(0), it = 0; const sz = 1 / (2 * lam + 1); for (; it < 200000; it++) { const e = aEps(w, mu), g = w.map((v, j) => 2 * lam * v + e[j]); if (Math.max(...g.map(Math.abs)) < 1e-12) break; w = w.map((v, j) => v - sz * g[j]); } return { lam, w, it, p: aGibbs(w) }; };
const aJ2 = (w, lam, mu = aMuH) => lam * aSum(w.map(v => v * v)) - aDotV(w, mu) + Math.log(aZ(w));
// --- Los valores del capítulo.
const aLam = .07, aRun = aCD(aLam, { keep: true }), aWs = aRun.w, aPs = aRun.p, aJs = aJ(aWs, aLam), aShow = 20;
const aA = 1, aB = 5;                                                                      // las dos coordenadas que se mueven: los pesos de las caras 2 y 6
const aInPl = aRun.steps.every(s => s.j === aA || s.j === aB);
const aT3 = aRun.steps.findIndex(s => s.J - aJs < 1e-3) + 1;                               // pasos hasta quedar a menos de 0.001 del mínimo
const aRunL2 = aL2(aLam), aW2s = aRunL2.w, aP2s = aRunL2.p;
// --- Teorema 12.3. Pérdida real de la solución, la mejor posible y el λ del teorema.
const aHD = aEnt(aD), aLDs = aLoss(aWs), aLDu = aLoss(Array(aN).fill(0));
const aDelta = .05;
// ℜ_m(H) para H = {±Φ_j}: E[ max_j |Σ_i σ_i Φ_j(x_i)| ] / m, estimada por simulación con semilla (reps muestras de tamaño m con sus signos).
const aRadM = (m, reps = 4000, seed = 7) => { const r = aRng(seed); let acc = 0; for (let k = 0; k < reps; k++) { const s = Array(aN).fill(0); for (let i = 0; i < m; i++) { let u = r(), x = 0; while (x < aK - 1 && u >= aD[x]) { u -= aD[x]; x++; } const sg = r() < .5 ? -1 : 1; for (let j = 0; j < aN; j++) s[j] += sg * aPhiV(j, x); } acc += Math.max(...s.map(Math.abs)); } return acc / reps / m; };
const aRadR = 4000, aRad = aRadM(aMs, aRadR), aConf = aR * Math.sqrt(Math.log(2 / aDelta) / (2 * aMs)), aLamT = 2 * aRad + aConf, aRunT = aCD(aLamT);
const aDev = Math.max(...aMuH.map((v, j) => Math.abs(v - aMuT[j])));                       // ‖E_D[Φ] − E_D̂[Φ]‖_∞ en esta muestra
// Curva de la pérdida real de la solución en función de λ, y los dos extremos que recorre el dial.
const aLmax = .4, aLmin = .005, aAt = lam => aCD(Math.max(aLmin, lam));
const aCurve = Array.from({ length: 161 }, (_, k) => { const lam = Math.max(aLmin, aLmax * k / 160); return [lam, aLoss(aCD(lam).w)]; });
const aLlo = .01, aLhi = .26, aLDlo = aLoss(aCD(aLlo).w), aLDhi = aLoss(aCD(aLhi).w);
// --- Teorema 12.5. w*: el de menor norma 2 entre los que logran inf_w L_D(w) (aquí, log D menos su media). Λ₂ = ‖w*‖₂.
const aWst = (() => { const l = aD.map(Math.log), c = aSum(l) / aK; return l.map(v => v - c); })();
const aLa2 = aN2(aWst), aC5 = (1 + Math.sqrt(Math.log(1 / aDelta))) ** 2;
const aLamB = m => aR / (aLa2 * Math.sqrt(m)), aExc = m => aR * aLa2 / Math.sqrt(m) * (1 + aC5), aM2 = 240;
const aLD2 = aLoss(aW2s);
// --- Comprobaciones. 1: tres soluciones de (12.12) con λ medio, grande y chico. 2: las derivadas δJ en un estado intermedio del recorrido.
const aQ1 = [['mid', aLam], ['big', aLhi], ['small', aLlo]], aQ1r = 1;
const aQ2t = 3, aQ2w = aRun.steps[aQ2t - 1].w, aQ2d = aDJ(aQ2w, aEps(aQ2w), aLam), aQ2r = aRun.steps[aQ2t].j;
const aF2 = v => (Math.abs(v) < .005 ? 0 : v).toFixed(2).replace('-', '−');
const aF3 = v => (Math.abs(v) < .0005 ? 0 : v).toFixed(3).replace('-', '−');
const aF4 = v => (Math.abs(v) < .00005 ? 0 : v).toFixed(4).replace('-', '−');
const aF1 = v => String(Math.round(v * 10) / 10).replace('-', '−');
/* aMATH:end */

let aClipN = 0;
// Histograma sobre las seis caras, con base en yb y esquina izquierda en x0. Cuatro capas, que empiezan ocultas: franja violeta de ancho λ alrededor de cada
// frecuencia empírica (hg.gb) · barra ancha de tiza = distribución empírica (hg.ge) · barra angosta ámbar = p (hg.gp) · trazo rosa de rayas = la previa (hg.g0).
// hg.setE(d), hg.setP(d), hg.setP0(d) fijan las alturas; hg.setB(d, lam) coloca las franjas (recortadas en 0 y en cap) · hg.cx(j): centro de la cara de índice j.
const aHg = (p, x0, yb, { slot = 90, sc = 600, we = 60, wp = 30, t0 = .4, size = 24, tag = true, cap = .46 } = {}) => {
  const g = G(p, { o: t0 == null ? 1 : 0 }), cx = j => x0 + slot * (j + .5), hg = { g, cx, x0, yb, slot, sc, W: slot * aK };
  if (t0 != null) show(g, t0);
  hg.gb = G(g, { o: 0 });
  const bb = aU.map((_, j) => mk('rect', { x: cx(j) - slot / 2 + 5, width: slot - 10, fill: HUE.cx, 'fill-opacity': .34, stroke: HUE.cx, 'stroke-width': 2 }, hg.gb));
  mk('path', { d: `M${x0 - 8} ${yb}H${x0 + slot * aK + 8}`, stroke: COL.dim, 'stroke-width': 2 }, g);
  hg.ge = G(g, { o: 0 }); hg.gp = G(g, { o: 0 }); hg.g0 = G(g, { o: 0 });
  const be = aU.map((_, j) => mk('rect', { x: cx(j) - we / 2, width: we, fill: HUE.emp, 'fill-opacity': .2, stroke: HUE.emp, 'stroke-width': 2.5 }, hg.ge));
  const bp = aU.map((_, j) => mk('rect', { x: cx(j) - wp / 2, width: wp, fill: HUE.p }, hg.gp));
  const b0 = aU.map(() => mk('path', { stroke: HUE.pri, 'stroke-width': 4, 'stroke-dasharray': '9 6', fill: 'none' }, hg.g0));
  const bar = bs => d => d.forEach((v, j) => aSetA(bs[j], { y: yb - v * sc, height: v * sc }));
  hg.setE = bar(be); hg.setP = bar(bp);
  hg.setP0 = d => d.forEach((v, j) => b0[j].setAttribute('d', `M${(cx(j) - slot / 2 + 3).toFixed(1)} ${(yb - v * sc).toFixed(1)}h${slot - 6}`));
  hg.setB = (d, lam) => d.forEach((v, j) => { const top = Math.min(cap, v + lam), bot = Math.max(0, v - lam); aSetA(bb[j], { y: yb - top * sc, height: Math.max(0, top - bot) * sc }); });
  aU.forEach((_, j) => aTx(g, String(j + 1), cx(j), yb + size + 10, null, { size, fill: COL.dim, anchor: 'middle' }));
  if (tag) aTx(g, 'x', x0 - 18, yb + size + 10, null, { size, fill: COL.dim, anchor: 'end' });
  return hg;
};
// Pesos bajo un histograma: una barra ámbar por peso, alineada con su cara, hacia arriba si es positivo. Un peso exactamente nulo se marca con un aro.
// wb.set(w) los fija; val: escribe el valor junto a cada barra no nula.
const aWB = (p, hg, yb, { sc = 90, bw = 34, tag = 'w_{j}', val = false } = {}) => {
  const g = G(p);
  mk('path', { d: `M${hg.x0 - 8} ${yb}H${hg.x0 + hg.W + 8}`, stroke: COL.dim, 'stroke-width': 2 }, g);
  const bs = aU.map((_, j) => mk('rect', { x: hg.cx(j) - bw / 2, width: bw, fill: HUE.p }, g));
  const zs = aU.map((_, j) => mk('circle', { cx: hg.cx(j), cy: yb, r: 9, fill: COL.board, stroke: COL.chalk, 'stroke-width': 3.5 }, g));
  const vs = val ? aU.map((_, j) => aTx(g, '', hg.cx(j), yb, null, { size: 22, fill: HUE.p, anchor: 'middle', weight: 700 })) : null;
  if (tag) aTx(g, tag, hg.x0 - 18, yb + 8, null, { size: 24, fill: HUE.p, anchor: 'end', weight: 700 });
  return { g, set: w => w.forEach((v, j) => { const hh = v === 0 ? 0 : Math.max(4, Math.abs(v) * sc); aSetA(bs[j], { y: v > 0 ? yb - hh : yb, height: hh }); zs[j].style.display = v === 0 ? '' : 'none'; if (vs) { vs[j]._set(v === 0 ? '' : aF2(v)); put(vs[j], { y: v > 0 ? yb - hh - 10 : yb + hh + 26 }); } }) };
};
// Dial lineal de un parámetro (lo … hi): riel, marcas, perilla y rótulo «nombre = valor». dial.set(v) lo mueve; dial.DX(v): abscisa del valor v.
const aDialW = (p, x, y, W, t0, lo, hi, ticks, name = 'λ', col = HUE.cx) => {
  const g = G(p, { o: 0 }), DX = v => x + (v - lo) / (hi - lo) * W;
  mk('path', { d: `M${x} ${y}H${x + W}`, stroke: COL.faint, 'stroke-width': 6, 'stroke-linecap': 'round', fill: 'none' }, g);
  ticks.forEach(v => { mk('path', { d: `M${DX(v)} ${y - 10}v20`, stroke: COL.dim, 'stroke-width': 2 }, g); T(g, String(v).replace('-', '−'), { x: DX(v), y: y + 42, size: 22, fill: COL.dim, anchor: 'middle', font: MATH }); });
  const gm = G(g), kn = put(mk('circle', { r: 15, fill: col, stroke: COL.board, 'stroke-width': 2 }, g), { y }), lab = aTx(g, '', 0, y - 28, null, { size: 30, fill: col, weight: 700, anchor: 'middle' });
  show(g, t0);
  return { g, gm, DX, set: v => { put(kn, { x: DX(v) }); put(lab, { x: Math.max(x + 60, Math.min(x + W - 60, DX(v))) }); lab._set(`${name} = ${aF2(v)}`); } };
};
// Gráfica de funciones de una variable: marco con esquina superior izquierda en (x0, y0) y curvas recortadas al marco. gp.fn(f, attrs) traza u ↦ f(u) y devuelve
// el trazo, que se redibuja con e._f(f) · ax: dibuja los ejes por el origen · xl: rótulo del eje horizontal.
const aGPl = (p, x0, y0, W, HH, w0, w1, v0, v1, t0, wt, vt, { ax = false, xl = 'λ', fmt = aF2 } = {}) => {
  const g = G(p, { o: 0 }), id = 'aclip' + (aClipN++), WX = w => x0 + (w - w0) / (w1 - w0) * W, VY = v => y0 + HH - (v - v0) / (v1 - v0) * HH;
  show(g, t0);
  mk('rect', { x: x0, y: y0, width: W, height: HH, fill: 'none', stroke: COL.faint, 'stroke-width': 2 }, g);
  if (ax) mk('path', { d: `M${x0} ${VY(0).toFixed(1)}h${W}M${WX(0).toFixed(1)} ${y0}v${HH}`, stroke: COL.dim, 'stroke-width': 2, fill: 'none' }, g);
  wt.forEach(v => T(g, String(v).replace('-', '−'), { x: WX(v), y: y0 + HH + 32, size: 22, fill: COL.dim, anchor: 'middle', font: MATH }));
  vt.forEach(v => T(g, fmt(v), { x: x0 - 12, y: VY(v) + 8, size: 22, fill: COL.dim, anchor: 'end', font: MATH }));
  aTx(g, xl, x0 + W + 14, y0 + HH + 8, null, { size: 26, fill: COL.dim });
  mk('rect', { x: x0, y: y0, width: W, height: HH }, mk('clipPath', { id }, g));
  const gl = G(g); gl.setAttribute('clip-path', `url(#${id})`);
  const lim = v => Math.max(v0 - 2 * (v1 - v0), Math.min(v1 + 2 * (v1 - v0), v));
  const fn = (f, attrs) => { const e = put(mk('path', { fill: 'none', 'stroke-linejoin': 'round', 'stroke-linecap': 'round', ...attrs }, gl), { o: 0 }); e._f = ff => { let d = ''; for (let k = 0; k <= 240; k++) { const w = w0 + (w1 - w0) * k / 240; d += (k ? 'L' : 'M') + WX(w).toFixed(1) + ' ' + VY(lim(ff(w))).toFixed(1); } e.setAttribute('d', d); }; e._f(f); return e; };
  return { g, gl, WX, VY, fn };
};
// Plano de dos pesos (a en horizontal, b en vertical): cuadrado de lado sz con esquina superior izquierda en (x0, y0); a va de a0 a a0 + span y b de b0 a b0 + span.
